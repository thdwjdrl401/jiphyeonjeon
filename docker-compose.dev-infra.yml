# EC2 dev 인프라 스택 — prod(liveclass)와 별개 프로젝트/포트/볼륨으로 동시 가동.
# 목적: 로컬에서 backend를 돌리면서 datasource/redis/rabbitmq만 EC2 dev 인프라에 붙여 테스트(prod 무관).
#   AI STT(Redis Streams)·배치잡(RabbitMQ, ADR-0012)을 EC2 공유 dev 인프라에서.
# 배포: CI 수동 잡 deploy-dev-infra, 또는
#   docker compose -f docker-compose.dev-infra.yml --env-file /etc/liveclass/.env.dev up -d
# ⚠️ 노출 포트(5433/4000/4001/8990)는 AWS SG + ufw로 팀 공인 IP만 허용 + 비밀번호 필수.
name: liveclass-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: liveclass-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:-liveclass}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveclass} -d ${POSTGRES_DB:-liveclass}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: liveclass-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 필요}"]
    ports:
      - "4000:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:3-management
    container_name: liveclass-rabbitmq-dev
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-liveclass}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 필요}
    ports:
      - "4001:5672"      # AMQP (dev)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # RabbitMQ 관리 UI TLS 종단 — https://…:8990 → rabbitmq:15672. HSTS-preload(*.liveclass.io) 하에서도 접속되게.
  rabbitmq-ui-tls:
    image: nginx:alpine
    container_name: liveclass-rabbitmq-ui-tls-dev
    restart: unless-stopped
    ports:
      - "8990:8990"      # https (SG 개방 포트)
    volumes:
      - ./infra/nginx/rabbitmq-ui-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on: [rabbitmq]
    # 6h마다 reload → 갱신 인증서 반영 (livekit nginx와 동일)
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  minio:                                   # 에셋 스토리지 (dev). 브라우저 presigned 대비 SG 개방 포트로 노출.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: liveclass-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 필요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 필요}
    ports:
      - "9090:9000"      # S3 API (SG 개방 포트). 콘솔(9001)은 내부 전용.
    volumes:
      - miniodata:/data

  minio-init:                              # liveclass-assets·recordings 버킷 생성
    image: minio/mc
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 필요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 필요}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set lc http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio'; sleep 1; done
        mc mb -p lc/liveclass-assets
        mc mb -p lc/recordings
        exit 0

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  certbot-etc:                # 앱 스택 certbot 발급 공유 인증서
    external: true
    name: liveclass_certbot_etc
  miniodata:
