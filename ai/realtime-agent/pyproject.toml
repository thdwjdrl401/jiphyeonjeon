[project]
name = "liveclass-realtime-agent"
version = "0.1.0"
description = "LiveKit audio capture and provider-neutral streaming STT core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
