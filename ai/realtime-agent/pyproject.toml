[project]
name = "liveclass-realtime-agent"
version = "0.1.0"
description = "LiveKit audio capture and pluggable streaming STT providers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents==1.6.6",
    "numpy>=2,<2.5",
    "websockets>=15,<17",
    "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
nemotron = [
    "accelerate>=1.10,<2",
    "librosa>=0.11,<1",
    "torch==2.13.0+cu130",
    "transformers>=5.13,<6",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
