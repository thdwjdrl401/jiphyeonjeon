[project]
name = "liveclass-ai-worker"
version = "0.1.0"
description = "LiveClass batch AI worker process scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aio-pika>=9.5,<10",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "python-pptx>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.35,<1",
    "pillow>=11,<12",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
