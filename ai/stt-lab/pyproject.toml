[project]
name = "liveclass-stt-lab"
version = "0.1.0"
description = "Reproducible STT accuracy, latency, and GPU benchmark harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "liveclass-realtime-agent[nemotron]",
    "sentencepiece>=0.2,<1",
]

[project.scripts]
stt-lab = "stt_lab.cli:main"
stt-lab-aihub = "stt_lab.aihub:main"
stt-lab-replay = "stt_lab.replay_cli:main"
stt-lab-training = "stt_lab.training_cli:main"
stt-lab-whisper-dry-run = "stt_lab.whisper_training_cli:main"
stt-lab-nemotron-prepare = "stt_lab.nemotron_training_cli:main"
stt-lab-vllm = "stt_lab.vllm_benchmark:main"

[tool.uv.sources]
liveclass-realtime-agent = { path = "../realtime-agent", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_lab"]
