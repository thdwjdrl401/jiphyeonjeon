name: "LiveClass-Nemotron-3.5-ASR-Full-Finetune"

# Required command-line values. Keeping these mandatory prevents a run from
# silently falling back to a registry model or an evaluation manifest.
init_from_nemo_model: ???

model:
  sample_rate: 16000

  train_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    use_lhotse: true
    batch_duration: 200
    quadratic_duration: 15
    num_buckets: 30
    use_bucketing: true
    concurrent_bucketing: false
    shuffle: true
    num_workers: 8
    pin_memory: true
    max_duration: 20.0
    min_duration: 0.1
    is_tarred: false
    tarred_audio_filepaths: null
    bucket_buffer_size: 10000
    shuffle_buffer_size: 10000
    prompt_dictionary: &prompt_dictionary
      ko-KR: 14
      auto: 101
    num_prompts: 128
    lang_field: target_lang
    prompt_mode_field: prompt_mode
    default_prompt_mode: langID

  validation_ds:
    manifest_filepath: ???
    sample_rate: ${model.sample_rate}
    use_lhotse: true
    use_bucketing: false
    batch_size: 8
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 20.0
    min_duration: 0.1
    prompt_dictionary: *prompt_dictionary
    num_prompts: 128
    lang_field: target_lang
    prompt_mode_field: prompt_mode
    default_prompt_mode: langID

  # Test/golden paths are intentionally not configurable in this training recipe.
  test_ds:
    manifest_filepath: null

  char_labels:
    update_labels: false
    labels: null

  tokenizer:
    update_tokenizer: false
    dir: null
    type: bpe

  spec_augment:
    _target_: nemo.collections.asr.modules.SpectrogramAugmentation
    freq_masks: 2
    time_masks: 10
    freq_width: 27
    time_width: 0.05

  optim:
    name: adamw
    lr: 1.0e-4
    betas: [0.9, 0.98]
    weight_decay: 1.0e-3
    sched:
      name: CosineAnnealing
      warmup_steps: 100
      warmup_ratio: null
      min_lr: 1.0e-6

trainer:
  devices: 1
  num_nodes: 1
  accelerator: gpu
  strategy: auto
  max_epochs: -1
  max_steps: 6000
  val_check_interval: 2000
  # Required for a true global-step interval. With 1, Lightning constrains the
  # interval to each epoch and skips 2,000 when an epoch has only 1,948 batches.
  check_val_every_n_epoch: null
  accumulate_grad_batches: 1
  gradient_clip_val: 0.5
  precision: bf16-mixed
  log_every_n_steps: 10
  enable_progress_bar: true
  num_sanity_val_steps: 2
  sync_batchnorm: false
  enable_checkpointing: false
  logger: false
  benchmark: false
  use_distributed_sampler: false
  limit_train_batches: 1.0
  limit_val_batches: 1.0

exp_manager:
  exp_dir: ???
  name: ${name}
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: val_wer
    mode: min
    save_top_k: 3
    always_save_nemo: true
  resume_if_exists: false
  resume_ignore_no_checkpoint: false
  create_wandb_logger: false
