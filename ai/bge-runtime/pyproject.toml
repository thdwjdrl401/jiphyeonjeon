[project]
name = "liveclass-bge-runtime"
version = "0.1.0"
description = "Authenticated GPU BGE-M3 embedding runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.139,<1",
    "pydantic-settings>=2.12,<3",
    "uvicorn>=0.41,<1",
]

[project.optional-dependencies]
cuda = [
    "sentence-transformers>=5.6,<6",
    "torch==2.11.0+cu128",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
