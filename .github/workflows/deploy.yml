# lazy 배포.
#
# 배포 대상이 가정용 NAT 뒤에 있어 GitHub가 들어올 수 없다. 그래서 lazy에 self-hosted 러너를
# 두고 러너가 밖으로 나가 폴링한다 — 열어야 할 포트도, 주고받을 SSH 키도 없다. 러너가 배포
# 대상과 같은 호스트라 `docker compose`를 그대로 부르면 된다.
#
# 시크릿은 GitHub Secrets가 아니라 호스트에 둔다(`LIVECLASS_SECRETS_DIR`, 기본 `~/secrets`).
# 이 호스트의 배포는 root 없이 도는 것이 원칙이라 `/etc` 아래를 쓰지 않는다(ADR-0126).
#
# 스택마다 `-lazy.yml` 오버라이드를 반드시 함께 준다. 그게 없으면 frontend가 80·443을 잡으려
# 들어 호스트 nginx와 충돌하고, MinIO가 빈 볼륨을 새로 만든다.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 배포할 스택
        required: true
        type: choice
        default: prod
        options: [prod, ai, livekit, bge-cpu, all]

concurrency:
  # 같은 호스트의 같은 스택을 동시에 건드리지 않는다.
  group: deploy-lazy
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIVECLASS_SECRETS_DIR: /home/lazy/secrets
  LIVECLASS_MINIO_DATA: /home/lazy/data/minio

jobs:
  deploy:
    runs-on: [self-hosted, lazy]
    steps:
      - uses: actions/checkout@v4

      - name: 전제 확인
        run: |
          for f in "$LIVECLASS_SECRETS_DIR/.env.prod" "$LIVECLASS_SECRETS_DIR/.env.ai" \
                   "$LIVECLASS_SECRETS_DIR/livekit/purger.env"; do
            [ -r "$f" ] || { echo "::error::$f 없음"; exit 1; }
          done
          [ -d "$LIVECLASS_MINIO_DATA" ] || { echo "::error::$LIVECLASS_MINIO_DATA 없음"; exit 1; }

      - name: 앱 스택
        if: inputs.stack == 'prod' || inputs.stack == 'all'
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.lazy.yml \
            --env-file "$LIVECLASS_SECRETS_DIR/.env.prod" \
            up -d --build --wait --wait-timeout 300
          docker compose -f docker-compose.prod.yml -f docker-compose.lazy.yml ps

      - name: AI 스택
        if: inputs.stack == 'ai' || inputs.stack == 'all'
        run: |
          docker compose -f docker-compose.ai-prod.yml -f docker-compose.ai-lazy.yml \
            --env-file "$LIVECLASS_SECRETS_DIR/.env.prod" \
            --env-file "$LIVECLASS_SECRETS_DIR/.env.ai" \
            up -d --build --wait --wait-timeout 300
          docker compose -f docker-compose.ai-prod.yml -f docker-compose.ai-lazy.yml ps

      - name: BGE 임베딩 (CPU)
        if: inputs.stack == 'bge-cpu' || inputs.stack == 'all'
        run: |
          set -a; . "$LIVECLASS_SECRETS_DIR/.env.ai"; set +a
          # 가중치를 처음 받으면 ready까지 6분 가까이 걸린다. 볼륨에 캐시되면 그 뒤로는 빠르다.
          docker compose -f docker-compose.bge-cpu.yml up -d --build --wait --wait-timeout 600
          docker compose -f docker-compose.bge-cpu.yml ps

      - name: LiveKit
        if: inputs.stack == 'livekit' || inputs.stack == 'all'
        run: |
          # egress-purger가 EGRESS_PURGE_SECRET을 필수로 받는다. env-file 없이 부르면
          # up 이전 보간 단계에서 죽는다.
          docker compose -f infra/livekit/docker-compose.yml -f infra/livekit/docker-compose.lazy.yml \
            --env-file "$LIVECLASS_SECRETS_DIR/livekit/purger.env" \
            up -d --build
          docker compose -f infra/livekit/docker-compose.yml -f infra/livekit/docker-compose.lazy.yml ps

      - name: 상태 요약
        if: always()
        run: docker ps --format 'table {{.Names}}\t{{.Status}}'
