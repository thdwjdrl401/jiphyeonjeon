# 테스트 게이트. GitLab CI의 test 스테이지를 옮긴 것이다.
#
# 옛 파이프라인은 GitLab shell executor 전용이라 잡마다 `docker run`으로 툴체인을 감싸고,
# 공유 러너에서 이름이 겹치는 자원을 `resource_group`으로 직렬화했다. GitHub Actions는 잡마다
# 격리된 VM을 주므로 그 껍데기를 전부 벗겼다 — DooD 마운트, `--network host`, root 소유 파일
# 뒷정리, 고정 포트, 90초 readiness 루프가 모두 사라졌다.
#
# 테스트는 진짜 시크릿을 하나도 쓰지 않는다. 이 워크플로는 Secrets 설정 없이 동작한다.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 접는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 바뀐 경로를 한 번만 판정해 아래 잡들이 나눠 쓴다. 옛 `changes:` 규칙과 같은 역할.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ai-api: ${{ steps.filter.outputs.ai-api }}
      ai-worker: ${{ steps.filter.outputs.ai-worker }}
      realtime-agent: ${{ steps.filter.outputs.realtime-agent }}
      bge-runtime: ${{ steps.filter.outputs.bge-runtime }}
      collisions: ${{ steps.filter.outputs.collisions }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            backend:
              - *workflow
              - 'backend/**'
            frontend:
              - *workflow
              - 'frontend/**'
            ai-api:
              - *workflow
              - 'ai/ai-api/**'
            ai-worker:
              - *workflow
              - 'ai/ai-worker/**'
            realtime-agent:
              - *workflow
              - 'ai/realtime-agent/**'
            bge-runtime:
              - *workflow
              - 'ai/bge-runtime/**'
            collisions:
              - *workflow
              - 'backend/src/main/resources/db/migration/**'
              - 'docs/decisions/**'
              - 'scripts/check-version-collisions.sh'
            compose:
              - *workflow
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.prod.yml'

  # 두 브랜치가 각자 V21__*.sql이나 같은 번호의 ADR을 만들면 git은 파일명이 달라 조용히 병합하지만
  # Flyway는 기동을 거부한다. MR 파이프라인은 소스 브랜치에서 도니 일반 테스트로는 절대 안 잡힌다.
  # (ADR-0069)
  check-collisions:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.collisions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 대상 브랜치와 대조
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bash scripts/check-version-collisions.sh FETCH_HEAD

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers가 러너의 도커 데몬에 Postgres+pgvector·Redis를 직접 띄운다.
      # 옛 CI가 필요로 하던 DooD 마운트와 --network host는 여기서 필요 없다.
      - name: gradle test
        working-directory: backend
        run: ./gradlew test --no-daemon

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      # lint·typecheck는 frontend/AGENTS.md가 완료 조건으로 요구하는데 옛 CI에는 없었다.
      # ai/* 만 lint 게이트가 있던 비대칭을 여기서 메운다.
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: vitest
        working-directory: frontend
        run: npx vitest run

  test-ai-api:
    needs: changes
    if: needs.changes.outputs.ai-api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # 평범한 postgres가 아니라 pgvector 이미지여야 한다.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: liveclass
          POSTGRES_PASSWORD: liveclass
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liveclass"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # conftest가 드라이버까지 확인한다 — ai-api는 asyncpg.
      AI_API_TEST_POSTGRES_ADMIN_URL: postgresql+asyncpg://liveclass:liveclass@127.0.0.1:5432/postgres
      AI_API_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      # 서비스 밖 파일(compose·env 예시·realtime-agent fixture)을 검증하는 가드가 있다.
      # 이 값이 없으면 그 테스트들이 조용히 skip된다.
      LIVECLASS_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai/ai-api/uv.lock
      - name: 검증
        working-directory: ai/ai-api
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest -q -p no:cacheprovider
          uv run --frozen ruff check app tests scripts
          uv run --frozen ruff format --check app tests scripts
          uv build --out-dir /tmp/dist

  test-ai-worker:
    needs: changes
    if: needs.changes.outputs.ai-worker == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: liveclass
          POSTGRES_PASSWORD: liveclass
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liveclass"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # ai-worker는 psycopg다 — ai-api의 asyncpg와 다르고, conftest가 이를 검증한다.
      AI_WORKER_TEST_ADMIN_URL: postgresql+psycopg://liveclass:liveclass@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai/ai-worker/uv.lock
      - name: 검증
        working-directory: ai/ai-worker
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest -q -p no:cacheprovider
          uv run --frozen ruff check app tests migrations scripts
          uv run --frozen ruff format --check app tests migrations scripts
          uv build --out-dir /tmp/dist

  test-realtime-agent:
    needs: changes
    if: needs.changes.outputs.realtime-agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 네이티브 확장 빌드 도구
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai/realtime-agent/uv.lock
      # CUDA extra(nemotron)는 여기서 설치하지 않는다. GPU 없이 도는 게 이 잡의 설계다.
      - name: 검증
        working-directory: ai/realtime-agent
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest -q -p no:cacheprovider
          uv run --frozen ruff check app tests scripts
          uv run --frozen ruff format --check app tests scripts
          uv build --out-dir /tmp/dist

  test-bge-runtime:
    needs: changes
    if: needs.changes.outputs.bge-runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ai/bge-runtime/uv.lock
      # CUDA/CPU extra와 모델 워밍업은 여기서 안 한다 — API·설정·wheel 빌드만 본다.
      - name: 검증
        working-directory: ai/bge-runtime
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest -q -p no:cacheprovider
          uv run --frozen ruff check app tests scripts
          uv run --frozen ruff format --check app tests scripts
          uv build --out-dir /tmp/dist

  # 운영 이미지가 빌드되는지만 본다. 배포하지 않는다.
  # 더미 값은 docker-compose.prod.yml의 `${VAR:?}` 필수 보간을 채우기 위한 것이다.
  build-images:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: prod 이미지 빌드
        env:
          POSTGRES_PASSWORD: ci
          MINIO_ROOT_PASSWORD: ci
          RABBITMQ_PASSWORD: ci
          AI_INTERNAL_SECRET: ci
          MEDIA_SOURCE_SECRET: ci
          MEDIA_CALLBACK_SECRET: ci
        run: docker compose -f docker-compose.prod.yml build backend frontend

  # 경로 필터로 건너뛴 잡은 "skipped"가 되어 required check를 애매하게 만든다.
  # 이 잡 하나만 required로 걸면 그 함정이 사라진다 — 실패나 취소가 하나라도 있으면 여기서 막힌다.
  ci-gate:
    if: always()
    needs:
      - check-collisions
      - test-backend
      - test-frontend
      - test-ai-api
      - test-ai-worker
      - test-realtime-agent
      - test-bge-runtime
      - build-images
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo '${{ toJSON(needs) }}' | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::실패한 잡이 있다"
            exit 1
          fi
          echo "통과"
