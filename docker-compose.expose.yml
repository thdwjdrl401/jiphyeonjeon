# ─────────────────────────────────────────────────────────────────────────────
# EC2 인프라 포트 공개 override (ADR-0022).
#   목적: 로컬 개발자가 remote 프로필로 EC2의 Redis(STT 스트림)/PG에 직접 붙게 한다.
#   prod compose 위에 겹쳐서 쓴다 — Redis/PG 호스트 포트를 열고 Redis에 requirepass를 건다.
#
#   사용(EC2에서):
#     cp .env.prod.example .env.prod        # EC2_REDIS_PASSWORD 등 채우기
#     docker compose -f docker-compose.prod.yml -f docker-compose.expose.yml \
#                    --env-file .env.prod up -d
#
#   ⚠️ 보안(2계층, 메모리 ec2-deployment): 이 파일은 포트를 "공개"만 한다. 반드시
#      - AWS SG 인바운드 5432/6379 → 팀 공인 IP만 허용
#      - EC2 ufw로도 소스 IP 제한
#      - Redis requirepass 필수(아래). PG는 이미 비밀번호.
#      공개 인터넷에 6379를 열면 안 된다.
# ─────────────────────────────────────────────────────────────────────────────
services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    # requirepass를 걸어 노출된 6379를 보호한다. (base compose는 비밀번호 없음)
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${EC2_REDIS_PASSWORD:?EC2_REDIS_PASSWORD 필요}"]
    ports:
      - "6379:6379"

  backend:
    # 같은 스택의 prod 백엔드도 requirepass를 알아야 Redis에 붙는다.
    environment:
      SPRING_DATA_REDIS_PASSWORD: ${EC2_REDIS_PASSWORD:?EC2_REDIS_PASSWORD 필요}
