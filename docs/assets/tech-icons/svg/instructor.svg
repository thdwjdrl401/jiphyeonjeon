<!-- 강사 = 화면 앞의 발표자. 송출하는 쪽이라 사람이 화면 '앞에' 선다.
     머리(r)와 어깨 곡선은 student.svg와 같은 값이다 — 역할만 다르고 같은 사람이라는 뜻이다.
     화면 아래변과 머리 사이에 간격을 둔다. 맞닿으면 모니터 받침처럼 읽힌다. -->
