<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img">
  <title>브라우저는 Spring이 발급한 증명 없이 어디에도 닿지 못한다</title>
  <style>
  svg {
    --surface:#131D27; --ink:#E1E9F0; --ink-soft:#9DAEBC; --ink-faint:#8496A4;
    --accent:#6FB2D8; --tally:#F2564C;
    --n-built:#4FAE83; --n-built-bg:#153024;
    --n-plan:#6B7C8B;  --n-plan-bg:#1A242D;
    --n-key:#6FB2D8;   --n-key-bg:#15303F;
    --n-data:#D9A44F;  --n-data-bg:#2C2214;
    --zone:#172129; --zone-line:#2B3A47;
    --edge:#8899A6; --edge-soft:#6A7A86;
    --page:#0D141C;
  }

  svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .box     { fill: var(--surface); stroke: var(--zone-line); stroke-width: 1.5; }
  .box.on  { fill: var(--n-built-bg); stroke: var(--n-built); }
  .box.off { fill: var(--n-plan-bg);  stroke: var(--n-plan); stroke-dasharray: 5 4; }
  .box.key { fill: var(--n-key-bg);   stroke: var(--n-key); stroke-width: 2; }
  .box.dat { fill: var(--n-data-bg);  stroke: var(--n-data); }
  .zone    { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 4 4; }
  .zone.solid { stroke-dasharray: none; }
  .t   { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .t.sm{ font-size: 12.5px; }
  .ts  { font-size: 11px; fill: var(--ink-soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .zl  { font-size: 11px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; }
  .el  { font-size: 10.5px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .el.hot { fill: var(--tally); }
  .num { font-size: 11px; font-weight: 700; fill: var(--surface); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .edge      { stroke: var(--edge); stroke-width: 1.6; fill: none; }
  .edge.off  { stroke: var(--edge-soft); stroke-dasharray: 5 4; }
  .edge.hot  { stroke: var(--tally); stroke-width: 2; }
  .head-a     { fill: var(--edge); }
  .head-a.off { fill: var(--edge-soft); }
  .head-a.hot { fill: var(--tally); }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
  </style>
  <rect x="0" y="0" width="960" height="460" fill="var(--page)"/>

        <line x1="330" y1="30" x2="330" y2="400" stroke="var(--tally)" stroke-width="1.5" stroke-dasharray="6 5"/>
        <text class="el hot" x="338" y="46">신뢰 경계 — 여기서 모든 권한이 판정된다</text>

        <!-- lane 1 -->
        <rect class="box" x="30" y="70" width="150" height="52" rx="3"/>
        <text class="t mid sm" x="105" y="92">브라우저</text>
        <text class="ts mid" x="105" y="110">쿠키 세션</text>
        <rect class="box key" x="390" y="70" width="200" height="52" rx="3"/>
        <text class="t mid sm" x="490" y="92">core-api</text>
        <text class="ts mid" x="490" y="110">세션 · 역할 · 수강 확인</text>
        <rect class="box dat" x="700" y="70" width="180" height="52" rx="3"/>
        <text class="t mid sm" x="790" y="92">PostgreSQL</text>
        <text class="ts mid" x="790" y="110">내부망 전용</text>
        <path class="edge" d="M180,96 H382"/><path class="head-a" d="M390,96 l-8,-4.5 l0,9 z"/>
        <text class="el mid" x="281" y="88">HttpOnly 쿠키 + CSRF</text>
        <path class="edge" d="M590,96 H692"/><path class="head-a" d="M700,96 l-8,-4.5 l0,9 z"/>

        <!-- lane 2 -->
        <rect class="box" x="30" y="190" width="150" height="52" rx="3"/>
        <text class="t mid sm" x="105" y="212">브라우저</text>
        <text class="ts mid" x="105" y="230">LiveKit JWT 소지</text>
        <rect class="box key" x="390" y="190" width="200" height="52" rx="3"/>
        <text class="t mid sm" x="490" y="212">core-api</text>
        <text class="ts mid" x="490" y="230">수강 확인 후 토큰 서명</text>
        <rect class="box on" x="700" y="190" width="180" height="52" rx="3"/>
        <text class="t mid sm" x="790" y="212">LiveKit SFU</text>
        <text class="ts mid" x="790" y="230">JWT 검증 후 입장</text>
        <path class="edge" d="M180,206 H382"/><path class="head-a" d="M390,206 l-8,-4.5 l0,9 z"/>
        <text class="el mid" x="281" y="198">① 토큰 요청</text>
        <path class="edge" d="M390,228 H188"/><path class="head-a" d="M180,228 l8,-4.5 l0,9 z"/>
        <text class="el mid" x="281" y="248">② 단명 JWT + 익명 identity</text>
        <path class="edge hot" d="M180,216 V276 H790 V250"/>
        <path class="head-a hot" d="M790,242 l-4.5,8 l9,0 z"/>
        <text class="el hot mid" x="480" y="292">③ WebRTC 직결 — 미디어 바이트는 Spring을 통과하지 않는다</text>

        <!-- lane 3 -->
        <rect class="box" x="30" y="320" width="150" height="52" rx="3"/>
        <text class="t mid sm" x="105" y="342">브라우저</text>
        <text class="ts mid" x="105" y="360">presigned URL 소지</text>
        <rect class="box key" x="390" y="320" width="200" height="52" rx="3"/>
        <text class="t mid sm" x="490" y="342">core-api</text>
        <text class="ts mid" x="490" y="360">소유 · 용량 · 타입 검증</text>
        <rect class="box dat" x="700" y="320" width="180" height="52" rx="3"/>
        <text class="t mid sm" x="790" y="342">MinIO / S3</text>
        <text class="ts mid" x="790" y="360">서명 검증 후 수락</text>
        <path class="edge" d="M180,336 H382"/><path class="head-a" d="M390,336 l-8,-4.5 l0,9 z"/>
        <text class="el mid" x="281" y="328">① 업로드 티켓 요청</text>
        <path class="edge" d="M390,358 H188"/><path class="head-a" d="M180,358 l8,-4.5 l0,9 z"/>
        <text class="el mid" x="281" y="378">② 만료 있는 presigned URL</text>
        <path class="edge hot" d="M180,346 V404 H790 V380"/>
        <path class="head-a hot" d="M790,372 l-4.5,8 l9,0 z"/>
        <text class="el hot mid" x="480" y="420">③ 직접 PUT — 완료 후 Spring이 실제 크기·타입을 재검증한다</text>

        <text class="el end" x="930" y="150">세 경로 모두</text>
        <text class="el end" x="930" y="166">발급자는 Spring</text>
      
</svg>
