<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img">
  <title>단일 배포 안에 그어 둔 열 개의 경계</title>
  <style>
  svg {
    --surface:#FFFFFF; --ink:#0F1B2A; --ink-soft:#4A5A6B; --ink-faint:#7C8B99;
    --accent:#1D4E6F; --tally:#D9342B;
    --n-built:#2C7A5B; --n-built-bg:#E4F2EB;
    --n-plan:#94A3AF;  --n-plan-bg:#EDF1F4;
    --n-key:#1D4E6F;   --n-key-bg:#E1EDF4;
    --n-data:#A96F16;  --n-data-bg:#F8EFDD;
    --zone:#EDF1F4; --zone-line:#C3CFD9;
    --edge:#5A6C7B; --edge-soft:#9DAAB6;
    --page:#FFFFFF;
  }

  svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .box     { fill: var(--surface); stroke: var(--zone-line); stroke-width: 1.5; }
  .box.on  { fill: var(--n-built-bg); stroke: var(--n-built); }
  .box.off { fill: var(--n-plan-bg);  stroke: var(--n-plan); stroke-dasharray: 5 4; }
  .box.key { fill: var(--n-key-bg);   stroke: var(--n-key); stroke-width: 2; }
  .box.dat { fill: var(--n-data-bg);  stroke: var(--n-data); }
  .zone    { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 4 4; }
  .zone.solid { stroke-dasharray: none; }
  .t   { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .t.sm{ font-size: 12.5px; }
  .ts  { font-size: 11px; fill: var(--ink-soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .zl  { font-size: 11px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; }
  .el  { font-size: 10.5px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .el.hot { fill: var(--tally); }
  .num { font-size: 11px; font-weight: 700; fill: var(--surface); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .edge      { stroke: var(--edge); stroke-width: 1.6; fill: none; }
  .edge.off  { stroke: var(--edge-soft); stroke-dasharray: 5 4; }
  .edge.hot  { stroke: var(--tally); stroke-width: 2; }
  .head-a     { fill: var(--edge); }
  .head-a.off { fill: var(--edge-soft); }
  .head-a.hot { fill: var(--tally); }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="var(--page)"/>

        <text class="zl" x="30" y="30">의존 방향 ↓ · 위가 소비자, 아래가 공급자</text>

        <rect class="box key" x="380" y="45" width="200" height="54" rx="3"/>
        <text class="t mid" x="480" y="68">curriculum</text>
        <text class="ts mid" x="480" y="86">카탈로그 · 구조 · 발행</text>

        <rect class="box on" x="300" y="155" width="180" height="54" rx="3"/>
        <text class="t mid sm" x="390" y="178">video</text>
        <text class="ts mid" x="390" y="196">Egress · 녹화물</text>
        <rect class="box on" x="540" y="155" width="180" height="54" rx="3"/>
        <text class="t mid sm" x="630" y="178">live</text>
        <text class="ts mid" x="630" y="196">세션 · 토큰 · 채팅</text>

        <rect class="box on" x="300" y="265" width="180" height="54" rx="3"/>
        <text class="t mid sm" x="390" y="288">lesson</text>
        <text class="ts mid" x="390" y="306">레슨 · 자료</text>
        <rect class="box on" x="540" y="265" width="180" height="54" rx="3"/>
        <text class="t mid sm" x="630" y="288">enrollment</text>
        <text class="ts mid" x="630" y="306">수강 · 로스터</text>

        <rect class="box on" x="300" y="375" width="180" height="54" rx="3"/>
        <text class="t mid sm" x="390" y="398">asset</text>
        <text class="ts mid" x="390" y="416">presigned 업로드</text>
        <rect class="box on" x="540" y="375" width="180" height="54" rx="3"/>
        <text class="t mid sm" x="630" y="398">auth</text>
        <text class="ts mid" x="630" y="416">계정 · 세션</text>

        <!-- side -->
        <rect class="box off" x="785" y="155" width="145" height="50" rx="3"/>
        <text class="t mid sm" x="857" y="176">learning</text>
        <text class="ts mid" x="857" y="193">배선 없음</text>
        <rect class="box off" x="785" y="240" width="145" height="50" rx="3"/>
        <text class="t mid sm" x="857" y="261">aiintegration</text>
        <text class="ts mid" x="857" y="278">배선 없음</text>
        <rect class="box" x="785" y="375" width="145" height="50" rx="3"/>
        <text class="t mid sm" x="857" y="396">common</text>
        <text class="ts mid" x="857" y="413">공용 · 무의존</text>

        <!-- curriculum edges -->
        <path class="edge" d="M440,99 V127 H390 V147"/>
        <path class="head-a" d="M390,155 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M480,99 V122 H250 V292 H292"/>
        <path class="head-a" d="M300,292 l-8,-4.5 l0,9 z"/>
        <path class="edge" d="M520,99 V122 H762 V292 H728"/>
        <path class="head-a" d="M720,292 l8,-4.5 l0,9 z"/>
        <path class="edge" d="M462,99 V110 H232 V402 H292"/>
        <path class="head-a" d="M300,402 l-8,-4.5 l0,9 z"/>
        <path class="edge" d="M540,99 V110 H748 V402 H728"/>
        <path class="head-a" d="M720,402 l8,-4.5 l0,9 z"/>

        <!-- video / live -->
        <path class="edge" d="M480,182 H532"/>
        <path class="head-a" d="M540,182 l-8,-4.5 l0,9 z"/>
        <path class="edge" d="M360,209 V257"/>
        <path class="head-a" d="M360,265 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M580,209 V237 H420 V257"/>
        <path class="head-a" d="M420,265 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M660,209 V257"/>
        <path class="head-a" d="M660,265 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M720,180 H736 V352 H660 V367"/>
        <path class="head-a" d="M660,375 l-4.5,-8 l9,0 z"/>

        <!-- lesson / enrollment -->
        <path class="edge" d="M360,319 V367"/>
        <path class="head-a" d="M360,375 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M630,319 V367"/>
        <path class="head-a" d="M630,375 l-4.5,-8 l9,0 z"/>

        <!-- rule note -->
        <text class="zl" x="30" y="480">규칙</text>
        <text class="ts" x="30" y="503">· 접근은 &lt;module&gt;.api 공개면으로만 — 남의 domain·repository 직접 호출 금지</text>
        <text class="ts" x="30" y="523">· 순환 금지. 열 개 중 .api 를 가진 건 여섯 개, curriculum 은 유입이 없어 포트가 없다</text>
        <text class="ts" x="30" y="543">· live → curriculum 순환이 막혀 live_session.curriculum_id 를 비정규화했다 — 조인 없는 수강 검사</text>
      
</svg>
