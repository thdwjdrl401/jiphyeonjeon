<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
  <title>서버 한 대, 서로 간섭하지 않는 두 스택</title>
  <style>
  svg {
    --surface:#FFFFFF; --ink:#0F1B2A; --ink-soft:#4A5A6B; --ink-faint:#7C8B99;
    --accent:#1D4E6F; --tally:#D9342B;
    --n-built:#2C7A5B; --n-built-bg:#E4F2EB;
    --n-plan:#94A3AF;  --n-plan-bg:#EDF1F4;
    --n-key:#1D4E6F;   --n-key-bg:#E1EDF4;
    --n-data:#A96F16;  --n-data-bg:#F8EFDD;
    --zone:#EDF1F4; --zone-line:#C3CFD9;
    --edge:#5A6C7B; --edge-soft:#9DAAB6;
    --page:#FFFFFF;
  }

  svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .box     { fill: var(--surface); stroke: var(--zone-line); stroke-width: 1.5; }
  .box.on  { fill: var(--n-built-bg); stroke: var(--n-built); }
  .box.off { fill: var(--n-plan-bg);  stroke: var(--n-plan); stroke-dasharray: 5 4; }
  .box.key { fill: var(--n-key-bg);   stroke: var(--n-key); stroke-width: 2; }
  .box.dat { fill: var(--n-data-bg);  stroke: var(--n-data); }
  .zone    { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 4 4; }
  .zone.solid { stroke-dasharray: none; }
  .t   { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .t.sm{ font-size: 12.5px; }
  .ts  { font-size: 11px; fill: var(--ink-soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .zl  { font-size: 11px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; }
  .el  { font-size: 10.5px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .el.hot { fill: var(--tally); }
  .num { font-size: 11px; font-weight: 700; fill: var(--surface); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .edge      { stroke: var(--edge); stroke-width: 1.6; fill: none; }
  .edge.off  { stroke: var(--edge-soft); stroke-dasharray: 5 4; }
  .edge.hot  { stroke: var(--tally); stroke-width: 2; }
  .head-a     { fill: var(--edge); }
  .head-a.off { fill: var(--edge-soft); }
  .head-a.hot { fill: var(--tally); }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
  </style>
  <rect x="0" y="0" width="960" height="540" fill="var(--page)"/>

        <!-- internet -->
        <rect class="box" x="30" y="40" width="150" height="44" rx="22"/>
        <text class="t mid sm" x="105" y="68">인터넷</text>

        <!-- EC2 -->
        <rect class="zone solid" x="250" y="30" width="680" height="470" rx="5"/>
        <text class="zl" x="264" y="52">부트캠프 EC2 · UBUNTU 24.04 · 4 vCPU / 15 GB</text>

        <!-- app stack -->
        <rect class="zone" x="272" y="70" width="400" height="410" rx="4"/>
        <text class="zl" x="286" y="90">앱 스택 — DOCKER-COMPOSE.PROD.YML</text>

        <rect class="box on" x="296" y="106" width="352" height="60" rx="3"/>
        <text class="t mid" x="472" y="130">nginx</text>
        <text class="ts mid" x="472" y="149">TLS 종단 · SPA 서빙 · /api 프록시</text>

        <rect class="box on" x="296" y="196" width="352" height="52" rx="3"/>
        <text class="t mid sm" x="472" y="218">backend :8080</text>
        <text class="ts mid" x="472" y="236">호스트 미노출</text>

        <rect class="box dat" x="296" y="278" width="168" height="52" rx="3"/>
        <text class="t mid sm" x="380" y="300">postgres</text>
        <text class="ts mid" x="380" y="318">내부 전용</text>
        <rect class="box dat" x="480" y="278" width="168" height="52" rx="3"/>
        <text class="t mid sm" x="564" y="300">redis</text>
        <text class="ts mid" x="564" y="318">내부 전용</text>

        <rect class="box" x="296" y="360" width="352" height="46" rx="3"/>
        <text class="t mid sm" x="472" y="380">certbot</text>
        <text class="ts mid" x="472" y="397">인증서 발급 · 12시간 갱신 루프</text>

        <!-- media stack -->
        <rect class="zone" x="700" y="70" width="208" height="410" rx="4"/>
        <text class="zl" x="712" y="90">미디어 스택</text>
        <text class="zl" x="712" y="104">NETWORK_MODE: HOST</text>

        <rect class="box on" x="718" y="120" width="172" height="52" rx="3"/>
        <text class="t mid sm" x="804" y="142">nginx-livekit</text>
        <text class="ts mid" x="804" y="160">시그널링 TLS</text>

        <rect class="box on" x="718" y="196" width="172" height="52" rx="3"/>
        <text class="t mid sm" x="804" y="218">livekit</text>
        <text class="ts mid" x="804" y="236">SFU :7880</text>

        <rect class="box on" x="718" y="272" width="172" height="52" rx="3"/>
        <text class="t mid sm" x="804" y="294">egress</text>
        <text class="ts mid" x="804" y="312">녹화 → HLS</text>

        <rect class="box dat" x="718" y="348" width="172" height="52" rx="3"/>
        <text class="t mid sm" x="804" y="370">minio</text>
        <text class="ts mid" x="804" y="388">오브젝트</text>

        <!-- ingress arrows -->
        <path class="edge" d="M180,62 H262 V136 H288"/>
        <path class="head-a" d="M296,136 l-8,-4.5 l0,9 z"/>
        <text class="el" x="188" y="54">:443 · :80</text>

        <path class="edge" d="M180,62 V440 H700 V152 H710"/>
        <path class="head-a" d="M718,152 l-8,-4.5 l0,9 z"/>
        <text class="el" x="188" y="434">:7443 시그널링</text>

        <path class="edge hot" d="M180,62 V470 H690 V228 H710"/>
        <path class="head-a hot" d="M718,228 l-8,-4.5 l0,9 z"/>
        <text class="el hot" x="188" y="464">:7882/udp 미디어 · :7881/tcp fallback</text>

        <!-- internal -->
        <path class="edge" d="M472,166 V188"/>
        <path class="head-a" d="M472,196 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M380,248 V270"/>
        <path class="head-a" d="M380,278 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M564,248 V270"/>
        <path class="head-a" d="M564,278 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M804,172 V188"/>
        <path class="head-a" d="M804,196 l-4.5,-8 l9,0 z"/>
        <path class="edge" d="M804,324 V340"/>
        <path class="head-a" d="M804,348 l-4.5,-8 l9,0 z"/>

        <!-- cert share -->
        <path class="edge off" d="M648,383 H676 V146 H710"/>
        <path class="head-a off" d="M718,146 l-8,-4.5 l0,9 z"/>
        <text class="el" x="560" y="428">인증서 볼륨 공유 (읽기 전용)</text>

        <text class="ts" x="30" y="140">도메인이 하나뿐이고</text>
        <text class="ts" x="30" y="160">DNS 콘솔 권한이 없어</text>
        <text class="ts" x="30" y="180">서브도메인 대신</text>
        <text class="ts" x="30" y="200">포트로 분리했다.</text>
        <text class="ts" x="30" y="240">DB·Redis는 호스트</text>
        <text class="ts" x="30" y="260">포트를 열지 않는다 —</text>
        <text class="ts" x="30" y="280">도커 내부망 +</text>
        <text class="ts" x="30" y="300">Security Group의</text>
        <text class="ts" x="30" y="320">2중 차단.</text>
      
</svg>
