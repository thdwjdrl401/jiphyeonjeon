<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img">
  <title>바깥에서 본 LiveClass AI</title>
  <style>
  svg {
    --surface:#FFFFFF; --ink:#0F1B2A; --ink-soft:#4A5A6B; --ink-faint:#7C8B99;
    --accent:#1D4E6F; --tally:#D9342B;
    --n-built:#2C7A5B; --n-built-bg:#E4F2EB;
    --n-plan:#94A3AF;  --n-plan-bg:#EDF1F4;
    --n-key:#1D4E6F;   --n-key-bg:#E1EDF4;
    --n-data:#A96F16;  --n-data-bg:#F8EFDD;
    --zone:#EDF1F4; --zone-line:#C3CFD9;
    --edge:#5A6C7B; --edge-soft:#9DAAB6;
    --page:#FFFFFF;
  }

  svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
        "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .box     { fill: var(--surface); stroke: var(--zone-line); stroke-width: 1.5; }
  .box.on  { fill: var(--n-built-bg); stroke: var(--n-built); }
  .box.off { fill: var(--n-plan-bg);  stroke: var(--n-plan); stroke-dasharray: 5 4; }
  .box.key { fill: var(--n-key-bg);   stroke: var(--n-key); stroke-width: 2; }
  .box.dat { fill: var(--n-data-bg);  stroke: var(--n-data); }
  .zone    { fill: var(--zone); stroke: var(--zone-line); stroke-width: 1; stroke-dasharray: 4 4; }
  .zone.solid { stroke-dasharray: none; }
  .t   { font-size: 14px; font-weight: 650; fill: var(--ink); }
  .t.sm{ font-size: 12.5px; }
  .ts  { font-size: 11px; fill: var(--ink-soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .zl  { font-size: 11px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; }
  .el  { font-size: 10.5px; fill: var(--ink-faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .el.hot { fill: var(--tally); }
  .num { font-size: 11px; font-weight: 700; fill: var(--surface); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .edge      { stroke: var(--edge); stroke-width: 1.6; fill: none; }
  .edge.off  { stroke: var(--edge-soft); stroke-dasharray: 5 4; }
  .edge.hot  { stroke: var(--tally); stroke-width: 2; }
  .head-a     { fill: var(--edge); }
  .head-a.off { fill: var(--edge-soft); }
  .head-a.hot { fill: var(--tally); }
  .mid { text-anchor: middle; }
  .end { text-anchor: end; }
  </style>
  <rect x="0" y="0" width="960" height="320" fill="var(--page)"/>

        <!-- actors -->
        <rect class="box" x="30" y="70" width="160" height="60" rx="3"/>
        <text class="t mid" x="110" y="95">강사</text>
        <text class="ts mid" x="110" y="114">강의 개설 · 라이브 송출</text>

        <rect class="box" x="30" y="190" width="160" height="60" rx="3"/>
        <text class="t mid" x="110" y="215">학생</text>
        <text class="ts mid" x="110" y="234">수강 · 시청 · 질문</text>

        <!-- system -->
        <rect class="box key" x="330" y="60" width="300" height="200" rx="4"/>
        <text class="t mid" x="480" y="105" style="font-size:17px">LiveClass AI</text>
        <text class="ts mid" x="480" y="132">실시간 라이브 강의 플랫폼</text>
        <line x1="360" y1="152" x2="600" y2="152" stroke="var(--zone-line)" stroke-width="1"/>
        <text class="ts mid" x="480" y="176" style="fill:var(--ink)">라이브 화상 · 채팅</text>
        <text class="ts mid" x="480" y="200" style="fill:var(--ink)">실시간 자막 · 용어 · 근거 RAG</text>
        <text class="ts mid" x="480" y="224" style="fill:var(--ink)">녹화 다시보기</text>

        <!-- external -->
        <rect class="box off" x="770" y="70" width="160" height="60" rx="3"/>
        <text class="t mid sm" x="850" y="95">외부 AI API</text>
        <text class="ts mid" x="850" y="114">STT · 임베딩 · LLM</text>

        <rect class="box" x="770" y="190" width="160" height="60" rx="3"/>
        <text class="t mid sm" x="850" y="215">부트캠프 EC2</text>
        <text class="ts mid" x="850" y="234">단일 노드 · 자체 호스팅</text>

        <!-- edges -->
        <path class="edge" d="M190,100 H322"/>
        <path class="head-a" d="M330,100 l-8,-4.5 l0,9 z"/>
        <text class="el mid" x="256" y="92">강의·라이브</text>

        <path class="edge" d="M190,220 H322"/>
        <path class="head-a" d="M330,220 l-8,-4.5 l0,9 z"/>
        <text class="el mid" x="256" y="212">수강·질문</text>

        <path class="edge off" d="M630,100 H762"/>
        <path class="head-a off" d="M770,100 l-8,-4.5 l0,9 z"/>
        <text class="el mid" x="696" y="92">CP2~CP3</text>

        <path class="edge" d="M630,220 H762"/>
        <path class="head-a" d="M770,220 l-8,-4.5 l0,9 z"/>
        <text class="el mid" x="696" y="212">전부 자체 호스팅</text>
      
</svg>
