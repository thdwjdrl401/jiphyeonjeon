<text x="990.0" y="190.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">Redis</text>
<text x="990.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">세션 · 캐시</text>
