<text x="490.0" y="319.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">JPA</text>
<rect x="70" y="270" width="250" height="66" rx="3" fill="#F8EFDD" stroke="#A96F16" stroke-width="1.8"/>
<text x="195.0" y="308.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">PostgreSQL</text>
