<text x="760.0" y="300.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">서비스 계층</text>
<text x="760.0" y="319.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">권한 · 상태 · 정합성</text>
