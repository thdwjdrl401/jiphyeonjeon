<text x="595.0" y="465.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">레슨 · 자료</text>
<text x="595.0" y="484.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">lesson</text>
