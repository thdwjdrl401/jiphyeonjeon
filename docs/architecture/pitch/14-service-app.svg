<text x="797.5" y="484.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">enrollment</text>
<rect x="905" y="440" width="175" height="56" rx="3" fill="#E1EDF4" stroke="#1D4E6F" stroke-width="1.8"/>
<text x="992.5" y="465.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">계정 · 파일</text>
<text x="992.5" y="484.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">auth · asset</text>
<line x1="34" y1="532" x2="1106" y2="532" stroke="#E3E9ED"/>
<text x="34" y="558" font-size="12" fill="#4A5A6B">요청은 nginx → 보안 필터 → 컨트롤러 → 서비스 계층 → 저장소 순으로 좁혀진다.</text>
<text x="34" y="578" font-size="12" fill="#4A5A6B">권한 판정은 항상 서비스 계층에서 한다 — 화면이나 입력 단계에서 막는 것에 기대지 않는다.</text>
<text x="34" y="598" font-size="12" fill="#4A5A6B">아래쪽은 같은 배포 안에서 나뉜 모듈이다. 왼쪽이 오른쪽을 쓰고, 순환은 빌드가 막는다.</text>
<text x="34" y="618" font-size="12" fill="#4A5A6B">모듈 경계 덕분에 나중에 특정 기능만 떼어 별도 서버로 옮길 수 있다.</text>
</svg>