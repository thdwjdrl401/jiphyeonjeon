<line x1="34" y1="482" x2="1106" y2="482" stroke="#E3E9ED"/>
<text x="34" y="508" font-size="12" fill="#4A5A6B">SFU 는 참가자마다 화질을 달리 보낸다 — 회선이 느린 학생 때문에 전체가 끊기지 않는다.</text>
<text x="34" y="528" font-size="12" fill="#4A5A6B">방화벽이 막힌 환경에서는 중계 서버를 거쳐 우회한다.</text>
<text x="34" y="548" font-size="12" fill="#4A5A6B">녹화는 같은 방을 한 명 더 들어와 보는 방식으로 만든다. 라이브 품질에 영향을 주지 않는다.</text>
<text x="34" y="568" font-size="12" fill="#4A5A6B">녹화물은 잘게 나뉜 조각과 목록으로 저장돼, 원하는 지점부터 바로 재생된다.</text>
