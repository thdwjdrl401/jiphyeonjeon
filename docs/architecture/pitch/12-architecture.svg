<text x="34" y="640.0" font-size="12" fill="#4A5A6B">브라우저의 모든 업무 요청은 서비스를 지난다 — 권한과 정책을 한 곳에서 판정한다.</text>
<text x="34" y="660.0" font-size="12" fill="#4A5A6B">화상과 파일은 서비스를 거치지 않고 미디어 서버·저장소와 직접 주고받는다.</text>
<text x="34" y="680.0" font-size="12" fill="#4A5A6B">AI는 바깥에 노출되지 않는다. 서비스가 검증한 요청만 받는다.</text>
<text x="34" y="700.0" font-size="12" fill="#4A5A6B">AI가 멈춰도 왼쪽 절반(화상 · 채팅 · 수강 · 다시보기)은 그대로 돌아간다.</text>
