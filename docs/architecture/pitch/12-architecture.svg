<line x1="34" y1="682" x2="1186" y2="682" stroke="#E3E9ED"/>
<text x="34" y="708" font-size="12" fill="#4A5A6B">브라우저의 업무 요청은 모두 앱 플레인을 지난다 — 권한과 정책을 한 곳에서 판정한다.</text>
<text x="34" y="728" font-size="12" fill="#4A5A6B">빨간 선은 서비스를 거치지 않는 경로다. 화상과 파일은 미디어 서버·저장소와 직접 주고받는다.</text>
<text x="34" y="748" font-size="12" fill="#4A5A6B">AI 플레인은 바깥에 노출되지 않는다. 서비스가 검증한 요청만 받고, 결과는 캐시와 DB로 돌아온다.</text>
<text x="34" y="768" font-size="12" fill="#4A5A6B">AI 플레인이 통째로 멈춰도 위쪽 두 플레인(화상 · 채팅 · 수강 · 다시보기)은 그대로 돌아간다.</text>
