<rect x="364.0" y="34.0" width="190.0" height="68.0" rx="3" fill="#EAE5F5" stroke="#5B4B8A" stroke-width="1.8"/>
<text x="459.0" y="65.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">녹화 합성</text>
<text x="459.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">화면 + 음성</text>
<rect x="694.0" y="34.0" width="190.0" height="68.0" rx="3" fill="#F8EFDD" stroke="#A96F16" stroke-width="1.8"/>
<text x="789.0" y="65.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">영상 보관</text>
<text x="789.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">오브젝트 저장소</text>
<rect x="1024.0" y="34.0" width="190.0" height="68.0" rx="3" fill="#E1EDF4" stroke="#1D4E6F" stroke-width="1.8"/>
<text x="1119.0" y="65.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">재생 허가</text>
<text x="1119.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">수강 여부 확인</text>
<rect x="1354.0" y="34.0" width="190.0" height="68.0" rx="3" fill="#FFFFFF" stroke="#5A6C7B" stroke-width="1.8"/>
