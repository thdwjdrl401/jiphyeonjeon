<text x="1449.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">다시보기</text>
<line x1="34" y1="189.0" x2="1544.0" y2="189.0" stroke="#E3E9ED"/>
<text x="34" y="208.0" font-size="12" fill="#4A5A6B">다시보기는 따로 만들지 않는다 — 라이브 때 생긴 녹화와 자막이 그대로 재생된다.</text>
<text x="34" y="228.0" font-size="12" fill="#4A5A6B">이미 교정이 끝난 뒤라, 다시보기는 처음부터 자막·용어·질의응답이 모두 갖춰진 상태다.</text>
<text x="34" y="248.0" font-size="12" fill="#4A5A6B">영상 조각만 저장소에서 직접 받는다. 자막과 시간 기준은 앱 서비스가 내려주고,</text>
<text x="34" y="268.0" font-size="12" fill="#4A5A6B">재생 위치를 세션 시각으로 바꿔 자막을 맞춘다 — 같은 연결이 아니라 같은 좌표계로 맞춘다.</text>
</svg>