<text x="34" y="1018" font-size="12" fill="#4A5A6B">브라우저의 업무 요청은 모두 앱 서비스를 지난다 — 권한과 정책을 한 곳에서 판정한다.</text>
<text x="34" y="1038" font-size="12" fill="#4A5A6B">빨간 선은 앱 서비스를 거치지 않는 경로다. 화상과 다시보기 세그먼트만 여기에 해당한다.</text>
<text x="34" y="1058" font-size="12" fill="#4A5A6B">다시보기는 두 갈래로 받는다 — 세그먼트는 저장소 직결, manifest·자막·시간 기준은 앱 서비스가 내려준다.</text>
<text x="34" y="1078" font-size="12" fill="#4A5A6B">싱크는 같은 연결이 아니라 같은 좌표계로 맞춘다. 앱 서비스가 주는 시간 기준으로 재생 위치를 세션 시각으로 바꾼다.</text>
<text x="34" y="1098" font-size="12" fill="#4A5A6B">그래도 아무나 닿지는 못한다. 세그먼트 주소는 앱 서비스가 대상과 유효 시간을 박아 다시 쓴 것이다.</text>
<text x="34" y="1118" font-size="12" fill="#4A5A6B">앱 서비스는 하나로 배포하지만 안에서는 모듈로 나뉜다. 모듈끼리는 정해진 창구로만 대화하고 순환은 빌드가 막는다.</text>
<text x="34" y="1138" font-size="12" fill="#4A5A6B">AI 서비스는 바깥에 노출되지 않는다. 앱 서비스가 검증한 요청만 받고, 결과는 캐시와 데이터베이스로 돌아온다.</text>
<text x="34" y="1158" font-size="12" fill="#4A5A6B">AI 서비스가 통째로 멈춰도 화상 · 채팅 · 수강 · 다시보기는 그대로 돌아간다.</text>
</svg>