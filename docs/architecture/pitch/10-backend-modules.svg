<text x="34" y="414.0" font-size="12" fill="#4A5A6B">백엔드는 하나로 배포하지만 안에서는 모듈로 나뉜다. 화살표는 의존 방향이고, 왼쪽이 오른쪽을 쓴다.</text>
<text x="34" y="434.0" font-size="12" fill="#4A5A6B">모듈끼리는 정해진 창구로만 대화한다 — 남의 내부 데이터를 직접 건드릴 수 없다.</text>
<text x="34" y="454.0" font-size="12" fill="#4A5A6B">되돌아가는 의존(순환)은 금지다. 어기면 사람이 아니라 빌드가 먼저 막는다.</text>
<text x="34" y="474.0" font-size="12" fill="#4A5A6B">덕분에 나중에 특정 모듈만 떼어 별도 서버로 옮길 수 있다.</text>
