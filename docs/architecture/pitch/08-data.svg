<text x="127.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">Python</text>
<rect x="346.0" y="83.0" width="186.0" height="68.0" rx="3" fill="#F8EFDD" stroke="#A96F16" stroke-width="1.8"/>
<text x="439.0" y="114.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">지식 데이터</text>
<text x="439.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">문서 조각 · 의미 색인</text>
<rect x="658.0" y="34.0" width="186.0" height="68.0" rx="3" fill="#E1EDF4" stroke="#1D4E6F" stroke-width="1.8"/>
<text x="751.0" y="65.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">전달 경로</text>
<text x="751.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">AI 결과는 여기를 지난다</text>
<rect x="658.0" y="132.0" width="186.0" height="68.0" rx="3" fill="#E1EDF4" stroke="#1D4E6F" stroke-width="1.8"/>
<text x="751.0" y="163.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">LiveClass 서비스</text>
<text x="751.0" y="182.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">Spring</text>
<rect x="970.0" y="83.0" width="186.0" height="68.0" rx="3" fill="#F8EFDD" stroke="#A96F16" stroke-width="1.8"/>
<text x="1063.0" y="114.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">서비스 데이터</text>
<text x="1063.0" y="133.0" text-anchor="middle" font-size="11.5" fill="#4A5A6B">계정 · 강의 · 수강 · 자막</text>
<rect x="1282.0" y="83.0" width="186.0" height="68.0" rx="3" fill="#FFFFFF" stroke="#5A6C7B" stroke-width="1.8"/>
<text x="1375.0" y="122.0" text-anchor="middle" font-size="14.5" font-weight="650" fill="#0F1B2A">학생에게 보이는 것</text>
<line x1="34" y1="213.0" x2="1468.0" y2="213.0" stroke="#E3E9ED"/>
<text x="34" y="232.0" font-size="12" fill="#4A5A6B">같은 데이터베이스 안에서 쓰는 영역을 나눈다 — 두 서비스가 같은 표를 동시에 고치지 않는다.</text>
<text x="34" y="252.0" font-size="12" fill="#4A5A6B">AI가 만든 것은 곧바로 학생에게 가지 않는다. 서비스 쪽으로 넘어와 강사가 다듬은 뒤 공개된다.</text>
<text x="34" y="272.0" font-size="12" fill="#4A5A6B">라이브 자막만 예외다 — 실시간이라 검수를 기다리지 않고, 교정은 사후에 이뤄진다.</text>
