# 로컬 개발 backbone — postgres·redis·minio·rabbitmq와 녹화강의 worker를 포함.
# nginx·미디어(LiveKit/Egress)는 별도 스택으로 운영 (TEAM-KICKOFF §4).
# 사용: cp .env.example .env  →  docker compose up -d
name: liveclass          # compose 프로젝트명 고정 = 볼륨/이미지 접두사. 디렉토리명(cp/liveclass 등)과 무관하게 liveclass_* 로 통일.
services:
  postgres:
    image: pgvector/pgvector:pg16          # pgvector 사전 설치 (ADR-0005)
    container_name: liveclass-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveclass}
      POSTGRES_DB: ${POSTGRES_DB:-liveclass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # 최초 1회 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveclass} -d ${POSTGRES_DB:-liveclass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine                  # cache/session + STT/라이브 Streams (ADR-0008/0012)
    container_name: liveclass-redis
    command: ["redis-server", "--appendonly", "yes"]   # 세션 재시작 생존
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:                                   # 에셋(썸네일·프로필) presigned 업로드용 S3 호환 스토리지 (ADR-0023)
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z   # LiveKit 스택과 동일 태그 고정
    container_name: liveclass-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}       # application.yml asset.storage 기본값과 일치
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"      # S3 API (앱·브라우저 presigned)
      - "9001:9001"      # 콘솔 UI
    volumes:
      - miniodata:/data

  minio-init:                              # liveclass-assets 버킷 최초 생성 (멱등)
    image: minio/mc
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set lc http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio'; sleep 1; done
        mc mb -p lc/liveclass-assets
        mc mb -p lc/recordings
        exit 0

  rabbitmq:                                # AI 배치 잡 큐 (ADR-0012/0036). 임베딩 파이프라인이 outbox→여기로 발행.
    image: rabbitmq:3-management           # 관리 UI 포함 (http://localhost:15672)
    container_name: liveclass-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-liveclass}       # application.yml spring.rabbitmq 기본값과 일치
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-liveclass}
    ports:
      - "5672:5672"      # AMQP (앱 접속)
      - "15672:15672"    # 관리 UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 기본 실행: docker compose up -d
  # 로컬 backend가 localhost로 서명한 source URL을 그대로 읽어야 하므로 host network를 사용한다.
  media-worker:
    build: ./media-worker
    container_name: liveclass-media-worker
    restart: unless-stopped
    network_mode: host
    environment:
      MEDIA_RABBITMQ_URL: amqp://${RABBITMQ_USER:-liveclass}:${RABBITMQ_PASSWORD:-liveclass}@localhost:5672/
      MEDIA_BACKEND_URL: http://localhost:8080
      MEDIA_SOURCE_SECRET: ${MEDIA_SOURCE_SECRET:-dev-media-source-secret}
      MEDIA_CALLBACK_SECRET: ${MEDIA_CALLBACK_SECRET:-dev-media-callback-secret}
      MEDIA_OUTPUT_ENDPOINT: http://localhost:9000
      MEDIA_OUTPUT_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_OUTPUT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MEDIA_OUTPUT_BUCKET: recordings
      MEDIA_OUTPUT_REGION: us-east-1
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # 기본 실행: docker compose up -d
  # host에서 실행 중인 Spring과 Spring이 localhost로 서명한 MinIO URL을 함께 사용한다.
  recorded-stt-worker:
    build: ./ai/ai-worker
    container_name: liveclass-recorded-stt-worker
    restart: unless-stopped
    network_mode: host
    entrypoint: ["python", "-m", "app.recorded_stt.main"]
    environment:
      RECORDED_STT_INSTANCE_ID: recorded-stt-local-1
      RECORDED_STT_MANAGEMENT_HOST: 127.0.0.1
      RECORDED_STT_MANAGEMENT_PORT: "8012"
      RECORDED_STT_RABBITMQ_URL: amqp://${RABBITMQ_USER:-liveclass}:${RABBITMQ_PASSWORD:-liveclass}@localhost:5672/
      RECORDED_STT_SPRING_INTERNAL_BASE_URL: http://localhost:8080
      RECORDED_STT_SOURCE_HMAC_SECRET: ${RECORDED_STT_SOURCE_SECRET:-dev-recorded-stt-source-secret}
      RECORDED_STT_CALLBACK_HMAC_SECRET: ${RECORDED_STT_CALLBACK_SECRET:-dev-recorded-stt-callback-secret}
      RECORDED_STT_OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY 필요}
      RECORDED_STT_CUE_MAX_DURATION_MS: ${RECORDED_STT_CUE_MAX_DURATION_MS:-6000}
      RECORDED_STT_CUE_MAX_CHARS: ${RECORDED_STT_CUE_MAX_CHARS:-42}
      RECORDED_STT_CUE_PAUSE_BREAK_MS: ${RECORDED_STT_CUE_PAUSE_BREAK_MS:-500}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  rabbitmqdata:
