# T0 개발 backbone — 최소 인프라 (CP0가 쓰는 것만).
# RabbitMQ·MinIO·nginx·미디어(LiveKit/Egress)는 각 CP 착수 시점에 확장 (TEAM-KICKOFF §4).
# 사용: cp .env.example .env  →  docker compose up -d
name: liveclass          # compose 프로젝트명 고정 = 볼륨/이미지 접두사. 디렉토리명(cp/liveclass 등)과 무관하게 liveclass_* 로 통일.
services:
  postgres:
    image: pgvector/pgvector:pg16          # pgvector 사전 설치 (ADR-0005)
    container_name: liveclass-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveclass}
      POSTGRES_DB: ${POSTGRES_DB:-liveclass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # 최초 1회 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveclass} -d ${POSTGRES_DB:-liveclass}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine                  # cache/session + STT/라이브 Streams (ADR-0008/0012)
    container_name: liveclass-redis
    command: ["redis-server", "--appendonly", "yes"]   # 세션 재시작 생존
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:                                   # 에셋(썸네일·프로필) presigned 업로드용 S3 호환 스토리지 (ADR-0023)
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z   # LiveKit 스택과 동일 태그 고정
    container_name: liveclass-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}       # application.yml asset.storage 기본값과 일치
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"      # S3 API (앱·브라우저 presigned)
      - "9001:9001"      # 콘솔 UI
    volumes:
      - miniodata:/data

  minio-init:                              # liveclass-assets 버킷 최초 생성 (멱등)
    image: minio/mc
    depends_on: [minio]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set lc http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio'; sleep 1; done
        mc mb -p lc/liveclass-assets
        exit 0

volumes:
  pgdata:
  redisdata:
  miniodata:
