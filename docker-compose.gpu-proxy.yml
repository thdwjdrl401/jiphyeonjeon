# GPU 서버 리버스터널 → 내부 프록시 (별도 스택, host 네트워크).
# host 네트워크: 호스트 루프백의 ssh -R 터널(127.0.0.1:18081 realtime-agent / 127.0.0.1:18020 BGE)에 닿기 위함.
# 공개 웹(frontend nginx 443)과 분리 — /internal/* 내부 전용, 관심사·보안 격리.
# 전제: 호스트 ufw로 18080 허용(내부 콜러용). SG엔 미개방(외부 차단 유지).
# 배포: CI deploy-gpu-proxy(수동), 또는  docker compose -f docker-compose.gpu-proxy.yml up -d
name: liveclass-gpu-proxy
services:
  gpu-proxy:
    image: nginx:alpine
    container_name: liveclass-gpu-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/nginx/gpu-proxy.conf:/etc/nginx/conf.d/default.conf:ro
