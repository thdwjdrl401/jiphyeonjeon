# AI 서비스(ai-worker, ai-api) dev 스택 — docker-compose.ai-prod.yml의 대칭 dev 판.
# prod(liveclass-ai)와 별개 프로젝트·컨테이너·env로 EC2에서 동시 가동한다.
#
# 네트워크: prod가 liveclass_default(앱 스택)에 붙는 것처럼, dev는 dev-infra 스택
# (docker-compose.dev-infra.yml, project name: liveclass-dev)이 만든 liveclass-dev_default에
# external로 붙어 postgres·redis·rabbitmq를 서비스명으로 바로 호출한다. ai-api/worker 관리 endpoint는
# prod와 겹치지 않는 EC2 host loopback 포트에만 게시한다.
#   ⚠️ dev redis는 --requirepass(REDIS_PASSWORD)라 prod와 달리 URL에 비밀번호가 들어간다.
#
# GPU(bge-runtime)는 prod와 동일하다 — 물리적으로 다른 컴퓨터라 도커 네트워크 밖이고,
# host network nginx 프록시(docker-compose.gpu-proxy.yml, host.docker.internal:18080/internal/bge)를
# dev/prod 공용으로 재사용한다. 여기서 gpu-proxy 스택은 건드리지 않는다.
#
# 첫 배포 전 1회만: dev postgres에 ai_app role/스키마 마이그레이션, ai_app에 GRANT할 로그인 계정(ai_runtime) 생성
# (prod와 동일한 부트스트랩을 dev DSN으로). gpu-proxy 스택이 이 EC2에 이미 떠 있는지 확인한다.
#
# 사용:
#   cp .env.ai-dev.example .env.ai-dev   # 값 채우기 (.env.ai-dev는 커밋 금지)
#   docker compose -f docker-compose.ai-dev.yml \
#     --env-file .env.dev --env-file .env.ai-dev \
#     --profile recorded-stt up -d --build ai-worker recorded-stt-worker ai-api
name: liveclass-ai-dev
networks:
  default:
    name: liveclass-dev_default   # dev-infra 스택(project liveclass-dev)의 기본 네트워크
    external: true
services:
  # DB 마이그레이션 자동 실행 — 매 배포마다 alembic upgrade head 후 종료. dev postgres 대상.
  # ai-worker/ai-api는 이게 성공(exit 0)한 뒤에 기동한다. 런타임(ai_runtime)엔 DDL 권한이 없으니 DDL은 여기서만.
  # 최초 1회 DBA 부트스트랩 필요: ai_app NOLOGIN role + GRANT ai_app TO ai_runtime (마이그레이션이 fail-closed로 검사).
  ai-migrate:
    build: ./ai/ai-worker
    container_name: liveclass-ai-migrate-dev
    restart: "no"
    environment:
      # migration 계정 = 앱 admin(POSTGRES_USER, DDL 권한). 런타임과 분리 + sync(+psycopg). dev postgres:5432.
      AI_WORKER_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-liveclass}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}@postgres:5432/${POSTGRES_DB:-liveclass}
    # Dockerfile ENTRYPOINT(python -m app.main) 무시하고 alembic만 실행
    entrypoint: ["sh", "-c"]
    command:
      - |
        cd /app
        for i in 1 2 3 4 5 6; do
          alembic upgrade head && exit 0
          echo "migrate retry $$i (postgres 대기?)"; sleep 5
        done
        echo "migration failed"; exit 1

  ai-worker:
    build: ./ai/ai-worker
    container_name: liveclass-ai-worker-dev
    restart: unless-stopped
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AI_WORKER_MANAGEMENT_HOST_PORT:?AI_WORKER_MANAGEMENT_HOST_PORT 필요}:8011"
    stop_grace_period: 45s
    environment:
      AI_WORKER_INSTANCE_ID: ${AI_WORKER_INSTANCE_ID:?AI_WORKER_INSTANCE_ID 필요}
      AI_WORKER_ENVIRONMENT: staging   # pydantic 허용값: local/test/staging/production ('development' 불가)
      # container에서는 publish를 위해 all-interface bind, host에서는 127.0.0.1로 제한한다.
      AI_WORKER_MANAGEMENT_HOST: 0.0.0.0
      AI_WORKER_MANAGEMENT_PORT: "8011"
      AI_WORKER_DATABASE_URL: postgresql+asyncpg://${AI_RUNTIME_DB_USER:?AI_RUNTIME_DB_USER 필요}:${AI_RUNTIME_DB_PASSWORD:?AI_RUNTIME_DB_PASSWORD 필요}@postgres:5432/${POSTGRES_DB:-liveclass}
      AI_WORKER_MATERIAL_INGESTION_ENABLED: "true"
      # 강조 판서 색인(ADR-0074·ADR-0043). 텍스트 임베딩·저장뿐이라 GMS 키 불필요.
      AI_WORKER_ANNOTATION_INGESTION_ENABLED: ${AI_WORKER_ANNOTATION_INGESTION_ENABLED:-false}
      AI_WORKER_RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER 필요}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 필요}@rabbitmq:5672/
      # dev network에는 backend가 없으므로 도달 가능한 dev Spring 주소를 env에 명시한다.
      AI_WORKER_SPRING_INTERNAL_BASE_URL: ${AI_WORKER_SPRING_INTERNAL_BASE_URL:?AI_WORKER_SPRING_INTERNAL_BASE_URL 필요}
      AI_WORKER_SPRING_HMAC_SECRET: ${AI_CALLBACK_SECRET:?AI_CALLBACK_SECRET 필요 — Spring이 이미 쓰는 기존 값}
      AI_WORKER_BGE_RUNTIME_URL: http://host.docker.internal:18080/internal/bge
      AI_WORKER_BGE_INTERNAL_TOKEN: ${BGE_RUNTIME_INTERNAL_TOKEN:?BGE_RUNTIME_INTERNAL_TOKEN 필요 — GPU 쪽과 동일 값}
      # ADR-0010 PPTX 핵심 용어 추출. v2 작업이 요청하므로 켤 때 GMS 키도 함께 주입한다.
      AI_WORKER_KEY_TERM_EXTRACTION_ENABLED: ${AI_WORKER_KEY_TERM_EXTRACTION_ENABLED:-false}
      AI_WORKER_GMS_API_KEY: ${GMS_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/readyz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ADR-0011: 긴 파일 전사는 PPTX worker와 queue/prefetch/process를 공유하지 않는다.
  recorded-stt-worker:
    profiles: ["recorded-stt"]
    build: ./ai/ai-worker
    container_name: liveclass-recorded-stt-worker-dev
    restart: unless-stopped
    entrypoint: ["python", "-m", "app.recorded_stt.main"]
    ports:
      - "127.0.0.1:${RECORDED_STT_MANAGEMENT_HOST_PORT:-18012}:8012"
    stop_grace_period: 60s
    environment:
      RECORDED_STT_ENVIRONMENT: staging
      RECORDED_STT_INSTANCE_ID: ${RECORDED_STT_INSTANCE_ID:-recorded-stt-dev-1}
      RECORDED_STT_MANAGEMENT_HOST: 0.0.0.0
      RECORDED_STT_MANAGEMENT_PORT: "8012"
      RECORDED_STT_RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER 필요}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 필요}@rabbitmq:5672/
      RECORDED_STT_SPRING_INTERNAL_BASE_URL: ${RECORDED_STT_SPRING_INTERNAL_BASE_URL:?RECORDED_STT_SPRING_INTERNAL_BASE_URL 필요}
      RECORDED_STT_SOURCE_HMAC_SECRET: ${RECORDED_STT_SOURCE_SECRET:?RECORDED_STT_SOURCE_SECRET 필요}
      RECORDED_STT_CALLBACK_HMAC_SECRET: ${RECORDED_STT_CALLBACK_SECRET:?RECORDED_STT_CALLBACK_SECRET 필요}
      RECORDED_STT_OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY 필요}
      RECORDED_STT_MODEL: whisper-1
      RECORDED_STT_LANGUAGE: ko
      RECORDED_STT_CHUNK_SECONDS: "900"
      RECORDED_STT_CHUNK_OVERLAP_MS: "1000"
      RECORDED_STT_CUE_MAX_DURATION_MS: "6000"
      RECORDED_STT_CUE_MAX_CHARS: "42"
      RECORDED_STT_CUE_PAUSE_BREAK_MS: "500"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/readyz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-api:
    build: ./ai/ai-api
    container_name: liveclass-ai-api-dev
    restart: unless-stopped
    # prod와 동일하게 in-memory session owner를 하나로 고정한다.
    deploy:
      replicas: 1
    stop_grace_period: 45s
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # dev ai-api는 dev-infra의 pg·redis·rabbitmq·minio와 같은 방식(0.0.0.0 노출 + SG 팀 IP 게이트)으로 게시한다.
      # 로컬(노트북) backend가 remote 프로필로 붙을 때 SSH 터널 없이 EC2 호스트 포트로 바로 닿게 하기 위함.
      # prod ai-api(docker-compose.ai-prod.yml)는 loopback 유지 — 노출은 dev 편의용이고 HMAC + SG로 게이트한다.
      # AI_API_HOST_PORT는 dev 관례상 18010(prod 8010과 EC2 host에서 충돌 방지, .env.ai-dev.example 참고).
      - "${AI_API_HOST_PORT:?AI_API_HOST_PORT 필요}:8010"
    environment:
      AI_API_ENVIRONMENT: staging   # pydantic 허용값: local/test/staging/production ('development' 불가)
      AI_API_INSTANCE_ID: ${AI_API_INSTANCE_ID:?AI_API_INSTANCE_ID 필요}
      AI_API_HOST: 0.0.0.0   # Docker network와 host port forwarding이 접근하므로 container 내부는 all-interface bind
      AI_API_PORT: "8010"
      AI_API_DATABASE_URL: postgresql+asyncpg://${AI_RUNTIME_DB_USER:?AI_RUNTIME_DB_USER 필요}:${AI_RUNTIME_DB_PASSWORD:?AI_RUNTIME_DB_PASSWORD 필요}@postgres:5432/${POSTGRES_DB:-liveclass}
      # dev redis는 --requirepass라 prod(redis://redis:6379/0)와 달리 비밀번호가 필요하다.
      AI_API_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD 필요 — dev redis requirepass}@redis:6379/0
      AI_API_BGE_BASE_URL: http://host.docker.internal:18080/internal/bge
      AI_API_BGE_TOKEN: ${BGE_RUNTIME_INTERNAL_TOKEN:?BGE_RUNTIME_INTERNAL_TOKEN 필요 — GPU 쪽과 동일 값}
      AI_API_GMS_API_KEY: ${GMS_API_KEY:?GMS_API_KEY 필요}
      # 비워 두면 앱이 AI_API_GMS_MODEL로 폴백한다. 강의 노트는 gpt-5-nano가 기본이므로 명시한다.
      # 강조 판서를 RAG 근거로 검색(ADR-0043). 꺼져 있으면 두 RAG 경로가 기능 이전과 완전히 동일하다.
      # ai.annotation_highlight 테이블(alembic 0003)이 적용된 뒤에만 켠다 — 없으면 검색 에러가 전파돼 모든 답변이 죽는다.
      AI_API_ANNOTATION_EVIDENCE_ENABLED: ${AI_API_ANNOTATION_EVIDENCE_ENABLED:-false}
      # 시연·단일 질문자 환경용: userId 없는 요청도 세션 단위로 대화를 이음. 여러 학생이
      # 질문하는 세션에서 켜면 대화가 섞이므로 운영 기본 off (ADR-0083).
      AI_API_CONVERSATION_MEMORY_SESSION_FALLBACK_ENABLED: ${AI_API_CONVERSATION_MEMORY_SESSION_FALLBACK_ENABLED:-false}
      AI_API_ANNOTATION_TOP_K: ${AI_API_ANNOTATION_TOP_K:-2}
      AI_API_ANNOTATION_WINDOW_SIZE: ${AI_API_ANNOTATION_WINDOW_SIZE:-5}
      AI_API_LECTURE_NOTE_MODEL: ${AI_API_LECTURE_NOTE_MODEL:-gpt-5-mini}
      # reasoning 모델일 때만 적용된다. 비-reasoning 모델로 바꿔도 무시되므로 안전하다.
      AI_API_LECTURE_NOTE_REASONING_EFFORT: ${AI_API_LECTURE_NOTE_REASONING_EFFORT:-minimal}
      AI_API_LECTURE_NOTE_MAX_OUTPUT_TOKENS: ${AI_API_LECTURE_NOTE_MAX_OUTPUT_TOKENS:-4096}
      AI_API_LECTURE_NOTE_MAX_PROMPT_CHARS: ${AI_API_LECTURE_NOTE_MAX_PROMPT_CHARS:-20000}
      AI_API_LECTURE_NOTE_TIMEOUT_SECONDS: ${AI_API_LECTURE_NOTE_TIMEOUT_SECONDS:-30}
      AI_API_LECTURE_NOTE_MIN_WINDOW_MS: ${AI_API_LECTURE_NOTE_MIN_WINDOW_MS:-45000}
      AI_API_LECTURE_NOTE_TARGET_WINDOW_MS: ${AI_API_LECTURE_NOTE_TARGET_WINDOW_MS:-60000}
      AI_API_LECTURE_NOTE_MAX_WINDOW_MS: ${AI_API_LECTURE_NOTE_MAX_WINDOW_MS:-90000}
      AI_API_LECTURE_NOTE_MIN_CHARS: ${AI_API_LECTURE_NOTE_MIN_CHARS:-200}
      AI_API_LECTURE_NOTE_MAX_CHARS: ${AI_API_LECTURE_NOTE_MAX_CHARS:-1500}
      AI_API_LECTURE_NOTE_STREAM_MAXLEN: ${AI_API_LECTURE_NOTE_STREAM_MAXLEN:-10000}
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:?AI_INTERNAL_SECRET 필요 — Spring과 공유하는 HMAC 시크릿}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
