# 빌드 캐시. CI는 매 파이프라인이 끝날 때 after_script로 backend/build를 지우고(공유 작업트리에 root
# 소유 산출물이 남는 것을 막으려고), --no-daemon으로 새 JVM에서 시작한다. 그래서 캐시가 없으면 매번
# main 408개 + test 63개를 Lombok 애너테이션 처리까지 포함해 콜드 컴파일한다.
#
# gradle-cache 이름 볼륨이 이미 /root/.gradle을 파이프라인 사이에 보존하므로, 캐시를 켜면 컴파일 산출물이
# 그 안(caches/build-cache-1)에 남아 다음 실행에서 FROM-CACHE로 복원된다. 지금은 의존성만 재사용하고
# 컴파일은 매번 다시 하고 있었다.
org.gradle.caching=true

# 빌드 JVM 힙. 기본값으로는 Lombok 처리를 낀 컴파일에서 GC가 잦다.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
