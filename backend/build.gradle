plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.liveclass'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)   // Java 21 LTS (virtual threads, ADR-0009)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 쿠키 세션 저장소 = Redis (ADR-0014). Boot 4.x는 세션 오토컨피그가 전용 스타터에 있음
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // AI 배치 잡 발행 = RabbitMQ (ADR-0012/0036). outbox 릴레이가 잡을 큐에 싣는다. 발행 전용(리스너 없음).
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // 마이그레이션 = Flyway (core 스키마), DB = PostgreSQL (ADR-0005). Boot 4.x는 flyway-core만으론 오토컨피그 안 붙음 → 스타터 필요
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // API 문서 = springdoc-openapi (ADR-0009가 전제한 3.0.x). Boot 4.1은 BOM 미관리라 버전 명시.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // 관측성: Micrometer Tracing(Brave). 요청마다 traceId/spanId를 MDC에 넣어 로그·에러 응답을
    // 하나의 요청으로 묶는다. Boot 4.x는 둘 다 필요하다 — Boot 모듈(자동설정)은 brave 브리지를
    // 전이로 가져오지 않으므로 micrometer 브리지(실제 BraveTracer)를 함께 넣는다. 익스포터는 후속.
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    // 메트릭: Prometheus 노출 형식 레지스트리. /actuator/prometheus 로 스크레이프 대상 제공.
    // 버전은 micrometer-bom 관리. 실제 Prometheus/Grafana 컨테이너 연결은 후속(인프라).
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // LiveKit 서버 SDK — 라이브 방 입장 토큰(JWT) 서명·발급 (ADR-0009 명시 0.14.0).
    implementation 'io.livekit:livekit-server:0.14.0'
    // LiveKit egress 완료 webhook의 JWT 서명 검증 (ADR-0034). livekit-server가 transitive로 끌어오지만
    // 직접 쓰므로 명시한다.
    implementation 'com.auth0:java-jwt:4.5.1'

    // 실시간 채팅 = STOMP over WebSocket (ADR-0019). 핸드셰이크는 쿠키 세션으로 인증되고
    // 브로드캐스트는 SimpleBroker(/topic)로 나간다. 클러스터 확장 시 외부 브로커로 교체.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // 에셋 업로드 = presigned direct-to-storage (MinIO/S3 호환). 바이트는 Spring을 거치지 않고
    // 클라이언트가 스토리지로 직접 PUT 한다 — 백엔드는 presigned URL 발급과 완료 확인만 한다.
    // S3Presigner/S3Client 생성은 lazy라 MinIO 없이도 빈 생성·앱 부팅이 된다(테스트에서 모킹).
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'

    // 모듈러 모놀리스: 모듈 경계를 코드로 강제한다(ModularityTests의 verify가 산출물 기준 검증).
    // Boot 4.1 대응은 Modulith 2.x(BOM으로 버전 관리).
    // 관측성(spring-modulith-observability)은 모듈 스팬 생성을 확인하지 못해 보류 — 트레이싱
    // 백엔드(Zipkin/OTel)와 함께 도입할 때 실제로 검증 가능하다.
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4.x는 테스트 오토컨피그도 기술별로 쪼개짐 — MockMvc(@AutoConfigureMockMvc)는 starter-test에 없음
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 모듈 경계 검증(ApplicationModules.verify)
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'

    // CI/콜드 체크아웃 격리 = Testcontainers (ADR-0038). @SpringBootTest 컨텍스트가 로컬 compose 인프라
    // 대신 랜덤 포트 컨테이너(Postgres+pgvector·Redis)에 붙는다. @ServiceConnection·ContainerConnectionSource
    // 제공은 spring-boot-testcontainers. Redis 커넥션 팩토리는 starter-data-redis 안에 이미 있음(추가 의존성 불필요).
    // Testcontainers 2.0은 모듈명이 org.testcontainers:testcontainers-* 로 바뀜(구 postgresql/junit-jupiter →
    // testcontainers-postgresql/-junit-jupiter). 버전은 모두 Boot 4.1 BOM 관리.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.0'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트는 @SpringBootTest 컨텍스트가 여러 개 캐시되고 각자 Hikari 풀을 잡는다. 로컬 Postgres
    // max_connections(=100)를 넘지 않도록 컨텍스트당 풀을 작게 제한한다(설정파일 불변, 시스템 프로퍼티로).
    systemProperty 'spring.datasource.hikari.maximum-pool-size', '3'
    // 테스트 JVM 기본 힙(512m)은 캐시된 컨텍스트 13개가 각자 풀·EntityManagerFactory를 들고 있기엔 빠듯해
    // GC가 잦아진다. 병렬 포크는 켜지 않는다 — 컨테이너가 JVM당 하나라 포크마다 PG·Redis가 새로 뜨고,
    // 타이밍에 민감한 WS 테스트가 같은 러너에서 서로를 밀어낸다.
    maxHeapSize = '1500m'
}
