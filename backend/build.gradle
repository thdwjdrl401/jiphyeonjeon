plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.liveclass'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)   // Java 21 LTS (virtual threads, ADR-0009)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 쿠키 세션 저장소 = Redis (ADR-0014). Boot 4.x는 세션 오토컨피그가 전용 스타터에 있음
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

    // 마이그레이션 = Flyway (core 스키마), DB = PostgreSQL (ADR-0005). Boot 4.x는 flyway-core만으론 오토컨피그 안 붙음 → 스타터 필요
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // API 문서 = springdoc-openapi (ADR-0009가 전제한 3.0.x). Boot 4.1은 BOM 미관리라 버전 명시.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // 관측성: Micrometer Tracing(Brave). 요청마다 traceId/spanId를 MDC에 넣어 로그·에러 응답을
    // 하나의 요청으로 묶는다. Boot 4.x는 둘 다 필요하다 — Boot 모듈(자동설정)은 brave 브리지를
    // 전이로 가져오지 않으므로 micrometer 브리지(실제 BraveTracer)를 함께 넣는다. 익스포터는 후속.
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    // 모듈러 모놀리스: 모듈 경계를 코드로 강제한다(ModularityTests의 verify가 산출물 기준 검증).
    // Boot 4.1 대응은 Modulith 2.x(BOM으로 버전 관리).
    // 관측성(spring-modulith-observability)은 모듈 스팬 생성을 확인하지 못해 보류 — 트레이싱
    // 백엔드(Zipkin/OTel)와 함께 도입할 때 실제로 검증 가능하다.
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4.x는 테스트 오토컨피그도 기술별로 쪼개짐 — MockMvc(@AutoConfigureMockMvc)는 starter-test에 없음
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 모듈 경계 검증(ApplicationModules.verify)
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.0'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
