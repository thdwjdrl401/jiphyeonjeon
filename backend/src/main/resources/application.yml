spring:
  application:
    name: liveclass
  threads:
    virtual:
      enabled: true                 # Java 21 virtual threads (ADR-0009)
  # 인프라 접속(datasource·redis)의 기본값 = 전부 로컬(docker-compose.yml). 프로필 없이 뜨면 이 값.
  # 전부 EC2 인프라에 붙으려면 SPRING_PROFILES_ACTIVE=remote → application-remote.yml이 override (ADR-0022).
  # prod(docker-compose.prod.yml)는 프로필 대신 SPRING_DATASOURCE_URL 등 env로 override(우선순위 상위).
  datasource:
    url: jdbc:postgresql://localhost:5432/liveclass
    username: liveclass
    password: liveclass             # 로컬 dev (docker-compose .env와 일치)
    hikari:
      # 둘 다 Hikari 기본값과 같거나(풀 10) 다르다(타임아웃 5초). **기본값이라도 적는다** —
      # 위의 가상 스레드와 짝이 되는 값이라, 어디에도 안 적혀 있으면 "정한 적 없는 값"이 된다.
      #
      # 풀 크기: HikariCP 권장 공식은 `connections ≈ (코어 × 2) + 스핀들`이다. PG가 백엔드와 같은
      # 박스(4 vCPU, SSD)에 있으므로 (4 × 2) + 1 = 9 — 기본값 10이 마침 이 값이다. 4코어 PG에
      # 20~30을 주면 컨텍스트 스위칭·락 경합으로 오히려 느려진다. pg max_connections는 100이고
      # 실측 총 커넥션은 20이라, 여유가 없어서 막히는 상황이 아니다.
      maximum-pool-size: 10
      # 타임아웃: 이쪽이 실제 위험이다. 가상 스레드는 요청 유입에 상한을 두지 않으므로(플랫폼
      # 스레드 200개 제한이 암묵적 스로틀이었다) 버스트가 오면 요청이 전부 이 풀 앞에 줄을 선다.
      # 기본값 30초면 그동안 매달리고, nginx proxy_read_timeout이 3600s라 사용자는 그 30초를
      # 그대로 기다린 뒤 실패를 본다. 빨리 실패하고 클라이언트가 다시 시도하는 편이 낫다.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # 스키마는 Flyway가 소유, JPA는 검증만
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas:
      - core                        # core = Spring 단독 쓰기 (ai는 Python/Alembic)
    default-schema: core
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  # 임시 비밀번호 발송용 SMTP. 기본값은 Gmail이고, 계정 값은 반드시 env로 넣는다 —
  # 앱 비밀번호를 이 파일에 적으면 저장소에 그대로 남는다.
  #
  # Gmail은 계정 비밀번호가 아니라 **앱 비밀번호**(2단계 인증 켠 뒤 발급)를 요구한다. 평문
  # 계정 비밀번호로는 인증이 거절된다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # Gmail 587은 STARTTLS다(465는 SMTPS). 포트를 바꾸면 이 둘도 함께 봐야 한다.
          starttls:
            enable: true
            required: true
          # 붙지 않는 SMTP에 매달려 요청 스레드를 잡아 두지 않는다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  session:
    timeout: 30m
    data:
      redis:
        namespace: liveclass:session  # 세션 본체 → Redis (앱 무상태). Boot 4.0: spring.session.redis.* → spring.session.data.redis.*
  rabbitmq:
    listener:
      simple:
        # 알림 팬아웃 워커 수. **기본값은 1이다**(Spring), 그래서 조각이 순차로 돌았다.
        #
        # 푸시가 전용 큐로 분리된 뒤(ADR-0124) 이 값이 좌우하는 것은 **삽입 처리량뿐**이다 —
        # 조각 하나가 집합 삽입 한 문장(1,000행에 수~수십 ms)이라 2면 넉넉하고, 시간이 드는
        # 푸시는 notification.push.listener-concurrency가 따로 정한다.
        #
        # (분리 전 실측 — 1개 599건/s · 2개 758건/s · 4개 579건/s — 는 푸시가 이 소비자를
        # 붙잡던 시절의 값이다. 그때 4개가 느렸던 이유(푸시 동시 상한을 나눠 가짐)도 함께
        # 사라졌으므로, 삽입이 병목이 되면 이 값은 새로 재야 한다.)
        concurrency: ${RABBIT_LISTENER_CONCURRENCY:2}
    # AI 배치 잡 발행(ADR-0036). 로컬/dev는 미기동(스위치 off라 발행 안 함), prod는 env로 override.
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:liveclass}
    password: ${SPRING_RABBITMQ_PASSWORD:liveclass}

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: LIVECLASS_SESSION
        http-only: true             # ADR-0014: JS가 못 읽음
        same-site: lax
        secure: false               # prod(https)에서 true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # prometheus = 스크레이프 엔드포인트
  health:
    # SMTP를 헬스체크에 넣지 않는다. /actuator/health는 컨테이너 healthcheck가 부르는 곳이라,
    # 메일 서버가 잠깐 안 붙는 것만으로 앱이 DOWN이 되고 재시작된다 — 비밀번호 찾기 하나 때문에
    # 강의 중인 서비스가 내려가면 안 된다. 발송 실패는 그 요청에서 502로 답하면 충분하다.
    mail:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}      # 스크레이프된 메트릭에 앱 식별 태그
  tracing:
    sampling:
      probability: 1.0            # 요청마다 traceId 생성(로그·에러 상관관계용). 익스포터는 후속.

logging:
  level:
    com.liveclass: INFO           # 우리 코드 기본. 특정 모듈만 올리려면 아래처럼 개별 지정.
    com.liveclass.auth: INFO      # 예: 인증 디버깅 시 DEBUG
    com.liveclass.curriculum: INFO
    com.liveclass.lesson: INFO
    com.liveclass.common: INFO

livekit:
  # 브라우저 WebRTC 접속 URL (토큰 응답에 실림). 기본값이 443의 /livekit인 이유는 ADR-0078 —
  # 7000~7999를 막는 망이 있어 :7443으로는 시그널링부터 붙지 않는다. 로컬 개발자도 같은 망에
  # 있을 수 있으므로 기본값 자체를 안전한 쪽에 둔다.
  url: ${LIVEKIT_URL:wss://jiphyeonjeon.thdwjdrl.com/livekit}
  # 백엔드가 방 제어·Egress 시작에 쓰는 서버 API URL. 브라우저와 네트워크 위치가 달라 따로 둔다.
  # 비우면 위 url에서 파생(wss→https) — 단일 호스트 개발 환경은 둘이 같다.
  api-url: ${LIVEKIT_API_URL:}
  api-key: ${LIVEKIT_API_KEY:devkey}                  # dev/test 더미. 운영은 환경변수 주입.
  api-secret: ${LIVEKIT_API_SECRET:devsecretdevsecretdevsecretdevsecret}  # 커밋 금지 값은 env로
  # /end 동기 순차 요청이 Room·Egress 서버 제어에서 무기한 멈추지 않게 호출 전체에 적용한다.
  control-timeout: ${LIVEKIT_CONTROL_TIMEOUT:10s}
  token-ttl-seconds: ${LIVEKIT_TOKEN_TTL:600}         # 10분
  # explicit AgentDispatch로 지목할 STT agent 이름(CONTRACT §3-3).
  # realtime-agent의 STT_AGENT_NAME(ai/realtime-agent/.env.example)과 반드시 같은 값이어야 job이 배정된다.
  agent-name: ${LIVEKIT_AGENT_NAME:liveclass-realtime-stt-prod}
  # 강사가 끊긴 뒤 방을 열어 둘 시간(초). LiveKit 기본값 20초로는 강의를 진행할 수 없다 —
  # 20초 안에 못 돌아오면 방이 닫히고 Egress가 종료되어 HLS·녹화가 영구히 끊긴다(강사가 다시
  # 들어와도 되살아나지 않는다). 와이파이 전환처럼 수십 초 끊기는 일이 흔하다.
  room-departure-timeout-seconds: ${LIVEKIT_ROOM_DEPARTURE_TIMEOUT:600}   # 10분
  # 방을 만든 뒤 아무도 안 들어올 때 닫기까지(초). preflight 장치 점검 시간보다 넉넉해야 한다.
  room-empty-timeout-seconds: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:900}           # 15분
  egress:                                             # HLS 녹화 출력(S3/MinIO). infra/livekit/request-hls.json 대응.
    bucket: ${EGRESS_BUCKET:recordings}
    s3-endpoint: ${EGRESS_S3_ENDPOINT:http://localhost:9000}   # 내부 주소 — 백엔드가 매니페스트를 읽는 곳
    # Egress가 세그먼트를 올릴 주소. Egress는 호스트 네트워크라 도커 서비스명을 해석하지 못하므로
    # 운영에서는 공개 도메인을 쓴다. 비우면 위 내부 주소를 그대로 쓴다(단일 호스트 개발 환경).
    upload-endpoint: ${EGRESS_UPLOAD_ENDPOINT:}

    s3-access-key: ${EGRESS_S3_ACCESS_KEY:minioadmin}          # 커밋 금지 값은 env로
    s3-secret: ${EGRESS_S3_SECRET:minioadmin}
    s3-region: ${EGRESS_S3_REGION:us-east-1}
    force-path-style: ${EGRESS_FORCE_PATH_STYLE:true}          # MinIO는 path-style 필요
    # 세그먼트 길이는 라이브 지연을 직접 좌우한다. 플레이어가 라이브 엣지에서 N개 뒤부터 재생하므로
    # (hls.js liveSyncDurationCount) 서버·클라이언트 양쪽 지연이 이 값에 비례한다.
    #
    # 1초까지 낮춰 총 지연을 ~10초에서 절반 이하로 줄였으나 실사용에서 버퍼링이 잦아 2초로 되돌린다.
    # 세그먼트가 짧으면 버퍼가 그만큼 얇아져(엣지 뒤 2개 = 2초) 네트워크가 조금만 흔들려도 바닥난다.
    # 화면공유는 비트레이트가 크게 튀는 구간이 있어 특히 취약했다. 지연보다 끊김 없는 재생이 우선이다.
    segment-duration-seconds: ${EGRESS_SEGMENT_DURATION:2}
    # 합성 출력 인코딩. 프리셋(H264_1080P_30 등)은 30fps 고정이라 값으로 직접 넘긴다.
    # 안 주면 Egress 기본 720p라 1080p 송출이 다운스케일된다.
    encoding-width: ${EGRESS_ENCODING_WIDTH:1920}
    encoding-height: ${EGRESS_ENCODING_HEIGHT:1080}
    # 강의 화면(슬라이드·코드·말하는 사람)에 30fps는 낭비다. 15로 낮추면 Egress 인코딩 부하가 절반이
    # 되고, 같은 비트레이트가 프레임당 두 배로 쓰여 정지 화면의 글자가 오히려 또렷해진다.
    # 움직임이 많은 콘텐츠로 성격이 바뀌면 30으로 올린다.
    framerate: ${EGRESS_FRAMERATE:15}
    # 강사 송출(화면공유 8,000kbps·30fps = 프레임당 267kbit)을 재인코딩 손실 없이 담을 값.
    # 15fps로 내보내므로 8,000kbps는 프레임당 533kbit — 원본의 2배라 2차 손실이 사실상 없다.
    # 화질 상한은 강사 송출이므로 여기만 올리는 것은 효과가 없다(frontend/publishQuality.ts).
    #
    # CPU는 해상도·프레임률이 지배하므로 이 값을 올려도 많이 늘지는 않지만 0도 아니다.
    # 4,500kbps 시절 녹화 1건이 1.85코어였고 이 값에서의 실측은 아직 없다 — Egress의
    # room_composite_cpu_cost(기본 4.0)를 낮춰 동시 방 수를 늘리려면 먼저 다시 재야 한다.
    video-bitrate-kbps: ${EGRESS_VIDEO_BITRATE_KBPS:8000}
    audio-bitrate-kbps: ${EGRESS_AUDIO_BITRATE_KBPS:128}
    audio-frequency: ${EGRESS_AUDIO_FREQUENCY:44100}
    # 합성 화면을 그릴 페이지의 오리진. Egress의 헤드리스 Chrome이 여는 주소라 브라우저 주소와
    # 다를 수 있다. 경로(/egress/stage)는 코드가 붙이므로 오리진만 넣는다.
    # 비우면 LiveKit 기본 템플릿 — 화면공유가 83%로 축소되고 검은 여백이 남는다(운영 실측).
    template-base-url: ${EGRESS_TEMPLATE_BASE_URL:}
    playlist-name: index.m3u8
    live-playlist-name: live.m3u8
    layout: grid

# 라이브 시작 오케스트레이션(ADR-0002 choinhoo/0002).
live:
  stt:
    # true면 captionEnabled 세션에서도 AgentDispatch만 만들고 Gate S1(job 배정)·S2(STT_READY)·S3②를 건너뛴다.
    # 임시 우회 플래그다 — 그동안 자막 없이 LIVE가 될 수 있다(ADR §5-1). AI 담당자의 readiness API·callback
    # 배포 뒤 false로 전환한다. 강사 publisher 재검증(Gate S3①)은 이 값과 무관하게 항상 수행한다.
    assume-ready: ${LIVE_STT_ASSUME_READY:true}
  start:
    # Egress Gate B~C(EGRESS_ACTIVE + manifest·첫 세그먼트) bounded polling. 과거 Chrome page load가
    # 20초까지 걸린 인프라 기록을 고려한 시작값이며 운영 지표로 조정한다(ADR §4).
    egress-readiness-timeout: ${LIVE_START_EGRESS_TIMEOUT:45s}
    egress-poll-interval: ${LIVE_START_EGRESS_POLL_INTERVAL:1s}
    # 즉시 trigger가 죽으면 reconciler가 lease 만료 뒤 같은 attempt를 다시 집는다. 정상 45초 polling
    # 도중에는 다른 인스턴스가 중복 실행하지 않도록 timeout보다 길게 둔다.
    execution-lease: ${LIVE_START_EXECUTION_LEASE:90s}
    reconcile-fixed-delay: ${LIVE_START_RECONCILE_DELAY:10s}
    reconcile-initial-delay: ${LIVE_START_RECONCILE_INITIAL_DELAY:20s}
  end:
    # 강사가 종료를 누르지 않고 사라진 세션을 끝내는 루프(ADR-0119).
    #
    # start-grace: 시작 직후에는 강사 publisher가 아직 안 붙어 방이 비어 보인다. 그 창을 피한다.
    # empty-grace: 방이 이만큼 비어 있어야 종료한다.
    #
    # **이 값은 livekit.room-departure-timeout-seconds(기본 10분)보다 커야 한다.** 그 10분은
    # 강사가 끊겨도 방을 열어 두는 시간이고, 그동안 방은 비어 있다 — 돌아올 사람을 기다리는
    # 중이라서다. 그보다 먼저 세션을 끊으면 방을 열어 둔 의미가 없어진다. 더 짧게 잡으면
    # LiveEndReconciler가 기동 시 끌어올리고 경고를 남긴다.
    start-grace: ${LIVE_END_START_GRACE:2m}
    empty-grace: ${LIVE_END_EMPTY_GRACE:12m}
    reconcile-fixed-delay: ${LIVE_END_RECONCILE_DELAY:60s}
    reconcile-initial-delay: ${LIVE_END_RECONCILE_INITIAL_DELAY:45s}

video:
  playback:
    # manifest 내부 세그먼트 presigned GET 유효기간. 델타 재생목록은 옛 세그먼트 URL을 다시 주지 않으므로
    # 이 값이 강의 길이보다 짧으면 오래 시청한 학생이 앞으로 되감을 때 403을 맞는다.
    segment-url-ttl: ${VIDEO_PLAYBACK_SEGMENT_URL_TTL:6h}
    # 델타 재생목록 경계(#EXT-X-SERVER-CONTROL:CAN-SKIP-UNTIL). 타깃 듀레이션의 6배 이상이어야 한다
    # (세그먼트 2초 → 최소 12초). 이보다 오래된 세그먼트는 #EXT-X-SKIP으로 생략된다.
    can-skip-until: ${VIDEO_PLAYBACK_CAN_SKIP_UNTIL:60s}
    # 세그먼트 presigned URL을 서명할 공개 주소. 브라우저가 여는 주소라 egress s3-endpoint(내부)와 다르다.
    # SigV4가 Host를 서명에 포함하므로 브라우저가 실제로 보낼 Host로 서명해야 한다.
    # 비우면 내부 주소로 서명 — 로컬에서 vite(:8083) 프록시를 쓰면 http://localhost:8083을 넣는다.
    public-endpoint: ${VIDEO_PLAYBACK_PUBLIC_ENDPOINT:}

recorded:
  video:
    # 업로드 녹화강의 기능 스위치. worker·RabbitMQ·MinIO를 배포하지 않은 환경은 false로 닫는다.
    enabled: ${RECORDED_VIDEO_ENABLED:true}
    source-secret: ${MEDIA_SOURCE_SECRET:dev-media-source-secret}
    callback-secret: ${MEDIA_CALLBACK_SECRET:dev-media-callback-secret}
    dispatch:
      fixed-delay-ms: ${RECORDED_VIDEO_DISPATCH_DELAY_MS:3000}
      initial-delay-ms: ${RECORDED_VIDEO_DISPATCH_INITIAL_DELAY_MS:15000}
  stt:
    # ADR-0011. Spring과 recorded-stt-worker 양쪽이 준비된 환경에서만 명시적으로 켠다.
    enabled: ${RECORDED_STT_ENABLED:false}
    source-secret: ${RECORDED_STT_SOURCE_SECRET:dev-recorded-stt-source-secret}
    callback-secret: ${RECORDED_STT_CALLBACK_SECRET:dev-recorded-stt-callback-secret}
    dispatch:
      fixed-delay-ms: ${RECORDED_STT_DISPATCH_DELAY_MS:3000}
      initial-delay-ms: ${RECORDED_STT_DISPATCH_INITIAL_DELAY_MS:15000}
  publication:
    # 두 callback 커밋 경계에서 게시 평가가 누락된 READY+READY|EMPTY+DRAFT 조합의 복구 주기.
    reconcile-delay-ms: ${RECORDED_PUBLICATION_RECONCILE_DELAY_MS:60000}
    reconcile-initial-delay-ms: ${RECORDED_PUBLICATION_RECONCILE_INITIAL_DELAY_MS:60000}

asset:
  storage:
    # 에셋(썸네일·프로필 이미지) presigned 업로드용 S3 호환 스토리지. 로컬은 MinIO.
    # 비밀키는 커밋하지 않는다 — dev 기본값만 두고 운영은 환경변수로 주입한다.
    endpoint: ${ASSET_STORAGE_ENDPOINT:http://localhost:9000}    # MinIO. 운영 S3 배정 시 교체.
    region: ${ASSET_STORAGE_REGION:us-east-1}
    bucket: ${ASSET_STORAGE_BUCKET:liveclass-assets}
    access-key: ${ASSET_STORAGE_ACCESS_KEY:minioadmin}          # 커밋 금지 값은 env로
    secret-key: ${ASSET_STORAGE_SECRET_KEY:minioadmin}
    path-style: ${ASSET_STORAGE_PATH_STYLE:true}                # MinIO는 path-style 필요
    upload-ttl-seconds: ${ASSET_STORAGE_UPLOAD_TTL:600}         # presigned PUT 유효기간(10분)
    download-ttl-seconds: ${ASSET_STORAGE_DOWNLOAD_TTL:3600}    # presigned GET 유효기간(1시간)
  reaper:
    # 티켓만 받고 완료 통지가 없던 PENDING 에셋 정리(→ FAILED). 행은 지우지 않는다(감사 추적 유지).
    pending-expiry-hours: ${ASSET_REAPER_PENDING_EXPIRY_HOURS:24}   # 이보다 오래된 PENDING을 회수(PUT TTL 10분보다 충분히 뒤)
    fixed-delay: ${ASSET_REAPER_FIXED_DELAY:PT1H}                   # 회수 주기(ISO-8601 Duration)
    initial-delay: ${ASSET_REAPER_INITIAL_DELAY:PT5M}               # 기동 직후 첫 실행까지 지연

liveclass:
  # 이 노드가 주기 작업을 도는가(ADR-0127). 앱 전체의 @Scheduled가 한 스위치에 매달려 있다
  # (AssetSchedulingConfig — 이 앱에서 @EnableScheduling은 그 한 곳뿐이다).
  #
  # **끄는 이유는 낭비가 아니라 정확성이다.** 주기 작업 중 여러 대가 동시에 돌아도 안전하다고
  # 확인된 것은 일부뿐이고, LiveStartingSoonScheduler는 잠금이 없어 두 노드가 같은 예정 행을
  # 집으면 아웃박스에 두 줄을 넣는다고 스스로 적어 두고 있다. 노드를 늘리기 전에 그 전부를
  # 감사하는 대신, 늘어나는 노드에서는 주기 작업을 아예 돌리지 않는다.
  #
  # 빈은 그대로 두고 스케줄 등록만 끄므로, 다른 코드가 직접 부르는 경로는 살아 있다.
  scheduling:
    enabled: ${LIVECLASS_SCHEDULING_ENABLED:true}
  egress:
    # 유령 Egress 회수 중계(infra/livekit/egress-purger). 비워 두면 기능이 꺼지고 콘솔이 그렇게 말한다.
    #
    # 왜 중계인가: LiveKit Redis는 EC2 로컬(--bind 127.0.0.1)에만 열려 있어 백엔드 컨테이너에서
    # 직접 닿지 못한다. 브리지에 그 Redis를 열면 인증 없는 제어 평면이 같은 네트워크의 모든
    # 컨테이너에 열리므로, "유령 하나 제거"라는 동사 하나만 시크릿으로 인증해 부른다.
    # 운영 주소는 docker 브리지 게이트웨이(172.18.0.1:9107) — docker-compose.prod.yml의 env로 넣는다.
    purger:
      base-url: ${EGRESS_PURGER_BASE_URL:}
      secret: ${EGRESS_PURGE_SECRET:}
  ws:
    # WebSocket 핸드셰이크 오리진 화이트리스트(CSWSH 방어, ADR-0019). 같은 오리진 배포(nginx)라
    # 운영은 도메인 하나면 충분하고, dev는 Vite(localhost:*)만 허용한다. 콤마 없이 리스트로 override 가능.
    allowed-origin-patterns:
      - http://localhost:*
      - https://jiphyeonjeon.thdwjdrl.com
  # 라이브 자막 Redis Stream consumer(ADR-0043, CONTRACT §3-4). 소비 대상은 spring.data.redis가
  # 가리키는 프로필 구동 Redis다(로컬=localhost, remote=EC2 :4000 application Redis). ai-api가
  # ai-rag-live-v1로 이미 소비하므로 Spring은 반드시 별도 그룹을 쓴다.
  # Spring→ai-api RAG SSE 프록시(ADR-0047, CONTRACT §3-9). 브라우저는 Spring만 호출한다.
  ai:
    # compose 내부망 서비스명. 로컬에 ai-api가 없으면 연결 실패 → 503 AI_ANSWER_UNAVAILABLE(무해).
    api-base-url: ${AI_API_BASE_URL:http://ai-api:8010}
    # HMAC 공유 시크릿. 콜백용 AI_CALLBACK_SECRET과 **다른 값**이다(docs/ai/CONTRACT.md §3.2).
    # 운영은 env 주입(커밋 금지). 값이 틀리면 ai-api가 401 → 502 AI_ANSWER_UPSTREAM_REJECTED.
    internal-secret: ${AI_INTERNAL_SECRET:dev-ai-internal-secret}
    connect-timeout: ${AI_API_CONNECT_TIMEOUT:3s}
    # 스트리밍이라 길게. 브라우저 SSE emitter 타임아웃도 이 값을 그대로 쓴다.
    stream-timeout: ${AI_API_STREAM_TIMEOUT:5m}
  # 판서 해석(ADR-0054, CONTRACT §3-6e). 손그림 → mermaid/LaTeX.
  #
  # ai-api를 거치지 않고 Spring이 GMS를 직접 부른다 — 이 호출에는 검색도 임베딩도 자막 컨텍스트도
  # 없어 파이썬이 할 도메인 일이 없다. RAG 컨텍스트가 필요해지면 그때 옮기며, FE 계약은 그대로다.
  #
  # 키가 없으면 기능이 꺼진 것으로 본다(502 ANNOTATION_INTERPRET_FAILED). 로컬에서 키 없이 띄워도
  # 강의는 그대로 돌아야 하므로 기동을 막지 않는다. 브라우저는 이 키를 절대 받지 않는다.
  annotation-ai:
    base-url: ${ANNOTATION_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${ANNOTATION_AI_API_KEY:${AI_API_GMS_API_KEY:}}
    model: ${ANNOTATION_AI_MODEL:gpt-4.1}
    connect-timeout: ${ANNOTATION_AI_CONNECT_TIMEOUT:5s}
    # 이미지를 읽는 호출이라 텍스트 질의보다 길다. 강사가 기다리는 화면이라 무한정 둘 수도 없다.
    request-timeout: ${ANNOTATION_AI_REQUEST_TIMEOUT:60s}
    max-image-bytes: ${ANNOTATION_AI_MAX_IMAGE_BYTES:4194304}   # 4MB
    # 모델이 이미지를 가져갈 공개 오리진(ADR-0058). 인터넷에서 닿아야 한다 — 받아가는 쪽이 모델
    # 제공자의 서버다. 이미지를 본문에 실으면 게이트웨이 본문 한도(~100KB)에 걸린다.
    image-base-url: ${ANNOTATION_AI_IMAGE_BASE_URL:https://jiphyeonjeon.thdwjdrl.com}
  caption:
    enabled: ${CAPTION_CONSUMER_ENABLED:true}
    stream-key: ${CAPTION_STREAM_KEY:ai:captions:live}   # 전역 키(producer env와 정합)
    group: ${CAPTION_CONSUMER_GROUP:spring-caption-live-v1}
    # dev 인프라를 여러 개발자가 공유하면 그룹을 분리한다(같은 그룹이면 서로 메시지를 뺏음).
    group-instance-suffix: ${CAPTION_CONSUMER_GROUP_SUFFIX:}
    consumer: ${CAPTION_CONSUMER_NAME:}                   # 비면 HOSTNAME 기반 안정 이름 파생
    batch-size: ${CAPTION_CONSUMER_BATCH_SIZE:100}
    poll-timeout: ${CAPTION_CONSUMER_POLL_TIMEOUT:1s}
  # 강의 노트 소비(CONTRACT §3-4a). 자막과 같은 Redis를 본다.
  # 기본 꺼짐 — 켜는 순간 운영 노트가 쌓이기 시작하므로 환경별로 명시적으로 켠다.
  lecture-note:
    enabled: ${LECTURE_NOTE_CONSUMER_ENABLED:false}
    stream-key: ${LECTURE_NOTE_STREAM_KEY:ai:lecture-notes:mvp}
    group: ${LECTURE_NOTE_CONSUMER_GROUP:spring-lecture-notes-live-v1}
    group-instance-suffix: ${LECTURE_NOTE_CONSUMER_GROUP_SUFFIX:}
    consumer: ${LECTURE_NOTE_CONSUMER_NAME:}
    batch-size: ${LECTURE_NOTE_CONSUMER_BATCH_SIZE:50}
    poll-timeout: ${LECTURE_NOTE_CONSUMER_POLL_TIMEOUT:1s}

# AI 워커 콜백(ADR-0036) — HMAC 서명 검증 시크릿. 워커와 같은 값을 공유한다. 운영은 env로 주입(커밋 금지).
ai:
  callback-secret: ${AI_CALLBACK_SECRET:dev-ai-callback-secret}

# 자료 임베딩 파이프라인 스위치(ADR-0036). true면 자료 연결/해제 시 outbox 발행 + PENDING 전환.
# 릴레이(RabbitMQ)와 AI 워커가 준비되기 전까지는 false — 연결만 하고 상태 READY(무회귀).
material:
  embedding:
    enabled: ${MATERIAL_EMBEDDING_ENABLED:false}

# outbox → RabbitMQ 릴레이 폴링 주기(ADR-0036). 발행 전용, 빈 결과면 무해.
#
# 5초에서 30초로 늘렸다(ADR-0122). 잡이 실린 트랜잭션이 커밋되면 릴레이가 곧바로 깨어나므로
# 폴링은 더 이상 발행 지연을 결정하지 않는다 — 평소 지연은 오히려 최대 5초에서 수십 ms로 줄었다.
#
# 그래도 **폴링을 없애지는 않는다**. 트리거가 닿지 않는 자리가 넷 있다.
#   1. 발행에 실패해 백오프를 기다리는 행 — 그 시각에 커밋하는 사람이 없다.
#   2. 트리거를 쏜 직후 프로세스가 죽으면 그 신호는 어디에도 남지 않는다.
#   3. 다른 인스턴스에서 일어난 커밋은 이 프로세스의 트리거를 부르지 못한다.
#   4. 기동 시점에 남아 있던 PENDING은 애초에 아무 커밋도 동반하지 않는다.
outbox:
  relay:
    fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:30000}
    initial-delay-ms: ${OUTBOX_RELAY_INITIAL_DELAY_MS:15000}

# ── 알림 ──
#
# ── 노드 역할 (ADR-0127) ──
# 같은 산출물을 아래 네 값만 바꿔 배포하면 역할이 갈린다.
#
#                              web            push 전용
#   ───────────────────────────────────────────────────────
#   notification.fanout.listener-enabled   true      false
#   notification.push.listener-enabled     false     true
#   liveclass.scheduling.enabled           true      false
#   caption / lecture-note consumer        true      false
#
# 나눈 이유는 두 일의 병목이 다르기 때문이다 — 실측으로 팬아웃은 DB가(앱 CPU 39% · pg 90%)
# 발송은 앱 CPU가(앱 82% · pg 21%) 막고, 그래서 팬아웃은 워커를 늘려도 2대에서 멈추는 반면
# 발송은 1.79배로 늘어난다. 한 프로세스에 두면 서로 CPU를 훔치고(동시 실행 시 발송
# 1,636건/s → 분리 시 2,654건/s), 늘리고 싶은 쪽만 늘릴 수도 없다.
#
# 기본값은 전부 켜짐이라 **한 대로 돌리던 동작은 그대로다.** 나누는 것은 배포의 선택이다.
notification:
  # 알림 본체(core.notification)는 월 파티션이다(ADR-0123). 잡이 매일 새벽 + 기동 직후에
  # 앞으로 months-ahead개월치를 선생성하고, DEFAULT 파티션(에어백)에 행이 있으면 WARN을 남긴다.
  partition:
    months-ahead: ${NOTIFICATION_PARTITION_MONTHS_AHEAD:3}
    maintenance-cron: ${NOTIFICATION_PARTITION_MAINTENANCE_CRON:0 40 4 * * *}
  # 보존 기간(개월). 지난 파티션은 DELETE가 아니라 DROP으로 정리한다 — 몇 ms로 끝나고 팽창이 없다.
  # **정책은 미확정이다**(ADR-0123): 확정 전까지 보수적으로 12개월을 두고, 정해지면 이 값만 바꾼다.
  # 중복 제거 등록표는 보존과 무관하게 영구다 — 파티션이 사라져도 지난 사건이 다시 알리지 않는다.
  retention:
    months: ${NOTIFICATION_RETENTION_MONTHS:12}
  web-push:
    # VAPID 키쌍(RFC 8292). **벤더 계정 등록이 필요 없다** — 키는 우리가 만들고 푸시 서비스는
    # 서명으로 "같은 서버가 보냈다"만 확인한다.
    #
    # 비어 있으면 푸시가 **꺼진 채로** 동작한다. 로컬·테스트에서 키를 만들 이유가 없고, 없다고
    # 알림 자체가 멈추면 안 된다 — 푸시는 알림함 위에 얹는 층이다.
    #
    # 운영은 env로 넣는다. 개인키는 절대 저장소에 두지 않는다.
    public-key: ${NOTIFICATION_WEB_PUSH_PUBLIC_KEY:}
    private-key: ${NOTIFICATION_WEB_PUSH_PRIVATE_KEY:}
    # 푸시 서비스가 문제 생겼을 때 연락할 곳. mailto: 또는 https: URL.
    subject: ${NOTIFICATION_WEB_PUSH_SUBJECT:mailto:liveclass@example.com}
    # 동시 발송 상한. Web Push에는 배치가 없어 기기 수만큼 HTTPS를 쳐야 하고, 안 묶으면 조각
    # 하나가 기기 수천 대일 때 요청이 한꺼번에 나가 푸시 서비스가 429로 막는다.
    #
    # **실측으로 정한 값이다**(운영 4코어, 목 FCM 지연 230ms, 2만 건 × 3회 중앙값):
    #     상한  200 →   726건/s
    #     상한  800 → 1,609건/s   ← 채택
    #     상한 1600 → 1,605건/s   ← 800보다 나을 것이 없다
    #
    # 라이브러리를 쓰던 때는 이 값이 아무 의미가 없었다(439 → 470 → 474건/s). 암호화가 건당
    # 7.79ms라 CPU가 먼저 막았기 때문이다. 직접 구현으로 그게 싸진 뒤에야 손잡이가 됐다.
    #
    # 더 올리지 않는 이유가 하나 더 있다 — 실제 FCM에는 Chrome 정책 상한(분당 1,000)이 있어
    # 초당 1,609건은 그 96배다. 대규모 팬아웃에서 그 속도로 밀면 429를 맞고 벌칙이 누적된다.
    max-in-flight: ${NOTIFICATION_WEB_PUSH_MAX_IN_FLIGHT:800}
    # 연결 하나가 소화하는 동시 요청 수. **실측값이다** — FCM·Mozilla 모두 연결 직후 SETTINGS로
    # MAX_CONCURRENT_STREAMS=100을 광고한다(2026-08-04 확인). 연결 수는 이 값과 위 상한에서
    # 계산하므로, 상한만 올리고 연결이 그대로여서 조용히 막히는 일이 없다.
    streams-per-connection: ${NOTIFICATION_WEB_PUSH_STREAMS_PER_CONNECTION:100}
    # 암호화 전용 스레드 수. 0이면 코어 수를 쓴다. **CPU 바운드라 코어 수를 넘겨도 의미가 없다** —
    # 운영 장비(4코어)에서 스레드 8개가 4개보다 7% 빠를 뿐이다(초당 475 대 444건).
    crypto-threads: ${NOTIFICATION_WEB_PUSH_CRYPTO_THREADS:0}
    connect-timeout-ms: ${NOTIFICATION_WEB_PUSH_CONNECT_TIMEOUT_MS:5000}
    request-timeout-ms: ${NOTIFICATION_WEB_PUSH_REQUEST_TIMEOUT_MS:10000}
    # 조각 하나 전체(재시도 포함)의 상한. 넘으면 끝난 것만 반영하고 나머지는 버린다 — 조각 하나가
    # 큐 소비자를 오래 붙잡을수록 뒤에 선 다른 알림이 그만큼 늦는다.
    batch-timeout-ms: ${NOTIFICATION_WEB_PUSH_BATCH_TIMEOUT_MS:60000}
    # 재시도는 **기기 단위**다. 실패한 기기만 다시 보내므로 이미 받은 기기가 두 번 울지 않는다.
    # 조각 단위로는 할 수 없다 — 그건 메시지 재배달이고, 중복 제거가 수신자 명단을 비워 버린다.
    max-attempts: ${NOTIFICATION_WEB_PUSH_MAX_ATTEMPTS:3}
    # 지수 백오프의 첫 간격. 상대가 Retry-After를 주면 그 값이 이긴다.
    retry-backoff-ms: ${NOTIFICATION_WEB_PUSH_RETRY_BACKOFF_MS:500}
  fanout:
    # 이 노드가 팬아웃 큐를 소비하는가. 발송 전용 노드는 이 값을 false로 두고 뜬다(ADR-0127).
    listener-enabled: ${NOTIFICATION_FANOUT_LISTENER_ENABLED:true}
  # 푸시 전달 큐(ADR-0124). 팬아웃에서 분리된 전용 소비자·진행 표의 손잡이들.
  push:
    # 이 노드가 발송 큐를 소비하는가. 발송 전용 노드를 두는 수단이고(ADR-0127), 운영에서
    # 발송만 잠시 멈추는 데도 쓴다 — 메시지는 durable이라 큐에 쌓였다가 재개하면 나간다.
    listener-enabled: ${NOTIFICATION_PUSH_LISTENER_ENABLED:true}
    # 푸시 큐 소비자 수. 팬아웃의 concurrency와 **별개다** — 푸시(조각당 최대 batch-timeout)가
    # 팬아웃 소비자를 붙잡지 않게 분리한 것이 이 큐의 존재 이유라, 손잡이도 따로 둔다.
    # 분리 후 실측 전의 기본값이다. 푸시 처리량이 문제면 이 값부터 잰다(위 max-in-flight를
    # 나눠 갖는 구조는 그대로이므로, 늘릴 때는 그 상한과 함께 본다).
    listener-concurrency: ${NOTIFICATION_PUSH_LISTENER_CONCURRENCY:2}
    # 한 사건을 몇 번까지 다시 실을 것인가(ADR-0128). 푸시 서비스가 429·5xx로 막아 batch-timeout
    # 안에 못 보낸 사람은 진행 표에 기록하지 않고 새 명령으로 다시 싣는데, 상한이 없으면 상대가
    # 계속 막을 때 같은 명단이 큐를 영원히 돈다. 상한에 닿으면 포기하고 WARN으로 사람 수를 남긴다.
    #
    # 4는 "몇 분 안에 회복되는 스로틀링은 넘기고, 몇 시간짜리 장애는 붙들지 않는다"는 값이다 —
    # 아래 대기(30초)와 곱하면 최소 1분 30초, Retry-After가 길면 그만큼 늘어난다.
    max-delivery-attempts: ${NOTIFICATION_PUSH_MAX_DELIVERY_ATTEMPTS:4}
    # 다시 싣기 전 기본 대기. **상대가 Retry-After를 주면 그 값이 이긴다** — 언제 와도 되는지는
    # 그쪽이 안다. 이 값은 응답을 아예 못 봤을 때(타임아웃)처럼 알려 준 게 없을 때만 쓴다.
    retry-delay-ms: ${NOTIFICATION_PUSH_RETRY_DELAY_MS:30000}
    # 진행 표 파티션 잡. 매일치 선생성(14일) + 오래된 파티션 DROP(7일)이라 주기가 정확할 필요
    # 없다 — 하루 안에 한 번만 성공하면 되는 관대한 잡이다(PushProgressPartitionJob).
    partition-maintenance-ms: ${NOTIFICATION_PUSH_PARTITION_MAINTENANCE_MS:21600000}
    partition-initial-delay-ms: ${NOTIFICATION_PUSH_PARTITION_INITIAL_DELAY_MS:15000}
