spring:
  application:
    name: liveclass
  threads:
    virtual:
      enabled: true                 # Java 21 virtual threads (ADR-0009)
  # 인프라 접속(datasource·redis)의 기본값 = 전부 로컬(docker-compose.yml). 프로필 없이 뜨면 이 값.
  # 전부 EC2 인프라에 붙으려면 SPRING_PROFILES_ACTIVE=remote → application-remote.yml이 override (ADR-0022).
  # prod(docker-compose.prod.yml)는 프로필 대신 SPRING_DATASOURCE_URL 등 env로 override(우선순위 상위).
  datasource:
    url: jdbc:postgresql://localhost:5432/liveclass
    username: liveclass
    password: liveclass             # 로컬 dev (docker-compose .env와 일치)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # 스키마는 Flyway가 소유, JPA는 검증만
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas:
      - core                        # core = Spring 단독 쓰기 (ai는 Python/Alembic)
    default-schema: core
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  session:
    timeout: 30m
    data:
      redis:
        namespace: liveclass:session  # 세션 본체 → Redis (앱 무상태). Boot 4.0: spring.session.redis.* → spring.session.data.redis.*
  rabbitmq:
    # AI 배치 잡 발행(ADR-0036). 로컬/dev는 미기동(스위치 off라 발행 안 함), prod는 env로 override.
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:liveclass}
    password: ${SPRING_RABBITMQ_PASSWORD:liveclass}

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: LIVECLASS_SESSION
        http-only: true             # ADR-0014: JS가 못 읽음
        same-site: lax
        secure: false               # prod(https)에서 true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # prometheus = 스크레이프 엔드포인트
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}      # 스크레이프된 메트릭에 앱 식별 태그
  tracing:
    sampling:
      probability: 1.0            # 요청마다 traceId 생성(로그·에러 상관관계용). 익스포터는 후속.

logging:
  level:
    com.liveclass: INFO           # 우리 코드 기본. 특정 모듈만 올리려면 아래처럼 개별 지정.
    com.liveclass.auth: INFO      # 예: 인증 디버깅 시 DEBUG
    com.liveclass.curriculum: INFO
    com.liveclass.lesson: INFO
    com.liveclass.common: INFO

livekit:
  url: ${LIVEKIT_URL:wss://jiphyeonjeon.thdwjdrl.com:7443}   # 브라우저 WebRTC 접속 URL (토큰 응답에 실림)
  # 백엔드가 방 제어·Egress 시작에 쓰는 서버 API URL. 브라우저와 네트워크 위치가 달라 따로 둔다.
  # 비우면 위 url에서 파생(wss→https) — 단일 호스트 개발 환경은 둘이 같다.
  api-url: ${LIVEKIT_API_URL:}
  api-key: ${LIVEKIT_API_KEY:devkey}                  # dev/test 더미. 운영은 환경변수 주입.
  api-secret: ${LIVEKIT_API_SECRET:devsecretdevsecretdevsecretdevsecret}  # 커밋 금지 값은 env로
  # /end 동기 순차 요청이 Room·Egress 서버 제어에서 무기한 멈추지 않게 호출 전체에 적용한다.
  control-timeout: ${LIVEKIT_CONTROL_TIMEOUT:10s}
  token-ttl-seconds: ${LIVEKIT_TOKEN_TTL:600}         # 10분
  # explicit AgentDispatch로 지목할 STT agent 이름(CONTRACT §3-3).
  # realtime-agent의 STT_AGENT_NAME(ai/realtime-agent/.env.example)과 반드시 같은 값이어야 job이 배정된다.
  agent-name: ${LIVEKIT_AGENT_NAME:liveclass-realtime-stt-prod}
  # 강사가 끊긴 뒤 방을 열어 둘 시간(초). LiveKit 기본값 20초로는 강의를 진행할 수 없다 —
  # 20초 안에 못 돌아오면 방이 닫히고 Egress가 종료되어 HLS·녹화가 영구히 끊긴다(강사가 다시
  # 들어와도 되살아나지 않는다). 와이파이 전환처럼 수십 초 끊기는 일이 흔하다.
  room-departure-timeout-seconds: ${LIVEKIT_ROOM_DEPARTURE_TIMEOUT:600}   # 10분
  # 방을 만든 뒤 아무도 안 들어올 때 닫기까지(초). preflight 장치 점검 시간보다 넉넉해야 한다.
  room-empty-timeout-seconds: ${LIVEKIT_ROOM_EMPTY_TIMEOUT:900}           # 15분
  egress:                                             # HLS 녹화 출력(S3/MinIO). infra/livekit/request-hls.json 대응.
    bucket: ${EGRESS_BUCKET:recordings}
    s3-endpoint: ${EGRESS_S3_ENDPOINT:http://localhost:9000}   # 내부 주소 — 백엔드가 매니페스트를 읽는 곳
    # Egress가 세그먼트를 올릴 주소. Egress는 호스트 네트워크라 도커 서비스명을 해석하지 못하므로
    # 운영에서는 공개 도메인을 쓴다. 비우면 위 내부 주소를 그대로 쓴다(단일 호스트 개발 환경).
    upload-endpoint: ${EGRESS_UPLOAD_ENDPOINT:}

    s3-access-key: ${EGRESS_S3_ACCESS_KEY:minioadmin}          # 커밋 금지 값은 env로
    s3-secret: ${EGRESS_S3_SECRET:minioadmin}
    s3-region: ${EGRESS_S3_REGION:us-east-1}
    force-path-style: ${EGRESS_FORCE_PATH_STYLE:true}          # MinIO는 path-style 필요
    # 세그먼트 길이는 라이브 지연을 직접 좌우한다. 플레이어가 라이브 엣지에서 N개 뒤부터 재생하므로
    # (hls.js liveSyncDurationCount) 서버·클라이언트 양쪽 지연이 이 값에 비례한다.
    #
    # 1초까지 낮춰 총 지연을 ~10초에서 절반 이하로 줄였으나 실사용에서 버퍼링이 잦아 2초로 되돌린다.
    # 세그먼트가 짧으면 버퍼가 그만큼 얇아져(엣지 뒤 2개 = 2초) 네트워크가 조금만 흔들려도 바닥난다.
    # 화면공유는 비트레이트가 크게 튀는 구간이 있어 특히 취약했다. 지연보다 끊김 없는 재생이 우선이다.
    segment-duration-seconds: ${EGRESS_SEGMENT_DURATION:2}
    # 합성 출력 인코딩. 프리셋(H264_1080P_30 등)은 30fps 고정이라 값으로 직접 넘긴다.
    # 안 주면 Egress 기본 720p라 1080p 송출이 다운스케일된다.
    encoding-width: ${EGRESS_ENCODING_WIDTH:1920}
    encoding-height: ${EGRESS_ENCODING_HEIGHT:1080}
    # 강의 화면(슬라이드·코드·말하는 사람)에 30fps는 낭비다. 15로 낮추면 Egress 인코딩 부하가 절반이
    # 되고, 같은 비트레이트가 프레임당 두 배로 쓰여 정지 화면의 글자가 오히려 또렷해진다.
    # 움직임이 많은 콘텐츠로 성격이 바뀌면 30으로 올린다.
    framerate: ${EGRESS_FRAMERATE:15}
    # H264_1080P_30 프리셋과 같은 값 — 프레임률만 바뀌었을 때의 효과를 분리해 보기 위함이다.
    video-bitrate-kbps: ${EGRESS_VIDEO_BITRATE_KBPS:4500}
    audio-bitrate-kbps: ${EGRESS_AUDIO_BITRATE_KBPS:128}
    audio-frequency: ${EGRESS_AUDIO_FREQUENCY:44100}
    # 합성 화면을 그릴 페이지의 오리진. Egress의 헤드리스 Chrome이 여는 주소라 브라우저 주소와
    # 다를 수 있다. 경로(/egress/stage)는 코드가 붙이므로 오리진만 넣는다.
    # 비우면 LiveKit 기본 템플릿 — 화면공유가 83%로 축소되고 검은 여백이 남는다(운영 실측).
    template-base-url: ${EGRESS_TEMPLATE_BASE_URL:}
    playlist-name: index.m3u8
    live-playlist-name: live.m3u8
    layout: grid

# 라이브 시작 오케스트레이션(ADR-0002 choinhoo/0002).
live:
  stt:
    # true면 captionEnabled 세션에서도 AgentDispatch만 만들고 Gate S1(job 배정)·S2(STT_READY)·S3②를 건너뛴다.
    # 임시 우회 플래그다 — 그동안 자막 없이 LIVE가 될 수 있다(ADR §5-1). AI 담당자의 readiness API·callback
    # 배포 뒤 false로 전환한다. 강사 publisher 재검증(Gate S3①)은 이 값과 무관하게 항상 수행한다.
    assume-ready: ${LIVE_STT_ASSUME_READY:true}
  start:
    # Egress Gate B~C(EGRESS_ACTIVE + manifest·첫 세그먼트) bounded polling. 과거 Chrome page load가
    # 20초까지 걸린 인프라 기록을 고려한 시작값이며 운영 지표로 조정한다(ADR §4).
    egress-readiness-timeout: ${LIVE_START_EGRESS_TIMEOUT:45s}
    egress-poll-interval: ${LIVE_START_EGRESS_POLL_INTERVAL:1s}
    # 즉시 trigger가 죽으면 reconciler가 lease 만료 뒤 같은 attempt를 다시 집는다. 정상 45초 polling
    # 도중에는 다른 인스턴스가 중복 실행하지 않도록 timeout보다 길게 둔다.
    execution-lease: ${LIVE_START_EXECUTION_LEASE:90s}
    reconcile-fixed-delay: ${LIVE_START_RECONCILE_DELAY:10s}
    reconcile-initial-delay: ${LIVE_START_RECONCILE_INITIAL_DELAY:20s}

video:
  playback:
    # manifest 내부 세그먼트 presigned GET 유효기간. 델타 재생목록은 옛 세그먼트 URL을 다시 주지 않으므로
    # 이 값이 강의 길이보다 짧으면 오래 시청한 학생이 앞으로 되감을 때 403을 맞는다.
    segment-url-ttl: ${VIDEO_PLAYBACK_SEGMENT_URL_TTL:6h}
    # 델타 재생목록 경계(#EXT-X-SERVER-CONTROL:CAN-SKIP-UNTIL). 타깃 듀레이션의 6배 이상이어야 한다
    # (세그먼트 2초 → 최소 12초). 이보다 오래된 세그먼트는 #EXT-X-SKIP으로 생략된다.
    can-skip-until: ${VIDEO_PLAYBACK_CAN_SKIP_UNTIL:60s}
    # 세그먼트 presigned URL을 서명할 공개 주소. 브라우저가 여는 주소라 egress s3-endpoint(내부)와 다르다.
    # SigV4가 Host를 서명에 포함하므로 브라우저가 실제로 보낼 Host로 서명해야 한다.
    # 비우면 내부 주소로 서명 — 로컬에서 vite(:8083) 프록시를 쓰면 http://localhost:8083을 넣는다.
    public-endpoint: ${VIDEO_PLAYBACK_PUBLIC_ENDPOINT:}

asset:
  storage:
    # 에셋(썸네일·프로필 이미지) presigned 업로드용 S3 호환 스토리지. 로컬은 MinIO.
    # 비밀키는 커밋하지 않는다 — dev 기본값만 두고 운영은 환경변수로 주입한다.
    endpoint: ${ASSET_STORAGE_ENDPOINT:http://localhost:9000}    # MinIO. 운영 S3 배정 시 교체.
    region: ${ASSET_STORAGE_REGION:us-east-1}
    bucket: ${ASSET_STORAGE_BUCKET:liveclass-assets}
    access-key: ${ASSET_STORAGE_ACCESS_KEY:minioadmin}          # 커밋 금지 값은 env로
    secret-key: ${ASSET_STORAGE_SECRET_KEY:minioadmin}
    path-style: ${ASSET_STORAGE_PATH_STYLE:true}                # MinIO는 path-style 필요
    upload-ttl-seconds: ${ASSET_STORAGE_UPLOAD_TTL:600}         # presigned PUT 유효기간(10분)
    download-ttl-seconds: ${ASSET_STORAGE_DOWNLOAD_TTL:3600}    # presigned GET 유효기간(1시간)
  reaper:
    # 티켓만 받고 완료 통지가 없던 PENDING 에셋 정리(→ FAILED). 행은 지우지 않는다(감사 추적 유지).
    pending-expiry-hours: ${ASSET_REAPER_PENDING_EXPIRY_HOURS:24}   # 이보다 오래된 PENDING을 회수(PUT TTL 10분보다 충분히 뒤)
    fixed-delay: ${ASSET_REAPER_FIXED_DELAY:PT1H}                   # 회수 주기(ISO-8601 Duration)
    initial-delay: ${ASSET_REAPER_INITIAL_DELAY:PT5M}               # 기동 직후 첫 실행까지 지연

liveclass:
  ws:
    # WebSocket 핸드셰이크 오리진 화이트리스트(CSWSH 방어, ADR-0019). 같은 오리진 배포(nginx)라
    # 운영은 도메인 하나면 충분하고, dev는 Vite(localhost:*)만 허용한다. 콤마 없이 리스트로 override 가능.
    allowed-origin-patterns:
      - http://localhost:*
      - https://jiphyeonjeon.thdwjdrl.com
      - https://*.thdwjdrl.com
  # 라이브 자막 Redis Stream consumer(ADR-0043, CONTRACT §3-4). 소비 대상은 spring.data.redis가
  # 가리키는 프로필 구동 Redis다(로컬=localhost, remote=EC2 :4000 application Redis). ai-api가
  # ai-rag-live-v1로 이미 소비하므로 Spring은 반드시 별도 그룹을 쓴다.
  # Spring→ai-api RAG SSE 프록시(ADR-0047, CONTRACT §3-9). 브라우저는 Spring만 호출한다.
  ai:
    # compose 내부망 서비스명. 로컬에 ai-api가 없으면 연결 실패 → 503 AI_ANSWER_UNAVAILABLE(무해).
    api-base-url: ${AI_API_BASE_URL:http://ai-api:8010}
    # HMAC 공유 시크릿. 콜백용 AI_CALLBACK_SECRET과 **다른 값**이다(docs/ai/CONTRACT.md §3.2).
    # 운영은 env 주입(커밋 금지). 값이 틀리면 ai-api가 401 → 502 AI_ANSWER_UPSTREAM_REJECTED.
    internal-secret: ${AI_INTERNAL_SECRET:dev-ai-internal-secret}
    connect-timeout: ${AI_API_CONNECT_TIMEOUT:3s}
    # 스트리밍이라 길게. 브라우저 SSE emitter 타임아웃도 이 값을 그대로 쓴다.
    stream-timeout: ${AI_API_STREAM_TIMEOUT:5m}
  # 판서 해석(ADR-0054, CONTRACT §3-6e). 손그림 → mermaid/LaTeX.
  #
  # ai-api를 거치지 않고 Spring이 GMS를 직접 부른다 — 이 호출에는 검색도 임베딩도 자막 컨텍스트도
  # 없어 파이썬이 할 도메인 일이 없다. RAG 컨텍스트가 필요해지면 그때 옮기며, FE 계약은 그대로다.
  #
  # 키가 없으면 기능이 꺼진 것으로 본다(502 ANNOTATION_INTERPRET_FAILED). 로컬에서 키 없이 띄워도
  # 강의는 그대로 돌아야 하므로 기동을 막지 않는다. 브라우저는 이 키를 절대 받지 않는다.
  annotation-ai:
    base-url: ${ANNOTATION_AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${ANNOTATION_AI_API_KEY:${AI_API_GMS_API_KEY:}}
    model: ${ANNOTATION_AI_MODEL:gpt-4.1}
    connect-timeout: ${ANNOTATION_AI_CONNECT_TIMEOUT:5s}
    # 이미지를 읽는 호출이라 텍스트 질의보다 길다. 강사가 기다리는 화면이라 무한정 둘 수도 없다.
    request-timeout: ${ANNOTATION_AI_REQUEST_TIMEOUT:60s}
    max-image-bytes: ${ANNOTATION_AI_MAX_IMAGE_BYTES:4194304}   # 4MB
  caption:
    enabled: ${CAPTION_CONSUMER_ENABLED:true}
    stream-key: ${CAPTION_STREAM_KEY:ai:captions:live}   # 전역 키(producer env와 정합)
    group: ${CAPTION_CONSUMER_GROUP:spring-caption-live-v1}
    # dev 인프라를 여러 개발자가 공유하면 그룹을 분리한다(같은 그룹이면 서로 메시지를 뺏음).
    group-instance-suffix: ${CAPTION_CONSUMER_GROUP_SUFFIX:}
    consumer: ${CAPTION_CONSUMER_NAME:}                   # 비면 HOSTNAME 기반 안정 이름 파생
    batch-size: ${CAPTION_CONSUMER_BATCH_SIZE:100}
    poll-timeout: ${CAPTION_CONSUMER_POLL_TIMEOUT:1s}

# AI 워커 콜백(ADR-0036) — HMAC 서명 검증 시크릿. 워커와 같은 값을 공유한다. 운영은 env로 주입(커밋 금지).
ai:
  callback-secret: ${AI_CALLBACK_SECRET:dev-ai-callback-secret}

# 자료 임베딩 파이프라인 스위치(ADR-0036). true면 자료 연결/해제 시 outbox 발행 + PENDING 전환.
# 릴레이(RabbitMQ)와 AI 워커가 준비되기 전까지는 false — 연결만 하고 상태 READY(무회귀).
material:
  embedding:
    enabled: ${MATERIAL_EMBEDDING_ENABLED:false}

# outbox → RabbitMQ 릴레이 폴링 주기(ADR-0036). 발행 전용, 빈 결과면 무해.
outbox:
  relay:
    fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:5000}
    initial-delay-ms: ${OUTBOX_RELAY_INITIAL_DELAY_MS:15000}
