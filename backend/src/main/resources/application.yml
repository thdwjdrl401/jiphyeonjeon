spring:
  application:
    name: liveclass
  threads:
    virtual:
      enabled: true                 # Java 21 virtual threads (ADR-0009)
  datasource:
    url: jdbc:postgresql://localhost:5432/liveclass
    username: liveclass
    password: liveclass             # 로컬 dev (docker-compose .env와 일치)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # 스키마는 Flyway가 소유, JPA는 검증만
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas:
      - core                        # core = Spring 단독 쓰기 (ai는 Python/Alembic)
    default-schema: core
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  session:
    timeout: 30m
    data:
      redis:
        namespace: liveclass:session  # 세션 본체 → Redis (앱 무상태). Boot 4.0: spring.session.redis.* → spring.session.data.redis.*

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: LIVECLASS_SESSION
        http-only: true             # ADR-0014: JS가 못 읽음
        same-site: lax
        secure: false               # prod(https)에서 true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0            # 요청마다 traceId 생성(로그·에러 상관관계용). 익스포터는 후속.

logging:
  level:
    com.liveclass: INFO           # 우리 코드 기본. 특정 모듈만 올리려면 아래처럼 개별 지정.
    com.liveclass.auth: INFO      # 예: 인증 디버깅 시 DEBUG
    com.liveclass.curriculum: INFO
    com.liveclass.lesson: INFO
    com.liveclass.common: INFO
