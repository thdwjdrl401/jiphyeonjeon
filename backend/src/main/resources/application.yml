spring:
  application:
    name: liveclass
  threads:
    virtual:
      enabled: true                 # Java 21 virtual threads (ADR-0009)
  datasource:
    url: jdbc:postgresql://localhost:5432/liveclass
    username: liveclass
    password: liveclass             # 로컬 dev (docker-compose .env와 일치)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # 스키마는 Flyway가 소유, JPA는 검증만
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    schemas:
      - core                        # core = Spring 단독 쓰기 (ai는 Python/Alembic)
    default-schema: core
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  session:
    timeout: 30m
    data:
      redis:
        namespace: liveclass:session  # 세션 본체 → Redis (앱 무상태). Boot 4.0: spring.session.redis.* → spring.session.data.redis.*

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: LIVECLASS_SESSION
        http-only: true             # ADR-0014: JS가 못 읽음
        same-site: lax
        secure: false               # prod(https)에서 true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics   # prometheus = 스크레이프 엔드포인트
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}      # 스크레이프된 메트릭에 앱 식별 태그
  tracing:
    sampling:
      probability: 1.0            # 요청마다 traceId 생성(로그·에러 상관관계용). 익스포터는 후속.

logging:
  level:
    com.liveclass: INFO           # 우리 코드 기본. 특정 모듈만 올리려면 아래처럼 개별 지정.
    com.liveclass.auth: INFO      # 예: 인증 디버깅 시 DEBUG
    com.liveclass.curriculum: INFO
    com.liveclass.lesson: INFO
    com.liveclass.common: INFO

livekit:
  url: ${LIVEKIT_URL:wss://jiphyeonjeon.thdwjdrl.com:7443}   # 클라이언트 접속 URL
  api-key: ${LIVEKIT_API_KEY:devkey}                  # dev/test 더미. 운영은 환경변수 주입.
  api-secret: ${LIVEKIT_API_SECRET:devsecretdevsecretdevsecretdevsecret}  # 커밋 금지 값은 env로
  token-ttl-seconds: ${LIVEKIT_TOKEN_TTL:600}         # 10분
  egress:                                             # HLS 녹화 출력(S3/MinIO). infra/livekit/request-hls.json 대응.
    bucket: ${EGRESS_BUCKET:recordings}
    s3-endpoint: ${EGRESS_S3_ENDPOINT:http://localhost:9000}   # MinIO. 운영 S3 배정 시 교체.
    s3-access-key: ${EGRESS_S3_ACCESS_KEY:minioadmin}          # 커밋 금지 값은 env로
    s3-secret: ${EGRESS_S3_SECRET:minioadmin}
    s3-region: ${EGRESS_S3_REGION:us-east-1}
    force-path-style: ${EGRESS_FORCE_PATH_STYLE:true}          # MinIO는 path-style 필요
    segment-duration-seconds: ${EGRESS_SEGMENT_DURATION:2}
    playlist-name: index.m3u8
    live-playlist-name: live.m3u8
    layout: grid

liveclass:
  ws:
    # WebSocket 핸드셰이크 오리진 화이트리스트(CSWSH 방어, ADR-0019). 같은 오리진 배포(nginx)라
    # 운영은 도메인 하나면 충분하고, dev는 Vite(localhost:*)만 허용한다. 콤마 없이 리스트로 override 가능.
    allowed-origin-patterns:
      - http://localhost:*
      - https://jiphyeonjeon.thdwjdrl.com
      - https://*.thdwjdrl.com
