# ─────────────────────────────────────────────────────────────────────────────
# remote 프로필 — 로컬에서 띄운 백엔드를 "전부 EC2 인프라"에 직접 붙인다.
#   목적: AI(realtime-agent)가 EC2 Redis Streams에 흘리는 라이브 STT(caption.*)를
#         내 로컬 백엔드에서 실제로 소비/개발하기 위함 (CONTRACT §3-3, ADR-0008/0013).
#   기본(no-profile) = 전부 로컬(application.yml의 localhost). LiveKit은 양쪽 모두 EC2
#   (application.yml 기본값 유지 — 로컬 미디어 스택은 제한적이므로 무조건 원격, ADR-0022).
#
#   활성화:  SPRING_PROFILES_ACTIVE=remote   (+ 아래 시크릿 env, .env.remote 참고)
#   전제:    EC2에서 docker-compose.expose.yml로 5432/6379 포트를 공개하고
#            SG/ufw 인바운드를 팀 공인 IP로 제한 (ADR-0022). Redis는 requirepass 필수.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://${EC2_INFRA_HOST:jiphyeonjeon.thdwjdrl.com}:${EC2_PG_PORT:5432}/${POSTGRES_DB:liveclass}
    username: ${POSTGRES_USER:liveclass}
    password: ${POSTGRES_PASSWORD:?remote 프로필은 EC2 PG 비밀번호(POSTGRES_PASSWORD)가 필요합니다}
  data:
    redis:
      host: ${EC2_INFRA_HOST:jiphyeonjeon.thdwjdrl.com}
      port: ${EC2_REDIS_PORT:6379}
      password: ${EC2_REDIS_PASSWORD:?remote 프로필은 EC2 Redis 비밀번호(EC2_REDIS_PASSWORD)가 필요합니다}
  # 공유 EC2 스키마는 배포 파이프라인이 소유한다 — 개발자 노트북이 마이그레이션하지 않는다.
  # (스키마가 뒤처져 validate가 실패하면 EC2 재배포 필요 신호로 읽는다.)
  flyway:
    enabled: false

# ⚠️ Redis Streams 소비자(향후 CP2)는 consumer group을 개발자별로 분리해야 한다.
#    EC2 백엔드와 같은 그룹으로 붙으면 서로 메시지를 뺏어간다(그룹 내 분배).
#    소비 코드 작성 시 group 이름에 인스턴스 식별자를 넣을 것 — ADR-0022 "유보".
