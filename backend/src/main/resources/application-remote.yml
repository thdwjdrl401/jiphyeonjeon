# remote 프로필 — 로컬 backend를 EC2 dev 인프라(docker-compose.dev-infra.yml)에 붙인다. prod 아님.
#   목적: EC2 공유 dev 인프라(PG·Redis·RabbitMQ)에 로컬 개발 중 붙어 테스트.
#         AI STT(Redis Streams)·배치잡(RabbitMQ)을 EC2 dev에서 소비/개발.
#   활성화: SPRING_PROFILES_ACTIVE=remote  (+ 아래 시크릿 env, .env.remote 참고)
#   전제: EC2 dev 스택이 5433(PG)/4000(Redis)/4001(RabbitMQ)에서 가동, SG/ufw 팀 IP 허용, Redis requirepass.
#   LiveKit은 양쪽 모두 EC2(application.yml 기본값).
spring:
  datasource:
    url: jdbc:postgresql://${EC2_INFRA_HOST:jiphyeonjeon.thdwjdrl.com}:${EC2_PG_PORT:5433}/${POSTGRES_DB:liveclass}
    username: ${POSTGRES_USER:liveclass}
    password: ${POSTGRES_PASSWORD:?remote 프로필은 EC2 dev PG 비밀번호(POSTGRES_PASSWORD) 필요}
  data:
    redis:
      host: ${EC2_INFRA_HOST:jiphyeonjeon.thdwjdrl.com}
      port: ${EC2_REDIS_PORT:4000}
      password: ${EC2_REDIS_PASSWORD:?remote 프로필은 EC2 dev Redis 비밀번호(EC2_REDIS_PASSWORD) 필요}
  rabbitmq:
    # AI 배치잡(임베딩 파이프라인 ADR-0036) 큐도 EC2 dev RabbitMQ로. dev-infra가 4001:5672로 노출.
    host: ${EC2_INFRA_HOST:jiphyeonjeon.thdwjdrl.com}
    port: ${EC2_RABBITMQ_PORT:4001}
    username: ${RABBITMQ_USER:liveclass}
    password: ${RABBITMQ_PASSWORD:?remote 프로필은 EC2 dev RabbitMQ 비밀번호(RABBITMQ_PASSWORD) 필요}
  # dev 전용 인프라라 flyway 켜서 스키마 생성(prod과 달리 안전) = application.yml 기본값 유지.

# ⚠️ Redis Streams 자막 소비자(ADR-0043): dev 인프라를 여러 개발자가 공유하면 consumer group을
#    개발자별로 분리할 것(같은 그룹이면 서로 메시지를 뺏음). CAPTION_CONSUMER_GROUP_SUFFIX(.env.remote)로
#    그룹에 인스턴스 식별자를 붙인다. remote 프로필의 :4000 application Redis가 GPU realtime-agent가
#    실제로 캡션을 XADD하는 곳이라, 여기 붙으면 실제 캡션 스트림을 개발/검증할 수 있다.
liveclass:
  caption:
    group-instance-suffix: ${CAPTION_CONSUMER_GROUP_SUFFIX:dev}

# 에셋 스토리지(썸네일·프로필 presigned) → EC2 dev MinIO. IP+http로 브라우저 HSTS 우회.
# secret은 .env.remote로 주입(EC2 /etc/liveclass/.env.dev 의 MINIO_ROOT_PASSWORD 와 일치).
asset:
  storage:
    endpoint: ${ASSET_STORAGE_ENDPOINT:http://43.201.249.3:9090}
    access-key: ${ASSET_STORAGE_ACCESS_KEY:liveclass}
    secret-key: ${ASSET_STORAGE_SECRET_KEY:?remote 프로필은 EC2 dev MinIO secret(ASSET_STORAGE_SECRET_KEY) 필요}
    # bucket(liveclass-assets)·path-style(true)·region 등은 application.yml 기본값 유지

# 녹화·재생 → EC2 dev MinIO의 recordings 버킷. LiveKit·Egress는 양쪽 모두 EC2 것을 쓰므로
# (application.yml 기본값) 로컬 backend가 시작한 녹화도 EC2 Egress가 처리한다.
# 같은 버킷을 세 주체가 서로 다른 네트워크 위치에서 보므로 주소가 셋으로 갈린다:
#
#   s3-endpoint      로컬 backend가 매니페스트 GET      → EC2 dev MinIO 공개 포트
#   upload-endpoint  EC2의 Egress가 세그먼트 PUT        → EC2 호스트 기준 루프백(9090 = dev MinIO 게시 포트)
#   public-endpoint  브라우저가 presigned 세그먼트 GET  → EC2 dev MinIO 공개 포트
#
# 도메인 대신 IP를 쓰는 이유는 asset.storage와 같다 — 도메인에 HSTS가 걸려 http가 https로 승격된다.
# MinIO 기본 CORS가 모든 origin을 허용해 localhost:8083에서 세그먼트를 바로 받을 수 있다(실측 확인).
livekit:
  # remote 프로필은 EC2 dev Redis를 소비하는 dev realtime-agent worker pool을 지목한다.
  agent-name: ${LIVEKIT_AGENT_NAME:liveclass-realtime-stt-dev}
  egress:
    s3-endpoint: ${EGRESS_S3_ENDPOINT:http://43.201.249.3:9090}
    upload-endpoint: ${EGRESS_UPLOAD_ENDPOINT:http://127.0.0.1:9090}
    s3-access-key: ${EGRESS_S3_ACCESS_KEY:liveclass}
    s3-secret: ${EGRESS_S3_SECRET:?remote 프로필은 EC2 dev MinIO secret(EGRESS_S3_SECRET) 필요}

video:
  playback:
    public-endpoint: ${VIDEO_PLAYBACK_PUBLIC_ENDPOINT:http://43.201.249.3:9090}
