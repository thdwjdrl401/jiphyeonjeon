# lazy 배포 오버라이드 — 호스트 nginx가 단일 엔트리다.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.lazy.yml --env-file ~/secrets/.env.prod up -d
#
# prod compose와 달라지는 점은 둘뿐이다:
#   1) frontend가 80·443을 잡지 않고 루프백 8100만 연다 — 그 포트는 호스트 nginx가 이미 쓴다.
#   2) certbot을 띄우지 않는다 — 인증서는 호스트 certbot이 발급·갱신하고, TLS도 호스트가 종단한다.
#
# 나머지(backend·postgres·redis·minio·rabbitmq·media-worker)는 prod 정의를 그대로 쓴다.
services:
  frontend:
    ports: !override
      # 루프백에만 연다. 외부에서 오는 건 전부 호스트 nginx를 지난다.
      - "127.0.0.1:8100:80"
    volumes: !override
      - ./infra/nginx/frontend-behind-host-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    # 인증서 갱신 reload가 필요 없다 — 호스트 nginx가 자기 것을 reload한다.
    command: !reset null

  certbot:
    # 호스트 certbot이 이미 이 도메인들을 관리한다. 두 개가 같은 웹루트를 두고 다투면
    # 갱신이 조용히 실패한다.
    profiles: ["disabled"]

  backend:
    environment:
      # 유령 Egress 회수 중계는 호스트 네트워크로 떠 있어 브리지 게이트웨이로 불러야 한다.
      # 게이트웨이 주소는 호스트마다 다르다 — EC2에서는 172.18.0.1이었지만 이 호스트는
      # 172.24.0.1이다. 하드코딩하지 않고, backend가 이미 host-gateway로 매핑해 둔 공개
      # 도메인 이름을 재사용한다(prod의 extra_hosts).
      EGRESS_PURGER_BASE_URL: http://jiphyeonjeon.thdwjdrl.com:9107

  minio:
    volumes: !override
      # 이관해 온 데이터 디렉토리를 그대로 물린다. named 볼륨으로 복사하면 같은 25GB를 디스크에
      # 두 벌 두게 되고, 이 호스트의 느린 디스크에서 그 복사가 한 시간 가까이 IO를 잡아먹으며
      # 다른 컨테이너(특히 postgres의 fsync)를 굶긴다. 실제로 복원 중 postgres가 그렇게 죽었다.
      - ${LIVECLASS_MINIO_DATA:?LIVECLASS_MINIO_DATA 필요 — MinIO 데이터 디렉토리 경로}:/data

  minio-init:
    # 버킷은 이관된 데이터에 이미 있다. 그래도 멱등이라 그대로 둔다.
    restart: unless-stopped
