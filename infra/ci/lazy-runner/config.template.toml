# 테스트 전용 러너 설정 템플릿. 실제 config.toml은 서버에서 토큰을 채워 만든다(커밋 금지).
#
# 동시 실행 3 — 이제 test-* 일곱 개가 전부 이 러너로 온다(EC2가 t2.xlarge라 지속 CPU가
# 0.9 vCPU뿐이어서 테스트를 다 옮겼다. 근거는 .gitlab-ci.yml 머리말).
#
# **한계는 코어가 아니라 메모리다.** 이 서버는 8코어지만 RAM이 7.6GB뿐이고, 여기엔 라이브 강의
# 녹화를 받는 Egress(녹화 1건당 약 2GB)도 얹혀 있다. 동시 3건의 대략치:
#   백엔드 테스트 2.5GB(JVM 1.5g + Postgres + Redis) + 프론트 4포크 2GB + AI 테스트 1GB ≈ 5.5GB
# 여기에 녹화 2GB가 겹치면 7.5GB로 거의 꽉 찬다(스왑 16GB가 받쳐 주지만 느려진다).
# 4로 올리려면 그 전에 잡별 메모리 상한을 걸어야 한다 — 지금은 3이 상한이다.
concurrent = 3
check_interval = 0

[[runners]]
  name = "lazy-tests"
  url = "https://github.com"
  token = "<RUNNER_TOKEN>"
  executor = "shell"
  shell = "bash"
  # **호스트와 같은 경로여야 한다.** 잡이 -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"로 워크스페이스를
  # 형제 컨테이너에 넘기는데 그 경로는 호스트 도커 데몬이 해석한다. 컨테이너 안 경로와 호스트
  # 경로가 다르면 빈 디렉토리가 마운트되어 "소스가 없다"로 죽는다(DooD의 고전적 함정).
  builds_dir = "/home/lazy/ci-builds"
  cache_dir = "/home/lazy/ci-builds/cache"
