# 테스트 전용 러너 설정 템플릿. 실제 config.toml은 서버에서 토큰을 채워 만든다(커밋 금지).
#
# 동시 실행 2 — 한때 3이었다가 되돌렸다.
#
# 3으로 올렸더니 2026-08-06 한 시간 동안 서로 다른 실패가 세 종류 나왔다. 전부 경합이 원인이다.
#   test-frontend  파일 하나 37초 · 테스트 하나 23.6초 → asyncUtilTimeout 초과
#   test-ai-api    게시 포트가 사라져 ConnectionRefused (준비 확인은 통과한 뒤였다)
#   test-ai-worker 97초짜리가 9분 · test-realtime-agent 108초짜리가 11분
# 잡 2개만 돌아도 부하가 13.7(8코어)까지 갔다 — 이 박스에서 3은 과했다.
#
# **한계는 코어가 아니라 이 잡들의 성격이다.** 백엔드는 Testcontainers로 PG·Redis까지 띄우고,
# AI 잡들은 uv sync로 컴파일을 돌리며, 프론트는 포크마다 jsdom을 세운다. 여기에 라이브 강의
# 녹화를 받는 Egress(1건당 약 2GB)까지 같은 호스트에 있다.
#
# 3으로 되돌리려면 잡별 CPU·메모리 상한을 먼저 걸어야 한다. 상한 없이 슬롯만 늘리면
# "느려서 깨진 것"과 "진짜 실패"를 구분할 수 없게 된다 — 그게 가장 비싼 대가다.
concurrent = 2
check_interval = 0

[[runners]]
  name = "lazy-tests"
  url = "https://github.com"
  token = "<RUNNER_TOKEN>"
  executor = "shell"
  shell = "bash"
  # **호스트와 같은 경로여야 한다.** 잡이 -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"로 워크스페이스를
  # 형제 컨테이너에 넘기는데 그 경로는 호스트 도커 데몬이 해석한다. 컨테이너 안 경로와 호스트
  # 경로가 다르면 빈 디렉토리가 마운트되어 "소스가 없다"로 죽는다(DooD의 고전적 함정).
  builds_dir = "/home/lazy/ci-builds"
  cache_dir = "/home/lazy/ci-builds/cache"
