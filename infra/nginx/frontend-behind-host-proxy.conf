# 호스트 nginx 뒤에서 도는 프론트엔드 서버 블록.
#
# 배포 호스트의 80·443은 호스트 nginx가 이미 다른 서비스와 함께 쓰고 있어서, 컨테이너가 그 포트를
# 잡을 수 없다. TLS 종단과 인증서 갱신을 호스트가 맡고, 이 컨테이너는 평문 HTTP만 서빙한다.
#
# 컨테이너 nginx를 없애지 않는 이유: /api/·/livekit/·/liveclass-assets/·/recordings/ 라우팅이
# 도커 네트워크 안의 이름(backend, minio)으로 가야 하기 때문이다. 그건 호스트에서 할 수 없다.
#
# 호스트 쪽에서 반드시 `proxy_set_header Host $host`를 넘겨야 한다 — MinIO presigned URL이
# 공개 도메인 Host로 SigV4 서명돼 있어서, Host가 바뀌면 서명 검증이 깨진다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 도커 내장 DNS. app-locations가 upstream을 변수로 참조해 기동 시점 해석을 피한다.
    resolver 127.0.0.11 valid=30s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app-locations.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
