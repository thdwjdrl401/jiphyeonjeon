# 집현전 — 호스트 nginx 엔트리 (ADR-0126)
#
# 이 호스트의 nginx가 80·443을 혼자 쥐고 TLS를 종단한다. 앱 프론트엔드 컨테이너는 루프백 8100에
# 평문으로 떠 있고, 도커 네트워크 안쪽(backend·minio) 라우팅은 그 컨테이너가 맡는다.
#
# ⚠️ `proxy_set_header Host $host`는 선택이 아니다. MinIO presigned URL이 이 도메인 Host로
#    SigV4 서명돼 있어서, Host가 바뀌면 서명 검증이 깨지고 업로드·재생이 죽는다.

# 이 호스트의 다른 사이트들은 Connection을 하드코딩해 쓰고 있어 이 map이 없다.
# 여기서 정의한다 — 다른 곳에 같은 이름이 생기면 nginx가 중복으로 기동을 거부하니 주의.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream jiphyeonjeon_app {
    server 127.0.0.1:8100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name jiphyeonjeon.thdwjdrl.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 강의 자료(PPTX)·이미지 업로드가 이 경로를 지난다. 컨테이너 쪽 상한이 60m이라 맞춘다.
    client_max_body_size 60m;

    location / {
        proxy_pass http://jiphyeonjeon_app;
        proxy_http_version 1.1;

        # SigV4 서명이 이 헤더에 걸려 있다. 바꾸지 말 것.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket(STOMP 알림·LiveKit 시그널링)과 SSE(AI 답변 스트리밍)가 같은 경로로 온다.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE는 버퍼링하면 토큰이 몰아서 나온다. 컨테이너 쪽에서도 끄지만 여기서도 꺼야 한다.
        proxy_buffering off;
        proxy_cache     off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# LiveKit 시그널링(WSS). 미디어는 여기를 타지 않는다 — UDP 3478과 TCP 7881을 livekit이 호스트에
# 직접 바인딩한다. 이 블록은 원래 미디어 스택의 nginx 컨테이너가 하던 일인데, 이 호스트에서는
# TLS 종단자를 하나로 모은다(ADR-0126).
server {
    # 이 호스트의 nginx는 1.18이다. `http2 on;`은 1.25.1부터라 listen에 붙이는 옛 문법을 쓴다.
    listen 7443 ssl http2;
    listen [::]:7443 ssl http2;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass         http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
