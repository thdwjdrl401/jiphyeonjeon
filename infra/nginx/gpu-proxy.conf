# GPU 서버 리버스터널(sshd -R, 호스트 127.0.0.1:18081/18082/18020) → 내부 서비스 프록시.
# GPU 서버는 인바운드 전면차단·아웃바운드만 가능 → 서버가 EC2로 ssh -R 터널을 뚫고,
# 이 nginx가 그 호스트 루프백 포트로 프록시한다. host 네트워크여야 127.0.0.1 터널에 닿는다.
# 콜러: Spring(liveclass_default 172.18.x)·ai-worker·localhost. /internal/* 만 허용, 그 외 404.
# 외부 노출 금지: SG 미개방 + ufw 18080은 내부용 + location deny all.
server {
    listen 18080;
    server_name _;

    location / { return 404; }

    # prod Spring Docker → GPU prod realtime-agent health
    location ^~ /internal/realtime-agent/ {
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        allow 172.20.0.0/16;   # dev AI 스택(liveclass-dev_default) — dev ai-worker/ai-api도 BGE/health 프록시 사용
        deny all;

        proxy_pass http://127.0.0.1:18081/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # dev Spring/AI Docker → GPU dev realtime-agent health
    location ^~ /internal/realtime-agent-dev/ {
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        allow 172.20.0.0/16;
        deny all;

        proxy_pass http://127.0.0.1:18082/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ai-worker Docker → GPU BGE runtime
    location ^~ /internal/bge/ {
        allow 127.0.0.1;
        allow 172.18.0.0/16;
        allow 172.20.0.0/16;   # dev AI 스택(liveclass-dev_default) — dev ai-worker/ai-api도 BGE/health 프록시 사용
        deny all;

        proxy_pass http://127.0.0.1:18020/;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
