# dev RabbitMQ 관리 UI TLS 종단 — https://jiphyeonjeon.thdwjdrl.com:8990 → rabbitmq:15672(평문).
# 인증서는 앱 스택 certbot이 발급/갱신하는 공유 볼륨(liveclass_certbot_etc). 앱 443·livekit 7443과 동일 패턴.
server {
    listen 8990 ssl;
    listen [::]:8990 ssl;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;

    location / {
        proxy_pass http://rabbitmq:15672;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
