# 미디어 스택 전용 nginx — LiveKit 시그널링(WSS) TLS 종단.
# 앱 nginx(443)와 도메인이 같으므로 별도 포트 7443 사용(단일 도메인·DNS 콘솔 권한 없음 제약).
# 인증서는 앱 스택 certbot이 발급한 공유 볼륨(liveclass_certbot_etc)을 읽기전용 사용.
# 미디어(WebRTC UDP 7882)는 nginx를 거치지 않고 LiveKit로 직결.
#
# 이 파일을 컨테이너의 /etc/nginx/conf.d/default.conf 로 덮어써서 stock :80 서버를 대체한다.

server {
    listen 7443 ssl;
    listen [::]:7443 ssl;
    http2 on;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # LiveKit 평문 7880으로 프록시 (host 네트워크라 127.0.0.1)
    location / {
        proxy_pass         http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 시그널링 = 장수명 WebSocket (트래픽 전부 WS)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
