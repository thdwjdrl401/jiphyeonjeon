# LiveKit 스택 lazy 오버라이드 — 시그널링 TLS도 호스트 nginx가 종단한다 (ADR-0126).
#
#   docker compose -f docker-compose.yml -f docker-compose.lazy.yml \
#     --env-file $LIVECLASS_SECRETS_DIR/livekit/purger.env up -d
#
# 앱 스택의 certbot을 이 호스트에서는 띄우지 않으므로 `liveclass_certbot_etc` 볼륨에 인증서가
# 없다. 컨테이너 nginx가 그걸 읽으려다 빈 디렉토리를 만나 7443이 죽는 대신, 호스트 nginx가
# 7443을 함께 종단하고 127.0.0.1:7880으로 넘긴다 — 이 호스트의 TLS 종단자는 하나다.
#
# 미디어는 이 경로를 타지 않는다. UDP 3478과 TCP 7881은 livekit이 호스트에 직접 바인딩한다.
services:
  nginx-livekit:
    # 호스트 nginx가 대신한다. 같은 7443을 두 프로세스가 잡을 수 없다.
    profiles: ["disabled"]
