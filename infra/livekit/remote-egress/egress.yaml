# 원격 Egress 워커 설정 (co-located용 ../egress.yaml과 짝)
# ⚠️ 템플릿: secret은 서버에서 채우고 커밋 금지.
# debug로 둔다. info면 크롬 기동 실패 시 "page load error"라는 결론만 남고 그 앞의 크롬
# 콘솔·CDP 로그가 통째로 사라져 원인을 못 좁힌다(실제로 한 번 겪었다). co-located 쪽도 debug다.
log_level: debug
api_key: <API_KEY>
api_secret: <API_SECRET>           # EC2 livekit.yaml keys의 secret과 동일해야 한다

# co-located 워커는 ws://localhost:7880으로 직결하지만(README 트러블슈팅 #5), 이 워커는
# 다른 호스트에 있으므로 공개 시그널링 엔드포인트로 붙는다. 인증서가 유효하니 insecure는 뺀다.
ws_url: wss://jiphyeonjeon.thdwjdrl.com:7443

redis:
  # EC2의 127.0.0.1:6379를 SSH 터널이 여기로 당겨준다(docker-compose.yml ec2-tunnel).
  # 6379가 아닌 이유: 이 호스트에서 다른 프로젝트의 Redis가 6379를 이미 쓰고 있다.
  address: 127.0.0.1:16379
