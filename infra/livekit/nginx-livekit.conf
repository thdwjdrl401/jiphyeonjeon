# 앞단 nginx에 추가할 LiveKit 시그널링 프록시 (참고 복사본).
# 시그널링(WSS)만 nginx 경유 → TLS 종료 후 livekit 7880. 미디어(UDP)는 nginx 우회 직결.
#
# ① upstreams 블록에:
#      upstream livekit_proxy { server <HOST_LAN_IP>:7880; }
# ② 80→443 리다이렉트 server_name 목록에 <LIVEKIT_DOMAIN> 추가
# ③ 아래 443 블록 추가 → sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <LIVEKIT_DOMAIN>;

    # ⚠️ 인증서가 <LIVEKIT_DOMAIN> 을 커버해야 함 (와일드카드 or 발급) — 트러블슈팅 #1
    # ssl_certificate     /etc/letsencrypt/live/.../fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/.../privkey.pem;

    location / {
        proxy_pass http://livekit_proxy;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket — LiveKit 시그널링은 장수명 WS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ⚠️ 미디어(UDP)는 nginx 통과 안 함. 라우터/보안그룹에서 <HOST> 로 직접 개방:
#    7882/udp (필수) + 7881/tcp (권장). 443은 nginx가 받음.
