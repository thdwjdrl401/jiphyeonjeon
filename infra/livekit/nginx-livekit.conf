# 서버 nginx에 추가할 LiveKit 시그널링 프록시 (참고 복사본).
# 실제 적용은 서버의 시스템 nginx 설정에 반영 → sudo nginx -t && sudo systemctl reload nginx
#
# ① upstreams 블록에:
#      upstream livekit_proxy { server 192.168.219.124:7880; }
# ② 80→443 리다이렉트 server_name 목록에 livekit.thdwjdrl.com 추가
# ③ 아래 443 블록 추가:

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name livekit.thdwjdrl.com;

    # 다른 443 블록과 동일한 인증서 지시자 (livekit.thdwjdrl.com 커버 — 와일드카드면 그대로)
    # ssl_certificate     /etc/letsencrypt/live/.../fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/.../privkey.pem;

    location / {
        proxy_pass http://livekit_proxy;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket — LiveKit 시그널링은 장수명 WS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ⚠️ 미디어(UDP)는 nginx를 통과하지 않는다.
#    라우터에서 192.168.219.124 로 직접 포워딩: 7882/udp (필수) + 7881/tcp (권장)
