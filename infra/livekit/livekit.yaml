# LiveKit self-host config — nginx가 앞단에서 TLS 종료 (Caddy 미사용)
# ⚠️ 템플릿. 실제 secret은 서버에서 채우고 커밋하지 말 것.
port: 7880                     # 시그널링(평문) — nginx가 wss 종료 후 프록시
keys:
  # 형식) <key>: <secret>   secret 생성: openssl rand -base64 32
  APIdev: REPLACE_WITH_STRONG_SECRET
rtc:
  udp_port: 7882               # 단일 UDP mux (라우터 포워딩 1개면 됨)
  tcp_port: 7881               # UDP 막힌 클라용 ICE/TCP fallback
  use_external_ip: true        # 공인 IP를 ICE 후보로 광고 (STUN 자동감지)
logging:
  level: info
# turn: PoC에선 생략 — 대부분 직접 UDP로 붙음. 필요 시 나중에 내장 TURN 활성화.
