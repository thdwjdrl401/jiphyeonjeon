# 미디어 서버 (LiveKit SFU + Egress 녹화 + Redis)
# 값은 아래 <...> 자리 채우기. 자세한 건 README.md.
# 기동(수동): docker compose up -d   # 시크릿/미디어는 호스트(/etc/liveclass/livekit, /srv/liveclass/stt-audio)에서 마운트
#
# 스토리지는 여기 없다. 녹화 업로드 대상은 앱 스택의 MinIO(docker-compose.prod.yml)이고,
# 백엔드가 StartEgress 요청에 실어 보낸다(LiveKitEgressControl). 이 스택에 MinIO를 두면
# Egress가 어느 쪽에 쓰는지 모호해지고 호스트 9000 포트만 잡아먹는다.
name: livekit          # 프로젝트명 고정 = 볼륨(livekit_*)·컨테이너 접두사. 디렉토리명과 무관.
services:
  livekit:
    image: livekit/livekit-server:v1.13.3   # advertise_internal_ip 지원(≥v1.13.0) — 구버전이면 무시됨
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host                        # RTC 포트 직접 바인딩
    volumes:
      - ${LIVECLASS_SECRETS_DIR:-/etc/liveclass}/livekit/livekit.yaml:/etc/livekit.yaml:ro   # 실 시크릿(호스트). git엔 템플릿만.
    depends_on: [redis]

  redis:                                      # LiveKit ↔ Egress 통신 전용 (앱 Redis와 별개)
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes"]

  egress:
    image: livekit/egress:v1.13.0
    restart: unless-stopped
    network_mode: host
    cap_add: [SYS_ADMIN]                      # Chromium 샌드박스 (필수)
    security_opt: ["seccomp=unconfined"]      # ★ Chrome 런치 차단 회피 (아래 트러블슈팅 #3)
    shm_size: "1g"                            # Chrome /dev/shm
    environment: ["EGRESS_CONFIG_FILE=/out/egress.yaml"]
    volumes:
      - ${LIVECLASS_SECRETS_DIR:-/etc/liveclass}/livekit/egress.yaml:/out/egress.yaml:ro     # 실 시크릿(호스트)
    depends_on: [redis, livekit]

  nginx-livekit:                              # 시그널링(WSS) TLS 종단 → livekit 7880. 미디어(UDP)는 우회.
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host                        # 7443 바인딩 + 127.0.0.1:7880 직결
    depends_on: [livekit]
    volumes:
      - ./nginx-livekit-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro       # 앱 스택 certbot이 발급/갱신하는 공유 인증서
    # 6h마다 reload → 갱신된 인증서 반영
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  av-bot:                                     # STT 테스트용 지속 퍼블리셔 — 영상+음성을 room stt-test에 상시 흘려보냄
    build: ./stt-bot                          #   STT 서버는 이 방 av-bot 참가자의 audio 트랙만 구독
    # 상시 기동하지 않는다 — 테스트 도구가 계속 돌면 방·CPU·대역폭을 계속 먹고,
    # 운영 스택에 뭐가 필수인지 흐려진다. 필요할 때만:
    #   docker compose --profile stt-test up -d av-bot
    profiles: [stt-test]
    restart: unless-stopped
    network_mode: host                        # livekit 127.0.0.1:7880 직결
    depends_on: [livekit]
    env_file: ${LIVECLASS_SECRETS_DIR:-/etc/liveclass}/livekit/CREDENTIALS.txt   # 서버 로컬 시크릿(커밋 안 됨)
    environment:
      LIVEKIT_URL: ws://localhost:7880
      STT_ROOM: stt-test
      STT_IDENTITY: av-bot
      # 재생목록: "영상|음성|길이초" 클립을 공백으로 나열, 순서대로 번갈아 재생 후 반복.
      # 현재: imf만(완전 대체). 번갈아 하려면 아래 주석처럼 springBoot 클립을 뒤에 붙인다.
      STT_PLAYLIST: "/audio/imf-video.h264|/audio/imf-audio.ogg|68"
      # STT_PLAYLIST: "/audio/imf-video.h264|/audio/imf-audio.ogg|68 /audio/loop-video.h264|/audio/loop-audio.ogg|2665"
    volumes:
      - /srv/liveclass/stt-audio:/audio:ro    # 테스트 미디어(호스트, 195MB — git 밖)

  # 유령 Egress 회수 중계 — 운영 콘솔의 "유령 제거" 버튼이 여기로 온다.
  #
  # 왜 별도 서비스인가: LiveKit Redis는 `--bind 127.0.0.1` + host 네트워크라 EC2 로컬에서만 닿는데,
  # 백엔드는 브리지(liveclass_default)에 있어 경로가 없다. 브리지에 Redis를 열면 인증 없는 제어
  # 평면이 같은 네트워크의 모든 컨테이너에 열린다 — 남이 egress 작업을 넣을 수도 있는 자리다.
  # 그래서 Redis는 비공개로 두고 "유령 하나 제거"라는 동사 하나만 인증해 내보낸다.
  #
  # 이 서비스를 추가해도 위의 livekit·egress·redis는 재기동되지 않는다(compose가 바뀐 것만 올린다).
  # 그래서 진행 중 라이브를 끊지 않고 배포할 수 있다.
  #
  # 접근 경로: 백엔드(172.18.0.0/16) → 호스트 :9107. ufw가 브리지→호스트를 막으므로 규칙이 하나 필요하다.
  #   sudo ufw allow from 172.18.0.0/16 to any port 9107 proto tcp comment 'egress-purger'
  # 외부에는 열지 않는다(EC2 보안그룹에도 없다).
  egress-purger:
    build: ./egress-purger
    restart: unless-stopped
    network_mode: host                        # Redis(127.0.0.1:6379)·LiveKit API(127.0.0.1:7880)와 같은 netns
    environment:
      PURGE_PORT: "9107"
      # 백엔드와 나눠 갖는 시크릿. 호스트 파일에서 읽어 넣는다(git에 두지 않는다).
      # 같은 값이 앱 스택의 /etc/liveclass/.env.prod 에도 EGRESS_PURGE_SECRET 으로 있어야 한다.
      EGRESS_PURGE_SECRET: ${EGRESS_PURGE_SECRET:?EGRESS_PURGE_SECRET 필요 — /etc/liveclass/livekit/purger.env 참고}
    volumes:
      # LiveKit API 자격증명. 지우기 전에 StopEgress로 유령임을 스스로 다시 확인하는 데 쓴다.
      - ${LIVECLASS_SECRETS_DIR:-/etc/liveclass}/livekit/egress.yaml:/out/egress.yaml:ro

volumes:
  certbot-etc:                                # 앱 스택(docker-compose.prod.yml)이 생성한 볼륨을 공유
    external: true
    name: liveclass_certbot_etc
