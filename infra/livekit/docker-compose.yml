# LiveKit 미디어 서버 (화상 먼저 — Egress/Redis는 녹화 단계에서 추가)
# 서버(192.168.219.124)에서: docker compose up -d
services:
  livekit:
    image: livekit/livekit-server:v1.9.1     # 배포 시 현재 stable 태그 확인(Docker Hub)
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host                        # Linux 권장 — RTC 포트(7880/7881/7882)를 호스트에 직접 바인딩
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
