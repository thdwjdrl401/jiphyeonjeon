# 미디어 서버 (LiveKit SFU + Egress 녹화 + Redis + MinIO)
# PoC 검증 완료 구성. 값은 아래 <...> 자리 채우기. 자세한 건 README.md.
# 기동(수동): docker compose up -d   # 시크릿/미디어는 호스트(/etc/liveclass/livekit, /srv/liveclass/stt-audio)에서 마운트
name: livekit          # 프로젝트명 고정 = 볼륨(livekit_*)·컨테이너 접두사. 디렉토리명과 무관.
services:
  livekit:
    image: livekit/livekit-server:v1.13.3   # advertise_internal_ip 지원(≥v1.13.0) — 구버전이면 무시됨
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host                        # RTC 포트 직접 바인딩
    volumes:
      - /etc/liveclass/livekit/livekit.yaml:/etc/livekit.yaml:ro   # 실 시크릿(호스트). git엔 템플릿만.
    depends_on: [redis]

  redis:                                      # LiveKit ↔ Egress 통신 전용 (앱 Redis와 별개)
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--appendonly", "yes"]

  egress:
    image: livekit/egress:v1.13.0
    restart: unless-stopped
    network_mode: host
    cap_add: [SYS_ADMIN]                      # Chromium 샌드박스 (필수)
    security_opt: ["seccomp=unconfined"]      # ★ Chrome 런치 차단 회피 (아래 트러블슈팅 #3)
    shm_size: "1g"                            # Chrome /dev/shm
    environment: ["EGRESS_CONFIG_FILE=/out/egress.yaml"]
    volumes:
      - /etc/liveclass/livekit/egress.yaml:/out/egress.yaml:ro     # 실 시크릿(호스트)
    depends_on: [redis, livekit]

  minio:                                      # PoC용 S3 호환 스토리지 (EC2는 실 AWS S3로 교체)
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z   # 커뮤니티 유지보수모드 → 태그 고정
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: <MINIO_USER>
      MINIO_ROOT_PASSWORD: <MINIO_PASSWORD>
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  nginx-livekit:                              # 시그널링(WSS) TLS 종단 → livekit 7880. 미디어(UDP)는 우회.
    image: nginx:alpine
    restart: unless-stopped
    network_mode: host                        # 7443 바인딩 + 127.0.0.1:7880 직결
    depends_on: [livekit]
    volumes:
      - ./nginx-livekit-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro       # 앱 스택 certbot이 발급/갱신하는 공유 인증서
    # 6h마다 reload → 갱신된 인증서 반영
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  av-bot:                                     # STT 테스트용 지속 퍼블리셔 — 영상+음성을 room stt-test에 상시 흘려보냄
    build: ./stt-bot                          #   STT 서버는 이 방 av-bot 참가자의 audio 트랙만 구독
    restart: unless-stopped
    network_mode: host                        # livekit 127.0.0.1:7880 직결
    depends_on: [livekit]
    env_file: /etc/liveclass/livekit/CREDENTIALS.txt   # 서버 로컬 시크릿(커밋 안 됨)
    environment:
      LIVEKIT_URL: ws://localhost:7880
      STT_ROOM: stt-test
      STT_IDENTITY: av-bot
      # 재생목록: "영상|음성|길이초" 클립을 공백으로 나열, 순서대로 번갈아 재생 후 반복.
      # 현재: imf만(완전 대체). 번갈아 하려면 아래 주석처럼 springBoot 클립을 뒤에 붙인다.
      STT_PLAYLIST: "/audio/imf-video.h264|/audio/imf-audio.ogg|68"
      # STT_PLAYLIST: "/audio/imf-video.h264|/audio/imf-audio.ogg|68 /audio/loop-video.h264|/audio/loop-audio.ogg|2665"
    volumes:
      - /srv/liveclass/stt-audio:/audio:ro    # 테스트 미디어(호스트, 195MB — git 밖)

volumes:
  miniodata:
  certbot-etc:                                # 앱 스택(docker-compose.prod.yml)이 생성한 볼륨을 공유
    external: true
    name: liveclass_certbot_etc
