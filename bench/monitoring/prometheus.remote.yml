# 관측은 **측정 머신이 아닌 곳에서** 돈다.
#
# 관측 컨테이너가 측정 머신에서 같이 돌면 코어를 나눠 쓴다 — lazy 는 물리 4코어라 실측으로
# 팬아웃이 18.3초에서 20.976초로 늘었다(+15%). 그래서 Prometheus·Grafana 는 LAN 의 다른
# 기기에 두고, 측정 머신에는 exporter 만 남긴다. cAdvisor 는 cgroup 과 /var/lib/docker 를
# 읽어야 해서 못 옮긴다.
#
# 대상은 bench-host 라는 이름 하나로 가리킨다. compose.remote.yml 이 그 이름을 매핑한다.
#
#   같은 LAN      BENCH_HOST=192.168.219.124   터널 없이 바로 붙는다
#                 측정 머신을 METRICS_BIND=0.0.0.0 으로 띄워야 한다
#   다른 망        BENCH_HOST 를 주지 않으면 host-gateway 로 간다. 이 기기의 127.0.0.1 로
#                 SSH 터널을 끌어온 경우다
#                 ssh -N -L 18081:127.0.0.1:18081 -L 15692:127.0.0.1:15692 \
#                        -L 19187:127.0.0.1:19187 -L 18082:127.0.0.1:18082 \
#                        -L 18085:127.0.0.1:18085 lazy
#
# 알림 DLQ 경보 규칙(ADR-0133). 규칙 본문은 infra/prometheus/ 에 있다.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 알림 DLQ 경보 규칙(ADR-0133). 벤치 전용 규칙이 아니라 운영에 필요한 규칙이고, 지금 이 파일을
# 읽을 수 있는 Prometheus가 여기 하나뿐이라 여기서 읽는다. 규칙 본문은 infra/prometheus/에 있다.
rule_files:
  - /etc/prometheus/rules/notification-dlq.rules.yml

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['bench-host:18081']

  - job_name: postgres
    static_configs:
      - targets: ['bench-host:19187']

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['bench-host:15692']

  - job_name: cadvisor
    # 메모리 한계에 닿는 장면을 남기려면 전역 간격으로는 부족하다.
    scrape_interval: 1s
    static_configs:
      - targets: ['bench-host:18082']

  - job_name: cgroup
    # 커널 카운터(memory.events)는 누적이라 간격과 무관하고, 최고 수위도 단조 증가라 놓칠 수
    # 없다. 촘촘히 가져오는 이유는 순간값 곡선의 모양과 회차 경계 때문이다 — 1초면 20초짜리
    # 회차가 20점이라 오르내림이 각지고, 회차가 바뀌는 순간이 두 점 사이로 뭉갠다.
    scrape_interval: 500ms
    static_configs:
      - targets: ['bench-host:18085']
