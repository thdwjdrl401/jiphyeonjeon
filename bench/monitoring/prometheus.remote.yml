# 관측을 **측정 머신 밖에서** 돌릴 때의 스크레이프 설정.
#
# 왜 밖으로 빼나. 관측 컨테이너가 측정 머신에서 같이 돌면 그만큼 CPU를 먹는다 —
# lazy는 물리 4코어라 실측으로 팬아웃이 18.3초에서 20.976초로 늘었다(+15%).
#
# 전부 뺄 수는 없다.
#
#   Prometheus·Grafana·렌더러   어디서 돌든 상관없다        → 뺀다
#   postgres-exporter           TCP로 붙기만 하면 된다      → 뺄 수 있으나 남겨 둔다(터널 하나 줄이려고)
#   cAdvisor                    cgroup과 /var/lib/docker를  → **못 뺀다**. 측정 머신에 있어야 한다
#                               읽어야 컨테이너 CPU가 나온다
#
# 남는 둘은 가볍다. 그래도 0은 아니므로 대표 수치는 여전히 관측을 끄고 잰다.
#
# 대상은 SSH 터널로 가져온 로컬 포트다. 터널은 이렇게 연다.
#
#   ssh -N -L 18081:127.0.0.1:18081 -L 15692:127.0.0.1:15692 \
#          -L 19187:127.0.0.1:19187 -L 18082:127.0.0.1:18082 lazy
#
# 도커 안에서 호스트의 그 포트를 보려면 host.docker.internal을 쓴다(compose에서 매핑한다).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 알림 DLQ 경보 규칙(ADR-0133). 벤치 전용 규칙이 아니라 운영에 필요한 규칙이고, 지금 이 파일을
# 읽을 수 있는 Prometheus가 여기 하나뿐이라 여기서 읽는다. 규칙 본문은 infra/prometheus/에 있다.
rule_files:
  - /etc/prometheus/rules/notification-dlq.rules.yml

scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:18081']

  - job_name: postgres
    static_configs:
      - targets: ['host.docker.internal:19187']

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['host.docker.internal:15692']

  - job_name: cadvisor
    # 메모리 한계에 닿는 장면을 남기려면 전역 간격으로는 부족하다.
    scrape_interval: 1s
    static_configs:
      - targets: ['host.docker.internal:18082']

  - job_name: cgroup
    # 커널 카운터(memory.events)는 누적이라 간격과 무관하고, 최고 수위도 단조 증가라 놓칠 수
    # 없다. 촘촘히 가져오는 이유는 순간값 곡선의 모양과 회차 경계 때문이다 — 1초면 20초짜리
    # 회차가 20점이라 오르내림이 각지고, 회차가 바뀌는 순간이 두 점 사이로 뭉갠다.
    scrape_interval: 500ms
    static_configs:
      - targets: ['host.docker.internal:18083']
