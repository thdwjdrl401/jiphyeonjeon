# 측정 구간을 눈으로 보게 하는 스크레이프 설정.
#
# 간격이 5초다. 팬아웃이 20초 안에 끝나므로 기본값 15초로는 점이 한둘밖에 안 찍힌다 —
# 그래프가 그려지려면 구간 안에 표본이 여러 개 있어야 한다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 알림 DLQ 경보 규칙(ADR-0133). 벤치 전용 규칙이 아니라 운영에 필요한 규칙이고, 지금 이 파일을
# 읽을 수 있는 Prometheus가 여기 하나뿐이라 여기서 읽는다. 규칙 본문은 infra/prometheus/에 있다.
rule_files:
  - /etc/prometheus/rules/notification-dlq.rules.yml

scrape_configs:
  # 앱 — JVM 힙·GC, Hikari 커넥션, Rabbit 리스너
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  # Postgres — 표별 삽입 수(팬아웃 진행), 활성 백엔드, 커밋·WAL
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # RabbitMQ — 큐 깊이. 어느 구간이 밀리는지가 여기서 보인다.
  #
  # **/metrics가 아니라 /metrics/per-object다.** 기본 경로는 큐별로 안 내보내고 합계만 낸다
  # (queue 라벨이 아예 없다). 팬아웃 큐와 푸시 큐를 갈라 보려면 이 경로여야 한다.
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ['rabbitmq:15692']

  # 컨테이너 CPU·메모리 — 팬아웃은 DB가, 발송은 앱이 먹는다는 그림이 여기서 나온다
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
