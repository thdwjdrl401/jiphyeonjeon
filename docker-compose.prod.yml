# 프로덕션 배포 (EC2) — 전부 Docker + HTTPS.  dev용 docker-compose.yml과는 별개 파일.
# 사용:
#   cp .env.prod.example .env.prod   # 값 채우기 (POSTGRES_PASSWORD 등)
#   bash scripts/init-letsencrypt.sh # 최초 1회 인증서 발급
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# 컨테이너: postgres · redis · backend · frontend(nginx) · certbot
name: liveclass          # compose 프로젝트명 고정 = 볼륨/이미지/네트워크 접두사. 디렉토리명과 무관하게 liveclass_* 로 통일.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: liveclass-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveclass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: ${POSTGRES_DB:-liveclass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro   # 최초 1회 스키마
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveclass} -d ${POSTGRES_DB:-liveclass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 호스트 포트 미노출 — 내부 네트워크에서만 접근

  redis:
    image: redis:7-alpine
    container_name: liveclass-redis-prod
    restart: unless-stopped
    # maxmemory는 **튜닝값이 아니라 폭주 감지선**이다(ADR-0086). 실측 사용량이 6MB 남짓이고
    # 스트림은 생산자 쪽에서 MAXLEN 10,000으로 이미 잘려 있다 — 1GB에 닿는다는 것은 정상 동작이
    # 아니라 고장이다. 조용히 부풀어 호스트를 잡아먹는 대신 시끄럽게 실패하게 둔다.
    #
    # **eviction은 켜지 않는다.** 이 인스턴스에는 HTTP 세션(liveclass:session:*)이 함께 사는데,
    # allkeys-lru는 물론이고 volatile-lru도 세션에 TTL이 있어 지워 간다 — 무작위 로그아웃이 된다.
    # 인스턴스당 정책은 하나뿐이라 캐시와 세션을 같이 두면 한쪽을 포기해야 하고, 지금은 캐시 용도
    # 키가 사실상 없으므로 세션 쪽으로 몰아 두는 것이 맞다(분리 조건은 ADR-0086).
    command:
      ["redis-server", "--appendonly", "yes",
       "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    ports:
      # GPU SSH -L 터널 → prod realtime-agent가 prod redis에 캡션 XADD(lease/caption). loopback 전용(외부 노출 아님).
      # requirepass 없음 — loopback + SSH키로 게이팅. 내부 네트워크 소비자(Spring·ai-api)는 redis:6379 그대로.
      - "127.0.0.1:6390:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 운영 RabbitMQ 관리 UI TLS 종단 — https://…:8991 → rabbitmq:15672.
  #
  # **왜 필요한가.** 큐가 비었는지, DLQ에 무엇이 쌓였는지는 컨테이너에 들어가 rabbitmqctl을 쳐야만
  # 보였다. 실제로 강조 색인 잡이 DLQ로 반려된 것을 그렇게 알아냈는데, 반려 사유는 그 방법으로
  # 볼 수 없다 — UI가 있으면 메시지 본문까지 바로 확인된다.
  #
  # **dev(8990)와 포트를 나눈다.** 같은 포트면 어느 스택의 큐를 보고 있는지 알 수 없고, DLQ를
  # 들여다볼 때 그 혼동이 그대로 오판이 된다.
  #
  # 인증서는 앱 스택 certbot이 발급/갱신하는 공유 볼륨을 읽기전용으로 쓴다(livekit·dev UI와 동일).
  rabbitmq-ui-tls:
    image: nginx:alpine
    container_name: liveclass-rabbitmq-ui-tls-prod
    restart: unless-stopped
    ports:
      - "8991:8991"      # https (SG 개방 필요)
    volumes:
      - ./infra/nginx/rabbitmq-ui-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on: [rabbitmq]
    # 6h마다 reload → 갱신 인증서 반영 (livekit nginx·dev UI와 동일)
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  minio:                                   # 에셋(썸네일·프로필·강의자료) presigned 업로드용 S3 호환 스토리지 (ADR-0023)
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z   # LiveKit 스택과 동일 태그 고정
    container_name: liveclass-minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 필요}
    volumes:
      - miniodata:/data
    ports:
      # 루프백에만 게시한다. 미디어 스택(Egress)이 host 네트워크로 돌아 도커 서비스명을 해석하지
      # 못하는데, 녹화 업로드를 공개 도메인→nginx로 우회시키면 세그먼트 바이트가 TLS 엣지를
      # 왕복한다. 127.0.0.1 바인드라 외부 노출은 없고 같은 호스트의 Egress만 닿는다.
      - "127.0.0.1:9000:9000"
    # 브라우저는 여전히 앱 nginx의 /liveclass-assets·/recordings 로만 접근(presigned가 공개 도메인으로 서명).
    # 헬스체크는 두지 않는다 — minio 서버 이미지에 mc/curl 유무가 불확실. minio-init이 재시도 루프로 준비를 기다린다.

  minio-init:                              # 버킷 생성 (멱등). 계속 살려둔다 —
    image: minio/mc                         # 일회성으로 exit하면 `up --wait`가 그 종료를 실패로 보고 배포가 깨진다.
    depends_on: [minio]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 필요}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set lc http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do echo 'waiting for minio'; sleep 1; done
        mc mb -p lc/${ASSET_STORAGE_BUCKET:-liveclass-assets} || true
        mc mb -p lc/${EGRESS_BUCKET:-recordings} || true
        echo 'bucket ready'; sleep infinity

  rabbitmq:                                # AI 배치 잡 큐(ADR-0036/0012). prod 전용 — dev-infra와 분리(B안).
    image: rabbitmq:3.13-management-alpine
    container_name: liveclass-rabbitmq-prod
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-liveclass}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 필요}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    # 호스트 포트 미노출 — 백엔드(같은 네트워크)만 발행. AI 워커 접속은 그 스택 배포 시 네트워크로 결정(후속).

  backend:
    build: ./backend
    container_name: liveclass-backend-prod
    restart: unless-stopped
    # LiveKit API 자격. 미디어 스택과 같은 파일을 읽어 단일 출처를 지킨다 — .env.prod에 복사하면
    # 두 곳이 갈라져 드리프트가 생긴다. 이 파일이 없으면 부팅을 실패시킨다(조용히 dev 더미 키로
    # 도는 것보다 낫다 — 실제로 그 상태로 녹화가 안 되고 있었다).
    env_file:
      - /etc/liveclass/livekit/CREDENTIALS.txt
    # 공개 도메인을 호스트로 직결시킨다. frontend의 network alias는 이 도메인을 앱 nginx 컨테이너로
    # 묶어버려서 :443은 되지만 다른 포트(:7443 LiveKit API)에는 닿지 못한다. /etc/hosts가 도커 DNS보다
    # 우선하므로 이 컨테이너만 호스트 게시 포트로 나가고, :443·:7443이 모두 열리면서 hairpin도 그대로 피한다.
    extra_hosts:
      - "jiphyeonjeon.thdwjdrl.com:host-gateway"
    environment:
      # application.yml이 localhost 하드코딩 → relaxed-binding env로 override
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-liveclass}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-liveclass}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # Redis Stream consumer 이름을 **고정**한다(ADR-0086).
      #
      # 비워 두면 CaptionStreamProperties가 $HOSTNAME으로 이름을 짓는데, 도커에서 HOSTNAME은
      # 컨테이너 ID라 배포마다 바뀐다. "안정적이어야 재기동 시 자기 pending을 이어받는다"는 원래
      # 의도가 실현되지 않고, 그룹 안에 다시는 쓰이지 않는 consumer만 쌓인다 — 실측 193개였다
      # (배포 횟수만큼). pending이 남은 채로 이름이 바뀌면 그 엔트리는 아무도 이어받지 못한다.
      #
      # 백엔드는 단일 인스턴스다. 여러 개로 늘리면 인스턴스마다 다른 값을 줘야 한다.
      # 이름은 application.yml의 플레이스홀더를 그대로 쓴다(`consumer: ${CAPTION_CONSUMER_NAME:}`).
      # 완화 바인딩(LIVECLASS_CAPTION_CONSUMER)은 이 프로젝트 규약이 아니라서 조용히 무시된다.
      CAPTION_CONSUMER_NAME: spring-prod-1
      LECTURE_NOTE_CONSUMER_NAME: spring-notes-prod-1
      # 유령 Egress 회수 중계(infra/livekit/egress-purger). 호스트 네트워크로 떠 있어 브리지
      # 게이트웨이로 부른다. ufw가 브리지→호스트를 막으므로 규칙이 하나 필요하다:
      #   sudo ufw allow from 172.18.0.0/16 to any port 9107 proto tcp comment 'egress-purger'
      # 시크릿은 중계 쪽(/etc/liveclass/livekit/purger.env)과 같은 값이어야 한다.
      EGRESS_PURGER_BASE_URL: ${EGRESS_PURGER_BASE_URL:-http://172.18.0.1:9107}
      EGRESS_PURGE_SECRET: ${EGRESS_PURGE_SECRET:-}
      # HTTPS 뒤 → 세션 쿠키 Secure + 프록시 헤더 신뢰
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # 에셋 스토리지(MinIO, 같은 스택). presigned URL을 공개 도메인으로 서명 → 브라우저가 앱 nginx의
      # /liveclass-assets 로 직접 PUT. backend 자신(complete HEAD)도 이 도메인으로 접근하는데,
      # frontend 서비스의 network alias(jiphyeonjeon.thdwjdrl.com)로 내부에서 nginx로 해석돼 hairpin을 피한다.
      ASSET_STORAGE_ENDPOINT: ${PUBLIC_BASE_URL:-https://jiphyeonjeon.thdwjdrl.com}
      ASSET_STORAGE_BUCKET: ${ASSET_STORAGE_BUCKET:-liveclass-assets}
      ASSET_STORAGE_REGION: ${ASSET_STORAGE_REGION:-us-east-1}
      ASSET_STORAGE_PATH_STYLE: "true"
      ASSET_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      ASSET_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 필요}
      # 녹화 스토리지(같은 MinIO, 다른 버킷). 같은 버킷을 세 주체가 서로 다른 네트워크 위치에서
      # 접근하고 SigV4가 Host를 서명에 포함하므로 주소를 합칠 수 없다:
      #   EGRESS_S3_ENDPOINT             backend가 매니페스트 GET  — 도커 브리지, 서비스명
      #   EGRESS_UPLOAD_ENDPOINT         Egress가 세그먼트 PUT     — host 네트워크, 루프백 게시 포트
      #   VIDEO_PLAYBACK_PUBLIC_ENDPOINT 브라우저가 세그먼트 GET   — 외부, nginx /recordings/
      # 앞의 둘은 호스트 안에서 끝난다. 공개 엣지를 타는 건 브라우저 경로 하나뿐이다.
      EGRESS_BUCKET: ${EGRESS_BUCKET:-recordings}
      EGRESS_S3_ENDPOINT: http://minio:9000
      EGRESS_UPLOAD_ENDPOINT: http://127.0.0.1:9000
      EGRESS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      EGRESS_S3_SECRET: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 필요}
      EGRESS_S3_REGION: ${EGRESS_S3_REGION:-us-east-1}
      EGRESS_FORCE_PATH_STYLE: "true"
      # 합성 화면을 그릴 페이지. 비우면 LiveKit 기본 템플릿(화면공유가 83%로 축소되고 검은 여백이
      # 남는다)을 쓰고, 값을 주면 우리 템플릿(/egress/stage)이 그린다.
      #
      # 값을 여기 박지 않고 호스트 env를 참조한다 — 배포 없이 켜고 끄기 위해서다. 문제가 생기면
      # /etc/liveclass/.env.prod 에서 한 줄 지우고 백엔드만 재시작하면 즉시 원복된다. 그 파일은
      # 호스트에 있어 배포에 덮이지 않는다. 반대로 compose를 손으로 고치면 다음 배포에 사라진다.
      EGRESS_TEMPLATE_BASE_URL: ${EGRESS_TEMPLATE_BASE_URL:-}
      VIDEO_PLAYBACK_PUBLIC_ENDPOINT: ${PUBLIC_BASE_URL:-https://jiphyeonjeon.thdwjdrl.com}
      # LiveKit — 브라우저 접속 주소와 백엔드 API 주소를 나눈다(같은 서버, 다른 네트워크 위치).
      #   LIVEKIT_URL      브라우저가 WebRTC로 붙는 공개 wss (토큰 응답에 실림)
      #   LIVEKIT_API_URL  백엔드가 방 제어·Egress 시작에 쓰는 주소
      # API는 미디어 스택의 nginx(:7443, host 네트워크)를 탄다 — LiveKit 평문 7880은 ufw가
      # 막고 있고, 컨트롤 호출은 소량이라 기존 TLS 엣지를 재사용하는 편이 방화벽 구멍보다 낫다.
      # extra_hosts로 도메인을 호스트에 직결시켜야 7443에 닿는다(아래 참조).
      # 브라우저 주소는 443의 /livekit 경로다(ADR-0078). 7443을 쓰면 7000~7999 대역을 막는
      # 학교·사내망에서 시그널링부터 붙지 않아 강의 입장이 통째로 실패한다. 443은 HTTPS라
      # 어디서나 열려 있고, 앱 nginx가 /livekit을 LiveKit 7880으로 넘긴다.
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://jiphyeonjeon.thdwjdrl.com/livekit}
      # API 주소는 그대로 7443이다. 막힌 것은 브라우저가 있는 망이지 서버가 아니다 — 백엔드는
      # EC2 안에서 나가므로 7443이 멀쩡하고, 바꿀 이유가 없는 것을 함께 바꾸면 문제가 생겼을 때
      # 어느 쪽 때문인지 못 가린다.
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-https://jiphyeonjeon.thdwjdrl.com:7443}
      # dev worker(liveclass-realtime-stt-dev)와 분리해 prod 캡션이 dev Redis로 섞이지 않게 한다.
      LIVEKIT_CONTROL_TIMEOUT: ${LIVEKIT_CONTROL_TIMEOUT:-10s}
      LIVEKIT_AGENT_NAME: liveclass-realtime-stt-prod
      # AI 배치 잡 발행(ADR-0036). outbox 릴레이가 rabbitmq로 publish. 스위치 material.embedding.enabled로 켠다.
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-liveclass}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 필요}
      # 업로드 녹화강의(media-worker) — source URL과 callback은 용도별 HMAC 시크릿을 분리한다.
      RECORDED_VIDEO_ENABLED: ${RECORDED_VIDEO_ENABLED:-true}
      MEDIA_SOURCE_SECRET: ${MEDIA_SOURCE_SECRET:?MEDIA_SOURCE_SECRET 필요}
      MEDIA_CALLBACK_SECRET: ${MEDIA_CALLBACK_SECRET:?MEDIA_CALLBACK_SECRET 필요}
      RECORDED_STT_ENABLED: ${RECORDED_STT_ENABLED:-false}
      # feature off인 기존 배포를 깨지 않는다. 실제로 켤 때는 .env.prod의 강한 별도 키가 필수다.
      RECORDED_STT_SOURCE_SECRET: ${RECORDED_STT_SOURCE_SECRET:-disabled-recorded-stt-source-secret}
      RECORDED_STT_CALLBACK_SECRET: ${RECORDED_STT_CALLBACK_SECRET:-disabled-recorded-stt-callback-secret}
      # 자료 임베딩 스위치. 이 줄이 없으면 .env.prod에 값을 넣어도 컨테이너로 전달되지 않아
      # 기본 false가 되고, 자료를 연결해도 임베딩 잡이 발행되지 않는다. 그때도 자료 상태는
      # READY로 남아(무회귀 동작) "준비됐는데 AI가 근거를 못 찾는" 상태가 조용히 생긴다.
      MATERIAL_EMBEDDING_ENABLED: ${MATERIAL_EMBEDDING_ENABLED:-false}
      # Web Push VAPID 키쌍(ADR-0073 §9). **벤더 계정 등록이 필요 없다** — 키는 우리가 만들고
      # 브라우저 푸시 서비스는 서명으로 "같은 서버가 보냈다"만 확인한다.
      #
      # 이 줄이 없으면 .env.prod에 값을 넣어도 컨테이너로 전달되지 않는다. MATERIAL_EMBEDDING_ENABLED가
      # 정확히 그렇게 조용히 꺼져 있던 적이 있다(위 참조). 기본값을 비워 두므로 키가 없으면 푸시만
      # 꺼진 채로 동작하고 알림함·STOMP는 그대로다 — 키 하나로 알림 전체가 멈추지 않는다.
      #
      # 키를 바꾸면 **기존 구독이 전부 무효**가 된다(브라우저가 옛 공개키로 만든 구독이라).
      # 그때는 push_subscription을 비우고 사용자가 다시 켜야 한다.
      NOTIFICATION_WEB_PUSH_PUBLIC_KEY: ${NOTIFICATION_WEB_PUSH_PUBLIC_KEY:-}
      NOTIFICATION_WEB_PUSH_PRIVATE_KEY: ${NOTIFICATION_WEB_PUSH_PRIVATE_KEY:-}
      NOTIFICATION_WEB_PUSH_SUBJECT: ${NOTIFICATION_WEB_PUSH_SUBJECT:-mailto:liveclass@jiphyeonjeon.thdwjdrl.com}
      # AI 질의응답 SSE 프록시(ADR-0047). ai-api는 별도 compose(docker-compose.ai-prod.yml)지만 같은
      # liveclass_default 네트워크라 서비스명으로 닿는다. 시크릿은 ai-api의 AI_INTERNAL_SECRET과
      # **같은 값**이어야 한다 — 다르면 서명 검증에서 401이라 답변이 아예 시작되지 않는다.
      # 콜백용 AI_CALLBACK_SECRET과는 별개 값이다(docs/ai/CONTRACT.md §3.2).
      AI_API_BASE_URL: http://ai-api:8010
      AI_INTERNAL_SECRET: ${AI_INTERNAL_SECRET:?AI_INTERNAL_SECRET 필요 — ai-api와 공유하는 RAG HMAC 시크릿}
      # 판서 해석(ADR-0054, §3-6e). backend가 GMS를 직접 부른다 — 이 호출에는 검색도 임베딩도
      # 자막 컨텍스트도 없어 ai-api를 거치면 홉과 HMAC 서명만 는다.
      #
      # 이 줄이 없으면 .env.prod에 값을 넣어도 컨테이너로 전달되지 않는다. MATERIAL_EMBEDDING_ENABLED가
      # 정확히 그렇게 조용히 꺼져 있던 적이 있다(위 참조). 기본값을 비워 두므로 키가 없으면 판서 해석만
      # 502로 떨어지고 기동은 막지 않는다 — 강의가 키 하나로 안 뜨는 상황을 만들지 않는다.
      ANNOTATION_AI_API_KEY: ${ANNOTATION_AI_API_KEY:-}
      ANNOTATION_AI_MODEL: ${ANNOTATION_AI_MODEL:-gpt-4.1}
      # 강조 판서 설명 워커(ADR-0074). 캡처를 읽어 텍스트를 만들고 색인 잡을 outbox에 싣는다.
      # 켜면 비전 모델을 호출하므로 비용이 든다. 키(ANNOTATION_AI_API_KEY)가 없으면 워커가 실패를
      # 반복하지 않도록 describer가 먼저 거절한다 — 그래도 켜기 전에 키가 있는지 확인할 것.
      ANNOTATION_HIGHLIGHT_DESCRIBE_ENABLED: ${ANNOTATION_HIGHLIGHT_DESCRIBE_ENABLED:-true}
      # 운영 콘솔(ROLE_ADMIN) 허용 이메일 — 콤마 구분. 비면 관리자가 아무도 없다(콘솔은 403).
      # 별도 가입 역할이 아니라 로그인 시 기존 계정에 권한을 덧입히는 방식이라(AdminAccounts),
      # 목록을 바꾸면 해당 사용자는 재로그인해야 반영된다. 이 줄이 없으면 .env.prod에 넣어도 전달되지 않는다.
      SECURITY_ADMIN_EMAILS: ${SECURITY_ADMIN_EMAILS:-}
      # 비밀번호 찾기 메일(임시 비밀번호). 이 줄들이 없으면 .env.prod에 넣어도 전달되지 않는다.
      #
      # Gmail은 계정 비밀번호가 아니라 **앱 비밀번호**를 요구한다(2단계 인증을 켠 뒤 발급).
      # 값은 /etc/liveclass/.env.prod에만 둔다 — 저장소에 커밋하지 않는다.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 받는 사람에게 보이는 발신 주소. 비우면 MAIL_USERNAME을 쓴다.
      MAIL_FROM: ${MAIL_FROM:-}
      # AI 강의 노트 소비(CONTRACT §3-4a). 이 줄이 없으면 .env.prod에 넣어도 전달되지 않는다 —
      # 위 두 사례와 같은 함정이고, 실제로 여기서 한 번 더 걸렸다. 기본 꺼짐이라 켜는 것은 환경별 결정이며
      # 켜는 순간 그동안 스트림에 쌓인 이벤트를 처음(0-0)부터 읽어 지난 세션 노트가 먼저 채워진다.
      LECTURE_NOTE_CONSUMER_ENABLED: ${LECTURE_NOTE_CONSUMER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy   # Flyway 마이그레이션 전 DB 준비 대기
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    # 호스트 포트 미노출 — nginx(frontend)만 접근

  media-worker:
    build: ./media-worker
    container_name: liveclass-media-worker-prod
    restart: unless-stopped
    environment:
      MEDIA_RABBITMQ_URL: amqp://${RABBITMQ_USER:-liveclass}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 필요}@rabbitmq:5672/
      MEDIA_BACKEND_URL: http://backend:8080
      MEDIA_SOURCE_SECRET: ${MEDIA_SOURCE_SECRET:?MEDIA_SOURCE_SECRET 필요}
      MEDIA_CALLBACK_SECRET: ${MEDIA_CALLBACK_SECRET:?MEDIA_CALLBACK_SECRET 필요}
      MEDIA_OUTPUT_ENDPOINT: http://minio:9000
      MEDIA_OUTPUT_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_OUTPUT_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 필요}
      MEDIA_OUTPUT_BUCKET: ${EGRESS_BUCKET:-recordings}
      MEDIA_OUTPUT_REGION: ${EGRESS_S3_REGION:-us-east-1}
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: liveclass-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro     # 인증서 (certbot이 발급/갱신)
      - certbot-www:/var/www/certbot        # ACME 챌린지 webroot
    depends_on:
      - backend
      - minio
    # LiveKit은 이 스택이 아니라 미디어 스택(network_mode: host)에 있다. /livekit 프록시가 호스트로
    # 나가야 닿으므로 게이트웨이를 이름으로 심는다 — 브리지 IP(172.18.0.1)를 박아 두면 네트워크를
    # 다시 만들 때 대역이 바뀌어 조용히 502가 된다(ADR-0078).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        # backend가 ASSET_STORAGE_ENDPOINT(공개 도메인)로 MinIO에 붙을 때 내부에서 이 nginx로 해석되게 한다
        # (EC2 hairpin NAT 회피). 외부 클라이언트는 여전히 공개 DNS→퍼블릭 IP로 이 nginx에 닿는다.
        aliases:
          - jiphyeonjeon.thdwjdrl.com
    # 6h마다 nginx reload → 갱신된 인증서 반영
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    container_name: liveclass-certbot-prod
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 12h마다 갱신 시도 (webroot). 최초 발급은 scripts/init-letsencrypt.sh.
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  redisdata:
  miniodata:
  rabbitmqdata:
  certbot-etc:
    name: liveclass_certbot_etc   # 미디어 스택(infra/livekit)이 external로 공유
  certbot-www:
