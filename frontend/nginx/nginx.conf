# nginx 메인 설정 — nginx:alpine 스톡 파일에서 **두 줄만** 다르다(worker_rlimit_nofile, worker_connections).
#
# 왜 메인 설정까지 소유하는가.
# 우리가 쓰던 default.conf는 http{} 안에 include되는데, 파일 디스크립터 상한과 워커당 연결 수는
# main·events 컨텍스트 지시어라 거기에 넣을 수 없다. 그래서 이 파일이 필요하다.
#
# 대가: 이 파일을 두는 순간 베이스 이미지의 **main 컨텍스트 기본값 변경을 더 이상 물려받지 않는다.**
# 그래서 나머지는 스톡 그대로 두고, 이미지를 올릴 때 스톡과 diff를 한 번 보는 것으로 관리한다
# (`docker run --rm nginx:alpine cat /etc/nginx/nginx.conf`).

user  nginx;
worker_processes  auto;

# 프록시된 WebSocket 하나는 fd를 **2개** 쓴다 — 브라우저 쪽 연결과 백엔드 쪽 연결.
# 라이브 수강 탭 하나가 여는 소켓은 앱 STOMP 5개(알림·채팅·세션상태·자막·강의노트) + LiveKit
# 시그널링 1개 = 6개, 즉 fd 12개다. 도커 기본 소프트 상한 1024로는 워커당 85명이 천장이었고,
# HTTP·HLS·MinIO 프록시가 같은 풀을 쓰므로 실제로는 그보다 낮았다.
#
# 컨테이너 하드 상한이 524288이라 마스터(root)가 소프트를 여기까지 올릴 수 있다 — compose의
# ulimits가 따로 필요 없다.
worker_rlimit_nofile 65535;

events {
    # 이 값도 fd와 같은 이유로 올린다. worker_connections는 **프록시 연결까지 포함**하므로
    # WebSocket 하나가 슬롯 2개를 쓴다. fd만 올리고 이 값을 두면 여기서 다시 막힌다.
    worker_connections  8192;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # 우리 서버 블록(SSL 종단·SPA·/api·/livekit·MinIO 프록시)은 여기로 들어온다.
    include /etc/nginx/conf.d/*.conf;
}
