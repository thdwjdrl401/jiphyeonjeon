# 프론트 nginx — SSL 종단 + SPA 정적 서빙 + /api → backend 프록시
# (dev의 Vite server.proxy 역할을 프로덕션에서 대체)
# 이 파일은 http{} 컨텍스트에 include 되므로 map/server 블록 사용 가능.

# WebSocket 업그레이드 헤더 (라이브/채팅 확장 대비)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# :80 — ACME 챌린지 + https 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name jiphyeonjeon.thdwjdrl.com;

    # Let's Encrypt webroot 갱신 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# :443 — 실제 서비스
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html;
    index index.html;

    # SSE 스트리밍 (예: AI Q&A 답변 /api/qa/{id}/stream) — 실시간 토큰 릴레이.
    # ⚠️ proxy_buffering을 끄지 않으면 nginx가 토큰을 뭉쳐 실시간 스트림이 깨진다.
    # 규칙: SSE 엔드포인트 경로를 '/stream'으로 끝내면 이 블록이 자동 적용(백엔드 라우팅도 동일하게).
    # (현재 매칭되는 엔드포인트 없음 → 기능 추가 전까지 무해)
    location ~ ^/api/.+/stream$ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";     # SSE는 업그레이드 아님 → keep-alive 유지
        proxy_buffering    off;                        # ★ 핵심: 즉시 flush
        proxy_cache        off;
        gzip               off;                        # 압축 버퍼링 방지
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;                      # 토큰 사이 유휴 허용(하트비트 권장)
        proxy_send_timeout 3600s;
    }

    # API — /api/* 전부 백엔드로 (경로 버저닝 없음, ADR-0016)
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # 쿠키 Secure/스킴 인식 (SERVER_FORWARD_HEADERS_STRATEGY)
        # WebSocket 대비
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA — 정적 우선, 없으면 index.html (react-router BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
