# 프론트 nginx — SSL 종단 + SPA 정적 서빙 + /api → backend 프록시
# (dev의 Vite server.proxy 역할을 프로덕션에서 대체)
# 이 파일은 http{} 컨텍스트에 include 되므로 map/server 블록 사용 가능.

# WebSocket 업그레이드 헤더 (라이브/채팅 확장 대비)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# :80 — ACME 챌린지 + https 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name jiphyeonjeon.thdwjdrl.com jiphyeonjeon.thdwjdrl.com;

    # Let's Encrypt webroot 갱신 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# :443 — 정본 도메인. 화면·API·미디어를 모두 여기서 받는다.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;   # Docker 내장 DNS — /liveclass-assets 프록시가 변수로 minio를 지연 해석

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app-locations.conf;

    # SPA — 정적 우선, 없으면 index.html (react-router BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# :443 — 옛 도메인. **페이지만 새 도메인으로 넘긴다.**
#
# 통째로 리다이렉트하면 라이브가 끊긴다 — 브라우저 WebSocket(wss://…/livekit)은 301을 따라가지
# 않고, 이미 서명된 presigned URL도 이 호스트를 가리킨다. 그래서 /api·/livekit·미디어 경로는
# 여기서도 그대로 받고, 사람이 여는 주소만 옮긴다.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;   # Docker 내장 DNS — /liveclass-assets 프록시가 변수로 minio를 지연 해석

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app-locations.conf;

    location / {
        return 301 https://jiphyeonjeon.thdwjdrl.com$request_uri;
    }
}
