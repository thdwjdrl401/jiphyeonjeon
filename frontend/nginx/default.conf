# 프론트 nginx — SSL 종단 + SPA 정적 서빙 + /api → backend 프록시
# (dev의 Vite server.proxy 역할을 프로덕션에서 대체)
# 이 파일은 http{} 컨텍스트에 include 되므로 map/server 블록 사용 가능.

# WebSocket 업그레이드 헤더 (라이브/채팅 확장 대비)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# :80 — ACME 챌린지 + https 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name jiphyeonjeon.thdwjdrl.com;

    # Let's Encrypt webroot 갱신 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# :443 — 실제 서비스
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jiphyeonjeon.thdwjdrl.com;

    ssl_certificate     /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiphyeonjeon.thdwjdrl.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;   # Docker 내장 DNS — /liveclass-assets 프록시가 변수로 minio를 지연 해석

    root  /usr/share/nginx/html;
    index index.html;

    # SSE 스트리밍 (예: AI Q&A 답변 /api/qa/{id}/stream) — 실시간 토큰 릴레이.
    # ⚠️ proxy_buffering을 끄지 않으면 nginx가 토큰을 뭉쳐 실시간 스트림이 깨진다.
    # 규칙: SSE 엔드포인트 경로를 '/stream'으로 끝내면 이 블록이 자동 적용(백엔드 라우팅도 동일하게).
    # (현재 매칭되는 엔드포인트 없음 → 기능 추가 전까지 무해)
    location ~ ^/api/.+/stream$ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";     # SSE는 업그레이드 아님 → keep-alive 유지
        proxy_buffering    off;                        # ★ 핵심: 즉시 flush
        proxy_cache        off;
        gzip               off;                        # 압축 버퍼링 방지
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;                      # 토큰 사이 유휴 허용(하트비트 권장)
        proxy_send_timeout 3600s;
    }

    # API — /api/* 전부 백엔드로 (경로 버저닝 없음, ADR-0016)
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # 쿠키 Secure/스킴 인식 (SERVER_FORWARD_HEADERS_STRATEGY)
        # WebSocket 대비
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 녹화강의 MP4 원본은 공용 에셋보다 구체적인 object key prefix를 쓴다.
    # 5GiB 파일을 nginx 임시 디스크에 먼저 적재하지 않고, 받는 대로 MinIO에
    # 전달한다. 경계값은 FE·Spring·media-worker와 같은 5 * 1024^3 bytes다.
    location /liveclass-assets/recorded_video_source/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       3600 always;
            add_header Content-Length 0;
            return 204;
        }
        set $minio_recorded_source http://minio:9000;
        proxy_pass         $minio_recorded_source;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_hide_header  Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # 에셋 스토리지(MinIO) presigned 프록시.
    # presigned URL이 https://jiphyeonjeon.thdwjdrl.com/liveclass-assets/... (path-style)로 서명되므로
    # 경로를 리라이트하지 않고 그대로 넘기고 Host를 보존해야 SigV4 서명이 맞는다(버킷명이 곧 경로 prefix).
    # 브라우저 presigned PUT의 CORS(프리플라이트)는 여기서 처리한다.
    location /liveclass-assets/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       3600 always;
            add_header Content-Length 0;
            return 204;
        }
        set $minio_upstream http://minio:9000;   # 변수 → nginx가 시작 시 강제 resolve 안 함(minio 잠깐 죽어도 부팅 OK)
        proxy_pass         $minio_upstream;
        proxy_set_header   Host $host;            # ★ 서명된 Host 보존(SigV4). 경로는 그대로 전달됨.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        client_max_body_size 60m;                 # 이미지·MATERIAL 50MiB 상한 + 여유
        proxy_read_timeout 300s;
        proxy_hide_header  Access-Control-Allow-Origin;   # MinIO 것 숨기고 우리가 통제(중복 방지)
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # 녹화 스토리지(MinIO) 프록시 — HLS 세그먼트·재생목록.
    # /liveclass-assets/와 같은 이유로 Host를 보존한다(SigV4에 Host가 포함됨).
    #
    # 여기는 브라우저 GET 전용이다. Egress 업로드는 같은 호스트의 루프백(127.0.0.1:9000)으로
    # 직접 가므로 이 경로를 타지 않는다 — 세그먼트 바이트를 TLS 엣지로 왕복시키지 않는다.
    # 그래서 업로드 설정(client_max_body_size 등)이 필요 없고, SPA와 same-origin이라 CORS도 없다.
    # 세그먼트 바이트는 백엔드를 통과하지 않는다(ARCHITECTURE 원칙 4).
    location /recordings/ {
        set $minio_recordings http://minio:9000;   # 변수 → nginx 부팅 시 강제 resolve 안 함
        proxy_pass         $minio_recordings;
        proxy_set_header   Host $host;             # ★ 서명된 Host 보존(SigV4)
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering    off;                    # 세그먼트를 통째로 버퍼링하지 않고 흘려보낸다
    }

    # SPA — 정적 우선, 없으면 index.html (react-router BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
