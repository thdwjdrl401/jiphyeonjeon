# 두 도메인이 공유하는 프록시·미디어 경로.
#
# **conf.d 밖에 둔다.** nginx 기본 설정이 conf.d/*.conf 를 http 컨텍스트에서 자동으로 include 하는데,
# 이 파일은 location 들만 담고 있어 그 자리에서 파싱되면 "location directive is not allowed here"로
# 기동이 실패한다. server 블록 안에서만 include 되어야 한다.
#
# 도메인마다 인증서가 달라 server 블록을 나눠야 하는데, 이 경로들까지 복사하면 한쪽만 고치는
# 사고가 난다. SPA fallback(location /)만 블록별로 다르므로 그것만 밖에 남긴다 —
# 새 도메인은 화면을 그리고, 옛 도메인은 새 도메인으로 넘긴다.
#
# **옛 도메인에서도 이 경로들은 계속 살아 있어야 한다.** 브라우저 WebSocket은 301을 따라가지
# 않고(wss://…/livekit), 이미 발급된 presigned URL도 옛 호스트로 서명돼 있다. 페이지만 넘기고
# 기계가 쓰는 경로는 양쪽에서 받는다.

    # (현재 매칭되는 엔드포인트 없음 → 기능 추가 전까지 무해)
    location ~ ^/api/.+/stream$ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";     # SSE는 업그레이드 아님 → keep-alive 유지
        proxy_buffering    off;                        # ★ 핵심: 즉시 flush
        proxy_cache        off;
        gzip               off;                        # 압축 버퍼링 방지
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;                      # 토큰 사이 유휴 허용(하트비트 권장)
        proxy_send_timeout 3600s;
    }

    # API — /api/* 전부 백엔드로 (경로 버저닝 없음, ADR-0016)
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # 쿠키 Secure/스킴 인식 (SERVER_FORWARD_HEADERS_STRATEGY)
        # WebSocket 대비
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # LiveKit 시그널링을 443에 얹는다(ADR-0078).
    #
    # 미디어 스택은 자체 nginx로 7443에서 WSS를 종단하는데, 7000~7999 대역을 막는 망이 있다.
    # 실측한 학교/사내망이 그랬다 — 7443·7881·7882가 전부 무응답이고 443·3478·50000은 통과한다.
    # 그런 망에서는 WebRTC 협상 이전에 시그널링부터 못 붙어 강의 입장 자체가 실패한다.
    #
    # 443은 HTTPS라 어떤 망에서도 열려 있고, 이 서버의 STOMP WebSocket(/api/ws)이 그 망에서
    # 이미 동작하는 것을 확인했다. 새 포트를 열지 않는다.
    #
    # 7443 리스너는 그대로 둔다 — 되는 망에서는 한 홉 짧고, 문제가 생기면 URL만 되돌리면 된다.
    location /livekit/ {
        # 끝의 슬래시가 /livekit 접두사를 떼어 낸다: /livekit/rtc/v1 → /rtc/v1.
        # livekit-client는 URL 경로에 rtc·v1을 <b>이어 붙이므로</b>(appendUrlPath) 접두사를 떼지
        # 않으면 LiveKit이 모르는 경로가 되어 404다. v1.13.3이 /rtc·/rtc/v1 둘 다 받는 것을 확인했다.
        #
        # 호스트명을 그대로 쓴다(변수 아님). nginx는 리터럴 upstream을 <b>기동 시</b> 해석하므로
        # compose의 extra_hosts가 없으면 이 컨테이너가 아예 뜨지 않는다 — 위 `backend` upstream이
        # 이미 같은 성질이라 새로 생긴 위험은 아니다. 변수로 바꾸면 기동은 되지만 도커 내장 DNS가
        # /etc/hosts를 보지 않아 /livekit이 영구 502가 된다(실측 확인).
        proxy_pass         http://host.docker.internal:7880/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # 시그널링은 강의 내내 열려 있는 장수명 WebSocket이다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # 녹화강의 MP4 원본은 공용 에셋보다 구체적인 object key prefix를 쓴다.
    # 5GiB 파일을 nginx 임시 디스크에 먼저 적재하지 않고, 받는 대로 MinIO에
    # 전달한다. 경계값은 FE·Spring·media-worker와 같은 5 * 1024^3 bytes다.
    location /liveclass-assets/recorded_video_source/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       3600 always;
            add_header Content-Length 0;
            return 204;
        }
        set $minio_recorded_source http://minio:9000;
        proxy_pass         $minio_recorded_source;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_hide_header  Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # 에셋 스토리지(MinIO) presigned 프록시.
    # presigned URL이 https://jiphyeonjeon.thdwjdrl.com/liveclass-assets/... (path-style)로 서명되므로
    # 경로를 리라이트하지 않고 그대로 넘기고 Host를 보존해야 SigV4 서명이 맞는다(버킷명이 곧 경로 prefix).
    # 브라우저 presigned PUT의 CORS(프리플라이트)는 여기서 처리한다.
    location /liveclass-assets/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age       3600 always;
            add_header Content-Length 0;
            return 204;
        }
        set $minio_upstream http://minio:9000;   # 변수 → nginx가 시작 시 강제 resolve 안 함(minio 잠깐 죽어도 부팅 OK)
        proxy_pass         $minio_upstream;
        proxy_set_header   Host $host;            # ★ 서명된 Host 보존(SigV4). 경로는 그대로 전달됨.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        client_max_body_size 60m;                 # 이미지·MATERIAL 50MiB 상한 + 여유
        proxy_read_timeout 300s;
        proxy_hide_header  Access-Control-Allow-Origin;   # MinIO 것 숨기고 우리가 통제(중복 방지)
        add_header Access-Control-Allow-Origin $http_origin always;
    }

    # 녹화 스토리지(MinIO) 프록시 — HLS 세그먼트·재생목록.
    # /liveclass-assets/와 같은 이유로 Host를 보존한다(SigV4에 Host가 포함됨).
    #
    # 여기는 브라우저 GET 전용이다. Egress 업로드는 같은 호스트의 루프백(127.0.0.1:9000)으로
    # 직접 가므로 이 경로를 타지 않는다 — 세그먼트 바이트를 TLS 엣지로 왕복시키지 않는다.
    # 그래서 업로드 설정(client_max_body_size 등)이 필요 없고, SPA와 same-origin이라 CORS도 없다.
    # 세그먼트 바이트는 백엔드를 통과하지 않는다(ARCHITECTURE 원칙 4).
    location /recordings/ {
        set $minio_recordings http://minio:9000;   # 변수 → nginx 부팅 시 강제 resolve 안 함
        proxy_pass         $minio_recordings;
        proxy_set_header   Host $host;             # ★ 서명된 Host 보존(SigV4)
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering    off;                    # 세그먼트를 통째로 버퍼링하지 않고 흘려보낸다
    }
